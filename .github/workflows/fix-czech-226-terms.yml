name: Fix Czech NeoOrigins 2.2.26 terminology

on:
  push:
    branches:
      - release/0.8.0-neoorigins-2.2.26
    paths:
      - .github/workflows/fix-czech-226-terms.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/0.8.0-neoorigins-2.2.26
      - name: Apply terminology fixes
        run: python3 .github/scripts/fix_czech_226_terms.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/resourcepacks/fallback_localizations/assets/neoorigins_cs_03/lang/cs_cz.json
          git commit -m "Align Czech Caveborn terminology with Minecraft"
          git push origin HEAD:release/0.8.0-neoorigins-2.2.26
