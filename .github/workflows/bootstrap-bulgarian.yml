name: Bootstrap Bulgarian localization

on:
  push:
    branches:
      - release/0.9.0-beta
    paths:
      - scripts/bootstrap_bulgarian.py
      - .github/workflows/bootstrap-bulgarian.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-beta

      - name: Restrict add-on audits to Bulgarian
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("bg_bg",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("bg_bg",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Bulgarian NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref 860ecdb24e723983e93004ea8ceb5de90ccf0d70 --output build/bg-discovery-mc-1.21.1 --locale bg_bg
          python3 scripts/audit_neoorigins_upstream.py --ref 3c1c7365507679c836d3c14af5d4dd0654652e87 --output build/bg-discovery-mc-26.1 --locale bg_bg
          python3 scripts/audit_neoorigins_upstream.py --ref 65864716a5a796fa1c51ec3e8a6d9640abebb4ca --output build/bg-discovery-mc-26.2 --locale bg_bg

      - name: Discover Bulgarian add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Bulgarian fallback files
        run: python3 scripts/bootstrap_bulgarian.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Bulgarian NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref 860ecdb24e723983e93004ea8ceb5de90ccf0d70 --output build/bg-audit-mc-1.21.1 --locale bg_bg --fallback-namespace-glob 'neoorigins_bg_common_*' --extra-namespace neoorigins_bg_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 3c1c7365507679c836d3c14af5d4dd0654652e87 --output build/bg-audit-mc-26.1 --locale bg_bg --fallback-namespace-glob 'neoorigins_bg_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 65864716a5a796fa1c51ec3e8a6d9640abebb4ca --output build/bg-audit-mc-26.2 --locale bg_bg --fallback-namespace-glob 'neoorigins_bg_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Bulgarian add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Add Bulgarian target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeBulgarian121Translations' not in text:
              anchor = "def includeGreek121Translations = (project.findProperty('include_greek_121_translations') ?: 'true').toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Greek Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeBulgarian121Translations = (project.findProperty('include_bulgarian_121_translations') ?: 'true').toBoolean()\n", 1)
              anchor = "    inputs.property 'include_greek_121_translations', includeGreek121Translations\n"
              if anchor not in text:
                  raise SystemExit('Greek Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_bulgarian_121_translations', includeBulgarian121Translations\n", 1)
              anchor = "    if (!includeGreek121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_el_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Greek Gradle exclusion anchor not found')
              block = anchor + "\n    if (!includeBulgarian121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_bg_121/**'\n    }\n"
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Bulgarian audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bulgarian-localization-audits-${{ github.sha }}
          path: |
            build/bg-discovery-*
            build/bg-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Bulgarian translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'bg_bg.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Bulgarian translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Bulgarian localization fallback'
          git fetch origin release/0.9.0-beta
          git rebase origin/release/0.9.0-beta
          git push origin HEAD:release/0.9.0-beta
