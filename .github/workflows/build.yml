name: Build NeoOrigins Localization

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Audit NeoOrigins upstream locales
        run: python3 scripts/audit_neoorigins_upstream.py --ref v2.2.25

      - name: Audit Medieval Origins upstream locales
        run: python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-placeholders

      - name: Upload upstream locale audits
        uses: actions/upload-artifact@v4
        with:
          name: upstream-localization-audits-${{ github.sha }}
          path: |
            build/upstream-audit
            build/medievalorigins-upstream-audit
          if-no-files-found: error

      - name: Validate localization files
        run: python3 scripts/validate.py

      - name: Build mod
        run: gradle build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: neoorigins-localization-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
