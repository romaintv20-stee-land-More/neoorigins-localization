name: Refine Afrikaans localization

on:
  push:
    branches:
      - release/0.9.0-afrikaans
    paths:
      - scripts/refine_afrikaans.py
      - .github/workflows/refine-afrikaans.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-afrikaans

      - name: Apply contextual Afrikaans fixes
        run: python3 scripts/refine_afrikaans.py

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Strict Afrikaans NeoOrigins audit
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref 860ecdb24e723983e93004ea8ceb5de90ccf0d70 --output build/af-refine-audit-121 --locale af_za --fallback-namespace-glob 'neoorigins_af_common_*' --extra-namespace neoorigins_af_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 3c1c7365507679c836d3c14af5d4dd0654652e87 --output build/af-refine-audit-261 --locale af_za --fallback-namespace-glob 'neoorigins_af_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 65864716a5a796fa1c51ec3e8a6d9640abebb4ca --output build/af-refine-audit-262 --locale af_za --fallback-namespace-glob 'neoorigins_af_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict Afrikaans add-on audits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          scripts=[
            ('scripts/audit_medievalorigins_upstream.py',['--ref','1.21.1-fabric']),
            ('scripts/audit_ibarnorigins_upstream.py',['--ref','multiloader-1.21.1-new-pack-format']),
            ('scripts/audit_origins_fantasy_upstream.py',[]),
            ('scripts/audit_origins_backgrounds_upstream.py',[]),
            ('scripts/audit_origins_more_backgrounds_upstream.py',[]),
            ('scripts/audit_origins_backgrounds_iss_upstream.py',[]),
            ('scripts/audit_origins_furries_upstream.py',[]),
            ('scripts/audit_origins_classes_extended_upstream.py',[]),
            ('scripts/audit_origins_classes_iss_upstream.py',[]),
            ('scripts/audit_origin_architect_upstream.py',[]),
          ]
          originals={n:Path(n).read_text(encoding='utf-8') for n,_ in scripts}
          try:
            for name,extra in scripts:
              p=Path(name); src=originals[name]
              out,count=re.subn(r'^LOCALES\s*=.*$','LOCALES = ("af_za",)',src,count=1,flags=re.M)
              if count==0: out,count=re.subn(r'^DEFAULT_LOCALES\s*=.*$','DEFAULT_LOCALES = ("af_za",)',src,count=1,flags=re.M)
              if count!=1: raise SystemExit(f'Could not patch locale in {name}')
              p.write_text(out,encoding='utf-8')
              subprocess.run(['python3',name,*extra,'--fail-on-overlap','--fail-on-missing','--fail-on-placeholders'],check=True)
              p.write_text(src,encoding='utf-8')
          finally:
            for n,src in originals.items(): Path(n).write_text(src,encoding='utf-8')
          PY

      - name: Sanity-check corrected Afrikaans terminology
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          files=list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/af_za.json'))
          all_data={}; parts=[]
          for p in files:
              data=json.loads(p.read_text(encoding='utf-8'))
              all_data.update(data); parts.extend(str(v).lower() for v in data.values())
          text='\n'.join(parts)
          markers=len(re.findall(r'\b(?:die|jy|jou|jouself|kan|nie|met|vir|van|word|het|om|wanneer|hierdie|deur|en)\b',text))
          expected={
            'neoorigins.toggle.on':'Vermoë aangeskakel',
            'neoorigins.ultimine.no_power':'Jou Origin het nie die Ultimine-vermoë nie.',
            'gui.neoorigins.mob_creator.tab.drops':'Buit',
            'gui.neoorigins.mob_creator.tab.spawn_rules':'Verskyningsreëls',
            'gui.neoorigins.creator.apply':'Pas toe',
            'origins.neoorigins.arachnid.name':'Arachnid',
            'power.neoorigins.blazeling_nether_born.name':'Nether-gebore',
            'power.origins_furries.charge.name':'Stormloop',
            'power.origins_furries.pavlov.name':'Pavlov se refleks',
            'power.origins_furries.scales.name':'Skubbe',
            'power.origins_furries.night_vision.name':'Nagsig',
            'originsmodernui.config.hud.show_level':'Wys Origin Architect-vlak',
          }
          bad=[f'{k}={all_data.get(k)!r}' for k,v in expected.items() if all_data.get(k)!=v]
          if bad: raise SystemExit(f'Afrikaans contextual fixes missing: {bad}')
          for i in range(1,65):
              k=f'key.neoorigins.hotkey.{i}'
              want=f'Sneltoets {i:02d}'
              if all_data.get(k)!=want: raise SystemExit(f'Hotkey normalization failed: {k}={all_data.get(k)!r}')
          forbidden=['Geplavei','Doen aansoek','Onderland','Oorsprong Skepper']
          hits=[x for x in forbidden if x.lower() in text]
          if hits: raise SystemExit(f'Known Afrikaans false friends remain: {hits}')
          if markers < 3000: raise SystemExit(f'Afrikaans lexical sanity too low: {markers}')
          print(f'Afrikaans refinement sanity passed: {markers} lexical markers across {len(files)} files')
          PY

      - name: Commit refined Afrikaans translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'af_za.json' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo 'No Afrikaans refinement changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Afrikaans Minecraft terminology'
          git fetch origin release/0.9.0-afrikaans
          git rebase origin/release/0.9.0-afrikaans
          git push origin HEAD:release/0.9.0-afrikaans
