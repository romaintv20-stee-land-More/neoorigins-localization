name: Bootstrap Tatar localization

on:
  push:
    branches:
      - release/0.9.0-tatar
    paths:
      - scripts/bootstrap_tatar.py
      - .github/workflows/bootstrap-tatar.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-tatar

      - name: Restrict add-on audits to Tatar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("tt_ru",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("tt_ru",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Tatar NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/tt-discovery-mc-1.21.1 --locale tt_ru
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/tt-discovery-mc-26.1 --locale tt_ru
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/tt-discovery-mc-26.2 --locale tt_ru

      - name: Discover Tatar add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Tatar fallback files
        run: python3 scripts/bootstrap_tatar.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Tatar NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/tt-audit-mc-1.21.1 --locale tt_ru --fallback-namespace-glob 'neoorigins_tt_common_*' --extra-namespace neoorigins_tt_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/tt-audit-mc-26.1 --locale tt_ru --fallback-namespace-glob 'neoorigins_tt_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/tt-audit-mc-26.2 --locale tt_ru --fallback-namespace-glob 'neoorigins_tt_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Tatar add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Tatar text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/tt_ru.json'))
          if len(files) != 29:
              raise SystemExit(f'Expected 29 tt_ru localization files, found {len(files)}')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          cyrillic_chars = len(re.findall(r'[А-Яа-яЁёӘәӨөҮүҖҗҢңҺһ]', text))
          tatar_chars = len(re.findall(r'[ӘәӨөҮүҖҗҢңҺһ]', text))
          markers = len(re.findall(r'\b(?:һәм|өчен|белән|бу|ул|алар|сез|мөмкин|түгел|вакыт|көч|уенчы|зыян|җан|һөҗүм|куллана|кулланып|әгәр|тик|кайчан)\b', text, flags=re.I))
          if cyrillic_chars < 70000:
              raise SystemExit(f'Tatar Cyrillic sanity too low: {cyrillic_chars}')
          if tatar_chars < 1200:
              raise SystemExit(f'Tatar-specific character sanity too low: {tatar_chars}')
          if markers < 350:
              raise SystemExit(f'Tatar lexical sanity too low: {markers}')
          print(f'Tatar text sanity passed: {cyrillic_chars} Cyrillic chars, {tatar_chars} Tatar-specific letters, {markers} lexical markers across {len(files)} files')
          PY

      - name: Add Tatar target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeTatar121Translations' not in text:
              anchor = "def includeYoruba121Translations = (project.findProperty('include_yoruba_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Yoruba Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeTatar121Translations = (project.findProperty('include_tatar_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)
              anchor = "    inputs.property 'include_yoruba_121_translations', includeYoruba121Translations\n"
              if anchor not in text:
                  raise SystemExit('Yoruba Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_tatar_121_translations', includeTatar121Translations\n", 1)
              anchor = "    if (!includeYoruba121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_yo_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Yoruba Gradle exclusion anchor not found')
              block = anchor + "\n    if (!includeTatar121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_tt_121/**'\n    }\n"
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Tatar audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tatar-localization-audits-${{ github.sha }}
          path: |
            build/tt-discovery-*
            build/tt-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Tatar translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'tt_ru.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Tatar translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Tatar localization fallback'
          git fetch origin release/0.9.0-tatar
          git rebase origin/release/0.9.0-tatar
          git push origin HEAD:release/0.9.0-tatar
