name: Sync Filipino 0.9.0 metadata

on:
  push:
    branches:
      - release/0.9.0-filipino
    paths:
      - .github/workflows/sync-metadata-filipino.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-filipino

      - name: Update catalog metadata
        run: |
          python3 scripts/update_catalog_filipino.py
          python3 scripts/generate_catalog.py

      - name: Update README metadata
        run: python3 scripts/update_readme_filipino.py

      - name: Validate Filipino metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          if catalog['project']['supported_locale_count'] != 43:
              raise SystemExit('catalog locale count is not 43')
          for project in catalog['supported_projects']:
              if 'fil_ph' not in project['languages']:
                  raise SystemExit(f"fil_ph missing from {project['id']}")
          readme = Path('README.md').read_text(encoding='utf-8')
          required = ['Les quarante-trois langues', 'Filipino (`fil_ph`)', 'Pour le filipino :', '2 296/2 296', '2 307/2 307', '/ IS / FIL']
          missing = [item for item in required if item not in readme]
          if missing:
              raise SystemExit(f'README Filipino markers missing: {missing}')
          catalog_md = Path('CATALOG.md').read_text(encoding='utf-8')
          if 'fil_ph' not in catalog_md or 'Filipino' not in catalog_md:
              raise SystemExit('CATALOG.md Filipino markers missing')
          print('Filipino metadata validation passed: 43 locales')
          PY

      - name: Commit Filipino metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No Filipino metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Filipino localization in 0.9.0 beta'
          git fetch origin release/0.9.0-filipino
          git rebase origin/release/0.9.0-filipino
          git push origin HEAD:release/0.9.0-filipino
