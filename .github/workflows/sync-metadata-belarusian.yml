name: Sync Belarusian 53-locale metadata

on:
  push:
    branches:
      - release/0.9.0-belarusian
    paths:
      - .github/workflows/sync-metadata-belarusian.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-belarusian

      - name: Update catalog metadata
        run: |
          python3 scripts/update_catalog_belarusian.py
          python3 scripts/generate_catalog.py

      - name: Update README metadata
        run: python3 scripts/update_readme_belarusian.py

      - name: Validate 53-locale metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog=json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          if catalog['project']['supported_locale_count'] != 53:
              raise SystemExit('catalog locale count is not 53')
          for project in catalog['supported_projects']:
              for locale in ('mk_mk','be_by'):
                  if locale not in project['languages']:
                      raise SystemExit(f"{locale} missing from {project['id']}")
          readme=Path('README.md').read_text(encoding='utf-8')
          required=['Les cinquante-trois langues','Macédonien (`mk_mk`)','Biélorusse (`be_by`)','Pour le macédonien :','Pour le biélorusse :','/ MK / BE']
          missing=[item for item in required if item not in readme]
          if missing: raise SystemExit(f'README Belarusian markers missing: {missing}')
          catalog_md=Path('CATALOG.md').read_text(encoding='utf-8')
          for marker in ('mk_mk','be_by','Македонски','Беларуская'):
              if marker not in catalog_md:
                  raise SystemExit(f'CATALOG.md marker missing: {marker}')
          print('Belarusian 53-locale metadata validation passed')
          PY

      - name: Commit Belarusian metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No Belarusian metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Belarusian localization in 0.9.0 beta'
          git fetch origin release/0.9.0-belarusian
          git rebase origin/release/0.9.0-belarusian
          git push origin HEAD:release/0.9.0-belarusian
