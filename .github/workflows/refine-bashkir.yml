name: Refine Bashkir localization

on:
  push:
    branches:
      - release/0.9.0-bashkir
    paths:
      - scripts/refine_bashkir.py
      - .github/workflows/refine-bashkir.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-bashkir
          fetch-depth: 0

      - name: Restrict add-on audits to Bashkir
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("ba_ru",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("ba_ru",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Apply Bashkir contextual refinement
        run: python3 scripts/refine_bashkir.py

      - name: Strict audit Bashkir NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/ba-refine-mc-1.21.1 --locale ba_ru --fallback-namespace-glob 'neoorigins_ba_common_*' --extra-namespace neoorigins_ba_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/ba-refine-mc-26.1 --locale ba_ru --fallback-namespace-glob 'neoorigins_ba_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/ba-refine-mc-26.2 --locale ba_ru --fallback-namespace-glob 'neoorigins_ba_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Bashkir add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Bashkir contextual QA
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          root = Path('src/main/resources/resourcepacks/fallback_localizations/assets')
          files = list(root.glob('**/lang/ba_ru.json'))
          if len(files) != 29:
              raise SystemExit(f'Expected 29 Bashkir source files, got {len(files)}')
          merged = {}
          values = []
          for path in files:
              data = json.loads(path.read_text(encoding='utf-8'))
              merged.update(data)
              values.extend(str(v) for v in data.values())
          expected = {
              'neoorigins.toggle.on': 'Һәләт ҡабыҙылды',
              'neoorigins.toggle.off': 'Һәләт һүндерелде',
              'screen.neoorigins.choose_origin': 'Origin һайлағыҙ',
              'gui.neoorigins.detail.powers_header': 'Һәләттәр',
              'key.neoorigins.class_skill': 'Класс һәләте',
              'power.neoorigins.class_rogue_backstab.name': 'Арҡанан һуғыу',
              'power.neoorigins.dwarf_darkvision.name': 'Ҡараңғыла күреү',
              'origins.origins_fantasy.orc.name': 'Орк',
              'origins.origins_classes_iss.shadowcaster.name': 'Күләгә тылсымсыһы',
          }
          bad = {k: (merged.get(k), v) for k, v in expected.items() if merged.get(k) != v}
          if bad:
              raise SystemExit(f'Bashkir contextual overrides failed: {bad}')
          text = '\n'.join(values)
          cyrillic_chars = len(re.findall(r'[А-Яа-яЁёӘәӨөҮүҒғҠҡҢңҘҙҪҫҺһ]', text))
          bashkir_chars = len(re.findall(r'[ӘәӨөҮүҒғҠҡҢңҘҙҪҫҺһ]', text))
          markers = len(re.findall(r'\b(?:һәм|өсөн|менән|был|ул|улар|һеҙ|мөмкин|түгел|ваҡыт|көс|уйынсы|уйынсыны|зыян|йән|һөжүм|ҡуллана|ҡулланып|әгәр|тик|ҡасан|һәләт|һәләттәр|һайлағыҙ|ҡараңғыла|күреү)\b', text, flags=re.I))
          if cyrillic_chars < 70000 or bashkir_chars < 1500 or markers < 400:
              raise SystemExit(f'Bashkir contextual sanity failed: cyrillic={cyrillic_chars}, bashkir_chars={bashkir_chars}, markers={markers}')
          print(f'Bashkir contextual QA passed: {len(files)} files, {cyrillic_chars} Cyrillic chars, {bashkir_chars} Bashkir-specific letters, {markers} lexical markers')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit refined Bashkir localization
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'ba_ru.json' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo 'No Bashkir refinement changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Bashkir localization context'
          git fetch origin release/0.9.0-bashkir
          git rebase origin/release/0.9.0-bashkir
          git push origin HEAD:release/0.9.0-bashkir
