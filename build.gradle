def includeGalician121Translations = (project.findProperty('include_galician_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeHindi121Translations = (project.findProperty('include_hindi_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeNynorsk121Translations = (project.findProperty('include_nynorsk_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includePersian121Translations = (project.findProperty('include_persian_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeIcelandic121Translations = (project.findProperty('include_icelandic_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeMalay121Translations = (project.findProperty('include_malay_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeFilipino121Translations = (project.findProperty('include_filipino_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeWelsh121Translations = (project.findProperty('include_welsh_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeIrish121Translations = (project.findProperty('include_irish_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeScottishGaelic121Translations = (project.findProperty('include_scottish_gaelic_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
