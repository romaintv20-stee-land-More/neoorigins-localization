name: Smoke Lombard direct OPUS roa
on:
  push:
    branches: [release/1.0.0-lombard]
    paths: ['.github/workflows/smoke-lombard-opus-roa.yml']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers<5' sentencepiece sacremoses
      - name: Translate representative Lombard strings
        run: |
          python3 - <<'PY'
          import torch
          from transformers import AutoTokenizer, AutoModelForSeq2SeqLM
          model_id='Helsinki-NLP/opus-mt-tc-bible-big-deu_eng_fra_por_spa-roa'; target='>>lmo<<'
          tok=AutoTokenizer.from_pretrained(model_id); model=AutoModelForSeq2SeqLM.from_pretrained(model_id); model.eval()
          tests=[
            'Choose your origin',
            'Your abilities are being suppressed.',
            'Night vision is disabled on this server.',
            'You cannot wear armor higher than iron armor.',
            'The primordial soul flame burning within you instills fear in all but the bravest Piglins.',
            "Soul Sorcerers' soul fireball ability. Fires a soul fireball on effect resolution.",
          ]
          enc=tok([f'{target} {x}' for x in tests],return_tensors='pt',padding=True,truncation=True,max_length=512)
          with torch.inference_mode(): out=model.generate(**enc,num_beams=4,max_new_tokens=512,early_stopping=True)
          for s,t in zip(tests,tok.batch_decode(out,skip_special_tokens=True)):
              print(f'SOURCE: {s}\nLMO_OPUS: {t.strip()}\n---',flush=True)
          PY
