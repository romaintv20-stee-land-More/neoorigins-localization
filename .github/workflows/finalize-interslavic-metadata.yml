name: Finalize Interslavic locale metadata

on:
  workflow_run:
    workflows:
      - Build NeoOrigins Localization 1.0.0 Interslavic staging
    types:
      - completed
    branches:
      - release/1.0.0-interslavic
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/1.0.0-interslavic
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Finalize Interslavic metadata
        run: python scripts/finalize_interslavic_metadata.py

      - name: Validate JSON
        run: python scripts/validate.py

      - name: Assert metadata state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          assert catalog['project']['supported_locale_count'] == 88

          def count_locale(node):
              if isinstance(node, dict):
                  here = 1 if 'isv' in node and isinstance(node['isv'], dict) and node['isv'].get('status') == 'supported' else 0
                  return here + sum(count_locale(v) for v in node.values())
              if isinstance(node, list):
                  return sum(count_locale(v) for v in node)
              return 0

          count = count_locale(catalog)
          assert count == 11, f'Expected 11 Interslavic project locale entries, found {count}'
          neo = next(p for p in catalog['supported_projects'] if p['id'] == 'neoorigins')
          ns = neo['compatibility']['fallback_namespaces']
          assert ns['interslavic_common_glob'] == 'neoorigins_isv_common_*'
          assert ns['interslavic_mc_1_21_1'] == 'neoorigins_isv_121'
          readme = Path('README.md').read_text(encoding='utf-8')
          catalogue = Path('CATALOG.md').read_text(encoding='utf-8')
          assert 'Interslave (`isv`)' in readme
          assert 'Medžuslovjansky (`isv`)' in catalogue
          print('Interslavic metadata audit: 88 locales; isv across 11 projects; namespaces OK')
          PY

      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CATALOG.md catalog.json
          if git diff --cached --quiet; then
            echo "No metadata changes to commit"
          else
            git commit -m "Finalize Interslavic locale 88 metadata"
            git fetch origin release/1.0.0-interslavic
            git rebase origin/release/1.0.0-interslavic
            git push origin HEAD:release/1.0.0-interslavic
          fi
