name: Sync Georgian 49-locale handoff

on:
  push:
    branches:
      - release/0.9.0-georgian
    paths:
      - .github/workflows/sync-handoff-georgian.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-georgian

      - name: Update handoff
        run: python3 scripts/update_handoff_georgian.py

      - name: Validate handoff state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('PROJECT_HANDOFF.txt').read_text(encoding='utf-8')
          required=[
              '0.9.0 development currently has 49 locales:',
              '- 49: Georgian / ka_ge',
              'FORTY-NINE IS NOT THE FINAL TARGET.',
              'Georgian locale: ka_ge / ქართული.',
              'workflow run 34351329405: SUCCESS',
              'workflow run 34352011166: SUCCESS',
              'run ID 34352511589: SUCCESS on all three jobs',
              'artifact ID 10104376509',
              'artifact ID 10104341232',
              'artifact ID 10104354946',
              'NEXT LANGUAGE = language 50.',
              'Do not stop permanently at 50;',
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit(f'Handoff markers missing: {missing}')
          print('Georgian handoff validation passed: 49 locales, next 50')
          PY

      - name: Commit handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.txt
          if git diff --cached --quiet; then
            echo 'No handoff changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Georgian 0.9.0 handoff'
          git fetch origin release/0.9.0-georgian
          git rebase origin/release/0.9.0-georgian
          git push origin HEAD:release/0.9.0-georgian
