name: Finalize Igbo handoff

on:
  push:
    branches:
      - release/0.9.0-igbo
    paths:
      - scripts/finalize_igbo_handoff.py
      - .github/workflows/finalize-igbo-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-igbo
          fetch-depth: 0

      - name: Finalize Igbo handoffs
        run: python3 scripts/finalize_igbo_handoff.py

      - name: Assert handoff state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_HANDOFF.txt').read_text(encoding='utf-8')
          n = Path('NEXT_CHAT_HANDOFF.md').read_text(encoding='utf-8')
          expected_project = [
              '0.9.0 development currently has 74 locales:',
              '- 74: Igbo / ig_ng',
              'SEVENTY-FOUR IS NOT THE FINAL TARGET.',
              'IGBO / LANGUAGE #74 FINAL STATUS',
              'Language #75 is the next expansion task.',
              '34513745788', 'd95c009ade599f1ec93c3df2b03d571daf6e0f48',
              '34515088488', '4ac1335f0b4c404ca4310a68229337de1d05e8d3',
              '34515317584', '08f7f3becc3c705f0bce3883fe00904a569fa262',
              '34515339345', '6f99eb011d4207a2cee7ef9af9396deb2f075ef9',
          ]
          expected_next = [
              'first **74 languages are complete',
              '#74 Igbo — `ig_ng / Igbo`',
              'Start and finish **language #75**',
              'release/0.9.0-beta',
          ]
          for s in expected_project:
              if s not in p:
                  raise SystemExit(f'Missing PROJECT handoff assertion: {s}')
          for s in expected_next:
              if s not in n:
                  raise SystemExit(f'Missing NEXT handoff assertion: {s}')
          print('Igbo handoff assertions passed')
          PY

      - name: Validate repository JSON and whitespace
        run: |
          python3 scripts/validate.py
          git diff --check

      - name: Commit final Igbo handoffs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.txt NEXT_CHAT_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'No Igbo handoff changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Igbo localization handoff'
          git fetch origin release/0.9.0-igbo
          git rebase origin/release/0.9.0-igbo
          git push origin HEAD:release/0.9.0-igbo
