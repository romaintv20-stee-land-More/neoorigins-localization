name: Sync Kazakh 50-locale metadata

on:
  push:
    branches:
      - release/0.9.0-kazakh
    paths:
      - .github/workflows/sync-metadata-kazakh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-kazakh

      - name: Update catalog metadata
        run: |
          python3 scripts/update_catalog_kazakh.py
          python3 scripts/generate_catalog.py

      - name: Update README metadata
        run: python3 scripts/update_readme_kazakh.py

      - name: Validate 50-locale metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog=json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          if catalog['project']['supported_locale_count'] != 50:
              raise SystemExit('catalog locale count is not 50')
          for project in catalog['supported_projects']:
              for locale in ('ka_ge','kk_kz'):
                  if locale not in project['languages']:
                      raise SystemExit(f"{locale} missing from {project['id']}")
          readme=Path('README.md').read_text(encoding='utf-8')
          required=['Les cinquante langues','Géorgien (`ka_ge`)','Kazakh (`kk_kz`)','Pour le géorgien :','Pour le kazakh :','/ KA / KK']
          missing=[item for item in required if item not in readme]
          if missing: raise SystemExit(f'README Kazakh markers missing: {missing}')
          catalog_md=Path('CATALOG.md').read_text(encoding='utf-8')
          for marker in ('ka_ge','kk_kz','ქართული','Қазақша'):
              if marker not in catalog_md:
                  raise SystemExit(f'CATALOG.md marker missing: {marker}')
          print('Kazakh 50-locale metadata validation passed')
          PY

      - name: Commit Kazakh metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No Kazakh metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Kazakh localization in 0.9.0 beta'
          git fetch origin release/0.9.0-kazakh
          git rebase origin/release/0.9.0-kazakh
          git push origin HEAD:release/0.9.0-kazakh
