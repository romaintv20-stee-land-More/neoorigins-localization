name: Smoke Māori NLLB 1.3B quality

on:
  push:
    branches: [release/1.0.0-maori]
    paths: [.github/workflows/smoke-maori-13b.yml]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers<5' sentencepiece protobuf
      - name: Translate representative Māori strings
        run: |
          python3 - <<'PY'
          import torch
          from transformers import AutoTokenizer, AutoModelForSeq2SeqLM
          model_id='facebook/nllb-200-distilled-1.3B'
          src='eng_Latn'; tgt='mri_Latn'
          tests=[
            'Hotkey 12',
            'Ghaster',
            'Choose your origin',
            'Soul Sorcerer',
            'The Sand People are the people of the sand who live in the sand.',
            'Your origin cannot vein-mine.',
            'Soul Sorcerers\' soul fireball ability. Fires a soul fireball on effect resolution.',
            'Half-living half-undead amalgamates who became permanently infused with withering powers as a result of fusions with wither cores.',
          ]
          tok=AutoTokenizer.from_pretrained(model_id,src_lang=src)
          model=AutoModelForSeq2SeqLM.from_pretrained(model_id); model.eval()
          tid=tok.convert_tokens_to_ids(tgt)
          enc=tok(tests,return_tensors='pt',padding=True,truncation=True,max_length=512)
          with torch.inference_mode():
            out=model.generate(**enc,forced_bos_token_id=tid,num_beams=4,max_new_tokens=256,early_stopping=True)
          values=tok.batch_decode(out,skip_special_tokens=True)
          for s,v in zip(tests,values): print(f'SOURCE: {s}\nMAORI:  {v}\n---',flush=True)
          PY
