name: Bootstrap Northern Sami localization

on:
  push:
    branches:
      - release/1.0.0-northern-sami
    paths:
      - scripts/bootstrap_northern_sami.py
      - .github/workflows/bootstrap-northern-sami.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/1.0.0-northern-sami

      - name: Restrict add-on audits to Northern Sami
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("se_no",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("se_no",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Northern Sami NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/se-discovery-mc-1.21.1 --locale se_no
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/se-discovery-mc-26.1 --locale se_no
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/se-discovery-mc-26.2 --locale se_no

      - name: Discover Northern Sami add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Northern Sami fallback files
        run: python3 scripts/bootstrap_northern_sami.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Northern Sami NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/se-audit-mc-1.21.1 --locale se_no --fallback-namespace-glob 'neoorigins_se_common_*' --extra-namespace neoorigins_se_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/se-audit-mc-26.1 --locale se_no --fallback-namespace-glob 'neoorigins_se_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/se-audit-mc-26.2 --locale se_no --fallback-namespace-glob 'neoorigins_se_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Northern Sami add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Northern Sami text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/se_no.json'))
          if len(files) != 29:
              raise SystemExit(f'Expected 29 se_no localization files, found {len(files)}')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          latin_chars = len(re.findall(r'[A-Za-zÁáČčĐđŊŋŠšŦŧŽž]', text))
          sami_chars = len(re.findall(r'[ÁáČčĐđŊŋŠšŦŧŽž]', text))
          markers = len(re.findall(r'\b(?:ja|lea|ii|dát|don|son|mii|sii|sáhttá|go|geavahit|čájeha|olmmái|spealli|fápmu)\b', text, flags=re.I))
          if latin_chars < 70000:
              raise SystemExit(f'Northern Sami Latin sanity too low: {latin_chars}')
          if sami_chars < 500:
              raise SystemExit(f'Northern Sami-specific character sanity too low: {sami_chars}')
          if markers < 250:
              raise SystemExit(f'Northern Sami lexical sanity too low: {markers}')
          print(f'Northern Sami text sanity passed: {latin_chars} Latin chars, {sami_chars} Sami-specific letters, {markers} lexical markers across {len(files)} files')
          PY

      - name: Add Northern Sami target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeNorthernSami121Translations' not in text:
              anchor = "def includeTraditionalChinese121Translations = (project.findProperty('include_traditional_chinese_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Traditional Chinese Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeNorthernSami121Translations = (project.findProperty('include_northern_sami_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)
              anchor = "    inputs.property 'include_traditional_chinese_121_translations', includeTraditionalChinese121Translations\n"
              if anchor not in text:
                  raise SystemExit('Traditional Chinese Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_northern_sami_121_translations', includeNorthernSami121Translations\n", 1)
              anchor = "    if (!includeTraditionalChinese121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_zhtw_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Traditional Chinese Gradle exclusion anchor not found')
              block = anchor + "\n    if (!includeNorthernSami121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_se_121/**'\n    }\n"
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Northern Sami audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: northern-sami-localization-audits-${{ github.sha }}
          path: |
            build/se-discovery-*
            build/se-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Northern Sami translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'se_no.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Northern Sami translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Northern Sami localization fallback'
          git fetch origin release/1.0.0-northern-sami
          git rebase origin/release/1.0.0-northern-sami
          git push origin HEAD:release/1.0.0-northern-sami
