name: Audit Japanese Origins Furries

on:
  push:
    branches:
      - release/0.8.0-japanese
    paths:
      - src/main/resources/resourcepacks/fallback_localizations/assets/origins_furries/lang/ja_jp.json
      - scripts/audit_origins_furries_upstream.py
      - .github/workflows/audit-japanese-furries.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-japanese
      - name: Audit Origins Furries Japanese
        run: python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
