name: Smoke Kabyle generic 1.3B fallback

on:
  push:
    branches: [release/1.0.0-kabyle]
    paths: [.github/workflows/smoke-kabyle-generic-fallback.yml]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/1.0.0-kabyle
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers<5' sentencepiece protobuf
      - name: Translate known specialized-model outliers
        run: |
          python3 - <<'PY'
          import torch
          from transformers import AutoModelForSeq2SeqLM,AutoTokenizer
          model_id='facebook/nllb-200-distilled-1.3B'
          tok=AutoTokenizer.from_pretrained(model_id,src_lang='eng_Latn')
          model=AutoModelForSeq2SeqLM.from_pretrained(model_id);model.eval()
          target=tok.convert_tokens_to_ids('kab_Latn')
          tests=[
            'Can eat cobblestone, stone, granite, diorite, andesite, tuff, deepslate, cobbled deepslate, basalt, and blackstone for modest nutrition. Won\'t go down on a full stomach.',
            'Spawn with an Efficiency I stone pickaxe.',
            'Immune to Regeneration, Instant Health, and Poison. Other potion effects still apply.',
            'A master of death who commands undead minions — wither skeletons and archers fight at your side, but your own life force is bound to theirs.',
            'A warper of gravitational fields who bends space itself. Pull enemies into a crushing singularity or blast them away — but your own body is untethered from the earth.',
            'Toggle: walk through solid blocks. While inside a block, fly freely (jump = up, shift = down). Obsidian, crying obsidian, and bedrock block your passage. Phasing drains hunger.',
            'Tamed %s mobs!',
          ]
          enc=tok(tests,return_tensors='pt',padding=True,truncation=True,max_length=512)
          with torch.inference_mode():
              out=model.generate(**enc,forced_bos_token_id=target,num_beams=4,max_new_tokens=512,early_stopping=True)
          for s,t in zip(tests,tok.batch_decode(out,skip_special_tokens=True)):
              print(f'SOURCE: {s}\nGENERIC_KAB: {t.strip()}\n---',flush=True)
          PY
