name: Finalize Somali handoff

on:
  push:
    branches: [ release/0.9.0-somali ]
    paths:
      - scripts/finalize_somali_handoff.py
      - .github/workflows/finalize-somali-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.9.0-somali
          fetch-depth: 0

      - name: Finalize Somali handoffs
        run: python3 scripts/finalize_somali_handoff.py

      - name: Assert final handoff state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = Path('PROJECT_HANDOFF.txt').read_text(encoding='utf-8')
          nxt = Path('NEXT_CHAT_HANDOFF.md').read_text(encoding='utf-8')

          project_checks = [
              '0.9.0 development currently has 62 locales:',
              'lb_lu, so_so.',
              '- 62: Somali / so_so',
              'SIXTY-TWO IS NOT THE FINAL TARGET.',
              '54. SOMALI 0.9.0 STATUS',
              'Somali locale: so_so / Soomaali.',
              '55. NEXT ACTION',
              'NEXT LANGUAGE = language 63.',
              'Do not stop permanently at 62',
              '34414684602',
              '4ef3c76ee4eb90410a4290b762f878a904fbeba4',
              '102676812909',
              '102676812737',
              '102676812914',
              '10128628531',
              '10128619805',
              '10128622615',
              '1380b3b6ca0c2fad4f4ac399fd99858be81360895fdda9cf49b81d955e4ad682',
              '2c25043e0c71aed732445e649f32ba4a825da96bd5f86875083daa8d81673b7a',
              'f99577159cc34c22b21f15fec69e4d96569d030c2cca426495ddfa50f4b32c45',
              '92b75187336e45187a12d1848285be8eddae970829dc6f43cd7916d6d79de092',
              'b388eb7155a55945791efac7fd39b7b1ee552915fd19fada0916ed86a18b912e',
              '337e753ed7477f526825468a547412bd2770b351bd034eeb77bc93fdbdecc888',
              'Aragtida Habeenka',
              'Qolofyo',
              'Falcelinta Pavlov',
          ]
          next_checks = [
              'Completed language count: **62**.',
              'Last completed language: **#62 Somali — `so_so / Soomaali`**.',
              'Next language: **#63**.',
              '34414684602',
              '4ef3c76ee4eb90410a4290b762f878a904fbeba4',
              '102676812909',
              '102676812737',
              '102676812914',
              '10128628531',
              '10128619805',
              '10128622615',
              '1380b3b6ca0c2fad4f4ac399fd99858be81360895fdda9cf49b81d955e4ad682',
              '2c25043e0c71aed732445e649f32ba4a825da96bd5f86875083daa8d81673b7a',
              'f99577159cc34c22b21f15fec69e4d96569d030c2cca426495ddfa50f4b32c45',
              'Aragtida Habeenka',
              'Qolofyo',
              'Falcelinta Pavlov',
          ]
          for item in project_checks:
              if item not in project:
                  raise SystemExit(f'PROJECT_HANDOFF assertion missing: {item!r}')
          for item in next_checks:
              if item not in nxt:
                  raise SystemExit(f'NEXT_CHAT_HANDOFF assertion missing: {item!r}')
          print('Somali handoff assertions passed.')
          PY
          git diff --check

      - name: Commit final handoffs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.txt NEXT_CHAT_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'No handoff changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Somali handoff and prepare language 63'
          git fetch origin release/0.9.0-somali
          git rebase origin/release/0.9.0-somali
          git push origin HEAD:release/0.9.0-somali
