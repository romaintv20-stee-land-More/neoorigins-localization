name: Push final Ukrainian translations

on:
  push:
    branches: [ release/0.8.0-ukrainian ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-ukrainian
      - name: Write final translations
        shell: bash
        run: |
          mkdir -p src/main/resources/resourcepacks/fallback_localizations/assets/origins_fantasy/lang
          mkdir -p src/main/resources/resourcepacks/fallback_localizations/assets/medievalorigins/lang
          echo '' | base64 -d | gzip -dc > src/main/resources/resourcepacks/fallback_localizations/assets/origins_fantasy/lang/uk_ua.json
          echo '' | base64 -d | gzip -dc > src/main/resources/resourcepacks/fallback_localizations/assets/medievalorigins/lang/uk_ua.json
      - name: Commit translations
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/resources/resourcepacks/fallback_localizations/assets/origins_fantasy/lang/uk_ua.json src/main/resources/resourcepacks/fallback_localizations/assets/medievalorigins/lang/uk_ua.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: add final Ukrainian addon translations'
          git push origin HEAD:release/0.8.0-ukrainian
