name: Run 26.1.x promotion

on:
  push:
    branches: [ work/070-26-1-batch1 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/070-26-1-batch1
          fetch-depth: 0

      - name: Update catalog metadata
        run: python3 scripts/promote_26_1_batch1.py

      - name: Validate localization files
        run: python3 scripts/validate.py

      - name: Commit generated catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json CATALOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Update catalog for 0.7.0 on 26.1.x"
            git push origin HEAD:work/070-26-1-batch1
          fi
