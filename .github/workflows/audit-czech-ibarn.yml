name: Audit Czech ibarn Origins

on:
  push:
    branches:
      - release/0.8.0-czech
    paths:
      - .github/workflows/audit-czech-ibarn.yml
      - scripts/audit_ibarnorigins_upstream.py
      - src/main/resources/resourcepacks/fallback_localizations/assets/ibarnorigins/lang/cs_cz.json
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate localization JSON
        run: python3 scripts/validate.py
      - name: Audit Czech ibarn Origins
        run: python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --output build/czech-ibarn-audit --fail-on-overlap --fail-on-missing --fail-on-placeholders
      - name: Verify exact Czech key count
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          url = 'https://raw.githubusercontent.com/ibarn-Recreational/ibarn-origins-addon/multiloader-1.21.1-new-pack-format/common/src/main/resources/assets/ibarnorigins/lang/en_us.json'
          with urllib.request.urlopen(url) as r:
              en = json.load(r)
          path = 'src/main/resources/resourcepacks/fallback_localizations/assets/ibarnorigins/lang/cs_cz.json'
          with open(path, encoding='utf-8') as f:
              cs = json.load(f)
          assert len(en) == 69, len(en)
          assert set(cs) == set(en), (len(cs), len(en), sorted(set(en)-set(cs))[:10], sorted(set(cs)-set(en))[:10])
          token = re.compile(r'%(?:\d+\$)?[sd]')
          errors = []
          for key in en:
              a = sorted(token.findall(str(en[key])))
              b = sorted(token.findall(str(cs[key])))
              if a != b:
                  errors.append((key, a, b))
          assert not errors, errors[:20]
          print(f'Czech ibarn Origins: {len(cs)}/{len(en)} keys; placeholders OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: czech-ibarn-audit
          path: build/czech-ibarn-audit
