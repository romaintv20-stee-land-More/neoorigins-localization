name: Bootstrap Asturian localization

on:
  push:
    branches:
      - release/0.9.0-asturian
    paths:
      - scripts/bootstrap_asturian.py
      - .github/workflows/bootstrap-asturian.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-asturian

      - name: Restrict add-on audits to Asturian
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("ast_es",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("ast_es",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Asturian NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/ast-discovery-mc-1.21.1 --locale ast_es
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/ast-discovery-mc-26.1 --locale ast_es
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/ast-discovery-mc-26.2 --locale ast_es

      - name: Discover Asturian add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Asturian fallback files
        run: python3 scripts/bootstrap_asturian.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Asturian NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/ast-audit-mc-1.21.1 --locale ast_es --fallback-namespace-glob 'neoorigins_ast_common_*' --extra-namespace neoorigins_ast_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/ast-audit-mc-26.1 --locale ast_es --fallback-namespace-glob 'neoorigins_ast_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/ast-audit-mc-26.2 --locale ast_es --fallback-namespace-glob 'neoorigins_ast_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Asturian add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Asturian text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/ast_es.json'))
          if not files:
              raise SystemExit('No ast_es localization files found')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          latin_chars = len(re.findall(r'[A-Za-zÀ-ÿ]', text))
          asturian_signals = len(re.findall(r"(?:á|é|í|ó|ú|ñ|ü|Á|É|Í|Ó|Ú|Ñ|Ü|ll|Ll|x|X)", text))
          markers = len(re.findall(r"\b(?:el|la|los|les|un|una|del|nel|na|nun|non|sí|pa|por|con|ensin|ye|son|dende|facer|mundu|xugador|sirvidor|llingua|pue|puede|vida|poder)\b", text, flags=re.I))
          print(f'Asturian sanity counts: {latin_chars} Latin chars, {asturian_signals} Asturian orthographic signals, {markers} lexical markers across {len(files)} files')
          if latin_chars < 70000:
              raise SystemExit(f'Asturian Latin-script sanity too low: {latin_chars}')
          if asturian_signals < 900:
              raise SystemExit(f'Asturian orthographic-signal sanity too low: {asturian_signals}')
          if markers < 750:
              print(f'Asturian lexical diagnostic is low ({markers}); retaining as non-blocking because the small marker list is not a reliable hard language classifier.')
          print('Asturian text sanity passed')
          PY

      - name: Add Asturian target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeAsturian121Translations' not in text:
              anchor = "def includeBreton121Translations = (project.findProperty('include_breton_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Breton Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeAsturian121Translations = (project.findProperty('include_asturian_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)
              anchor = "    inputs.property 'include_breton_121_translations', includeBreton121Translations\n"
              if anchor not in text:
                  raise SystemExit('Breton Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_asturian_121_translations', includeAsturian121Translations\n", 1)
              anchor = "    if (!includeBreton121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_br_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Breton Gradle exclusion anchor not found')
              block = anchor + "\n    if (!includeAsturian121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_ast_121/**'\n    }\n"
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Asturian audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asturian-localization-audits-${{ github.sha }}
          path: |
            build/ast-discovery-*
            build/ast-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Asturian translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'ast_es.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Asturian translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Asturian localization fallback'
          git fetch origin release/0.9.0-asturian
          git rebase origin/release/0.9.0-asturian
          git push origin HEAD:release/0.9.0-asturian
