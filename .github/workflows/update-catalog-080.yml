name: Update 0.8.0 catalog

on:
  push:
    branches: [ release/0.8.0-classes-iss ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/0.8.0-classes-iss

      - name: Update catalog
        run: python3 scripts/update_catalog_080_classes.py

      - name: Commit catalog if changed
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Add remaining 0.8.0 class add-ons to catalog"
          git push origin HEAD:release/0.8.0-classes-iss
