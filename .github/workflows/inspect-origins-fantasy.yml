name: Inspect Origins Fantasy

on:
  push:
    branches: [ work/070-origins-fantasy ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install translation dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install 'torch>=2.4' 'transformers>=4.46,<5' sentencepiece

      - name: Fetch Origins Fantasy 1.1.3 and generate NLLB drafts
        run: |
          python3 - <<'PY'
          import html, json, re, urllib.request, zipfile
          from pathlib import Path
          import torch
          from transformers import AutoModelForSeq2SeqLM, AutoTokenizer

          project_url = 'https://www.curseforge.com/minecraft/mc-mods/origins-fantsy-neoorigins/files/all?page=1&pageSize=50'
          req = urllib.request.Request(project_url, headers={'User-Agent': 'Mozilla/5.0'})
          text = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
          name = 'Origins-Fantasy-1.21.1-NeoOrigins-1.1.3.jar'
          candidates = []
          for m in re.finditer(r'href="([^"]*/files/(\d+)[^"]*)"[^>]*>[^<]*' + re.escape(name), text):
              candidates.append((m.group(2), html.unescape(m.group(1))))
          if not candidates:
              for pos in [m.start() for m in re.finditer(re.escape(name), text)]:
                  chunk = text[max(0, pos-4000):pos+1000]
                  ids = re.findall(r'/files/(\d+)', chunk)
                  if ids:
                      candidates.append((ids[-1], ''))
          if not candidates:
              raise SystemExit('Could not find current CurseForge file id')

          file_id = candidates[0][0]
          a, b = file_id[:-3], file_id[-3:]
          urls = [
              f'https://edge.forgecdn.net/files/{a}/{b}/{name}',
              f'https://mediafilez.forgecdn.net/files/{a}/{b}/{name}',
              f'https://www.curseforge.com/minecraft/mc-mods/origins-fantsy-neoorigins/download/{file_id}/file',
          ]
          data = None
          used_url = None
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Referer': 'https://www.curseforge.com/', 'Accept': '*/*'})
                  candidate = urllib.request.urlopen(req, timeout=60).read()
                  if candidate[:2] == b'PK':
                      data, used_url = candidate, url
                      break
              except Exception as exc:
                  print('Download failed:', url, type(exc).__name__, exc)
          if data is None:
              raise SystemExit('Unable to download current Origins Fantasy JAR')

          out = Path('build/origins-fantasy-inspection')
          out.mkdir(parents=True, exist_ok=True)
          jar = Path('build/fantasy.jar')
          jar.write_bytes(data)
          with zipfile.ZipFile(jar) as z:
              en = json.loads(z.read('assets/origins_fantasy/lang/en_us.json').decode('utf-8'))
              mod_toml = z.read('META-INF/neoforge.mods.toml').decode('utf-8')
              lang_entries = sorted(n for n in z.namelist() if '/lang/' in n and n.endswith('.json'))
          (out/'en_us.json').write_text(json.dumps(en, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          (out/'neoforge.mods.toml').write_text(mod_toml, encoding='utf-8')
          (out/'metadata.json').write_text(json.dumps({'file_id': file_id, 'filename': name, 'download_url': used_url, 'english_keys': len(en), 'upstream_lang_files': lang_entries}, indent=2)+'\n', encoding='utf-8')

          targets = {
              'fr_fr': 'fra_Latn', 'de_de': 'deu_Latn', 'es_es': 'spa_Latn', 'pt_br': 'por_Latn', 'nl_nl': 'nld_Latn',
              'it_it': 'ita_Latn', 'pl_pl': 'pol_Latn', 'ru_ru': 'rus_Cyrl', 'tr_tr': 'tur_Latn', 'zh_cn': 'zho_Hans'
          }
          requires = {
              'fr_fr': 'Nécessite', 'de_de': 'Benötigt', 'es_es': 'Requiere', 'pt_br': 'Requer', 'nl_nl': 'Vereist',
              'it_it': 'Richiede', 'pl_pl': 'Wymaga', 'ru_ru': 'Требуется', 'tr_tr': 'Gerektirir', 'zh_cn': '需要'
          }

          model_name = 'facebook/nllb-200-distilled-600M'
          tokenizer = AutoTokenizer.from_pretrained(model_name, src_lang='eng_Latn')
          model = AutoModelForSeq2SeqLM.from_pretrained(model_name)
          model.eval()

          def protect(s):
              return (s.replace("Iron's Spells n Spellbooks", 'IRONSSPELLSBOOKS')
                       .replace('Somake Spells', 'SOMAKESPELLS')
                       .replace('y=50', 'YLEVELFIFTY')
                       .replace('y level zero', 'YLEVELZERO')
                       .replace('TNT', 'TNTTOKEN'))
          def restore(s):
              return (s.replace('IRONSSPELLSBOOKS', "Iron's Spells n Spellbooks")
                       .replace('SOMAKESPELLS', 'Somake Spells')
                       .replace('YLEVELFIFTY', 'y=50')
                       .replace('YLEVELZERO', 'y level zero')
                       .replace('TNTTOKEN', 'TNT'))

          items = list(en.items())
          drafts = out/'drafts'
          drafts.mkdir(exist_ok=True)
          for locale, tgt in targets.items():
              translated = {}
              forced_bos = tokenizer.convert_tokens_to_ids(tgt)
              batch_size = 16
              for start in range(0, len(items), batch_size):
                  batch = items[start:start+batch_size]
                  texts = [protect(v) for _, v in batch]
                  enc = tokenizer(texts, return_tensors='pt', padding=True, truncation=True, max_length=256)
                  with torch.inference_mode():
                      generated = model.generate(**enc, forced_bos_token_id=forced_bos, max_new_tokens=256, num_beams=4)
                  pieces = tokenizer.batch_decode(generated, skip_special_tokens=True)
                  for (key, original), value in zip(batch, pieces):
                      value = restore(value.strip())
                      if "Iron's Spells n Spellbooks" in original:
                          value = re.sub(r'\([^)]*Iron\'s Spells n Spellbooks[^)]*\)', f"({requires[locale]} Iron's Spells n Spellbooks)", value)
                      if 'Somake Spells' in original:
                          value = re.sub(r'\([^)]*Somake Spells[^)]*\)', f"({requires[locale]} Somake Spells)", value)
                      translated[key] = value
              (drafts/f'{locale}.json').write_text(json.dumps(translated, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
              print(locale, len(translated))
          PY

      - name: Upload inspection and drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origins-fantasy-nllb-${{ github.sha }}
          path: build/origins-fantasy-inspection
          if-no-files-found: error
