name: Sync NeoOrigins 26.1 locale delta

on:
  push:
    branches: [ release/0.8.0-neoorigins-2.2.26 ]
    paths: [ .github/workflows/sync-26-1-delta.yml ]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-neoorigins-2.2.26
      - name: Copy validated 26.x translations into 26.1 delta
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('src/main/resources/resourcepacks/fallback_localizations/assets')
          src = root / 'neoorigins_26_2' / 'lang'
          dst = root / 'neoorigins_26_1' / 'lang'
          dst.mkdir(parents=True, exist_ok=True)
          common = {'emi.neoorigins.orb_of_origin.info', 'key.category.neoorigins.hotkeys', 'key.neoorigins.skill_5', 'key.neoorigins.skill_6'} | {f'key.neoorigins.hotkey.{i}' for i in range(1, 65)}
          config = {
            'neoorigins.configuration.always_show_ability_icons',
            'neoorigins.configuration.cooldown_countdown_opacity',
            'neoorigins.configuration.hud_ability_display',
            'neoorigins.configuration.section.neoorigins.admin.toml',
            'neoorigins.configuration.section.neoorigins.admin.toml.title',
            'neoorigins.configuration.section.neoorigins.client.toml',
            'neoorigins.configuration.section.neoorigins.client.toml.title',
            'neoorigins.configuration.section.neoorigins.content.toml',
            'neoorigins.configuration.section.neoorigins.content.toml.title',
            'neoorigins.configuration.section.neoorigins.gameplay.toml',
            'neoorigins.configuration.section.neoorigins.gameplay.toml.title',
            'neoorigins.configuration.section.neoorigins.power.overrides.toml',
            'neoorigins.configuration.section.neoorigins.power.overrides.toml.title',
            'neoorigins.configuration.show_cooldown_countdown',
          }
          official_locales = ('fr_fr','de_de','es_es','pt_br','it_it','pl_pl','ru_ru','zh_cn')
          full_fallback_locales = ('nl_nl','tr_tr','cs_cz')
          for locale in official_locales:
              data = json.loads((src / f'{locale}.json').read_text(encoding='utf-8'))
              missing = common - set(data)
              if missing:
                  raise SystemExit(f'{locale}: source 26.2 delta missing common keys: {sorted(missing)}')
              out = {k: data[k] for k in data if k in common}
              if set(out) != common or len(out) != 68:
                  raise SystemExit(f'{locale}: bad common delta: {len(out)}')
              (dst / f'{locale}.json').write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          for locale in full_fallback_locales:
              data = json.loads((src / f'{locale}.json').read_text(encoding='utf-8'))
              missing = config - set(data)
              if missing:
                  raise SystemExit(f'{locale}: source 26.2 delta missing config keys: {sorted(missing)}')
              out = {k: data[k] for k in data if k in config}
              if set(out) != config or len(out) != 14:
                  raise SystemExit(f'{locale}: bad config delta: {len(out)}')
              (dst / f'{locale}.json').write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('26.1 delta created: 8x68 + 3x14 keys')
          PY
      - name: Commit generated delta
        run: |
          git config user.name 'romaintv-Steel-and-More'
          git config user.email '130081555+romaintv20-stee-land-More@users.noreply.github.com'
          git add src/main/resources/resourcepacks/fallback_localizations/assets/neoorigins_26_1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add NeoOrigins 26.1-specific fallback delta'
          git push origin HEAD:release/0.8.0-neoorigins-2.2.26
