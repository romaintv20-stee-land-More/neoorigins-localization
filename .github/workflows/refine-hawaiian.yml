name: Refine Hawaiian localization

on:
  push:
    branches:
      - release/1.0.0-hawaiian
    paths:
      - scripts/refine_hawaiian.py
      - scripts/refine_hawaiian_core.py
      - .github/workflows/refine-hawaiian.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/1.0.0-hawaiian

      - name: Restrict add-on audits to Hawaiian
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("haw_us",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("haw_us",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Hawaiian NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/haw-discovery-mc-1.21.1 --locale haw_us
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/haw-discovery-mc-26.1 --locale haw_us
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/haw-discovery-mc-26.2 --locale haw_us

      - name: Discover Hawaiian add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Refine Hawaiian fallback files
        run: python3 scripts/refine_hawaiian.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Hawaiian NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/haw-audit-mc-1.21.1 --locale haw_us --fallback-namespace-glob 'neoorigins_haw_common_*' --extra-namespace neoorigins_haw_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/haw-audit-mc-26.1 --locale haw_us --fallback-namespace-glob 'neoorigins_haw_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/haw-audit-mc-26.2 --locale haw_us --fallback-namespace-glob 'neoorigins_haw_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Hawaiian add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate localization JSON
        run: python3 scripts/validate.py

      - name: Verify Hawaiian refinement structure
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/haw_us.json'))
          if len(files) != 29:
              raise SystemExit(f'Expected 29 haw_us localization files, found {len(files)}')
          total = 0
          for path in files:
              data = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(data, dict):
                  raise SystemExit(f'Unexpected Hawaiian JSON payload in {path}')
              total += len(data)
              text = '\n'.join(str(value) for value in data.values())
              if 'ZXQTK' in text or 'ZXQSEP' in text or any(0xE000 <= ord(ch) <= 0xF8FF for ch in text):
                  raise SystemExit(f'Temporary translation marker survived in {path}')
          print(f'Hawaiian refinement structure passed: 29 files, {total} values, no temporary markers')
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Hawaiian refinement reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hawaiian-refinement-audits-${{ github.sha }}
          path: |
            build/haw-discovery-*
            build/haw-audit-*
            build/*-upstream-audit
            build/hawaiian-google-cache.json
          if-no-files-found: warn

      - name: Commit validated Hawaiian refinement
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'haw_us.json' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo 'No Hawaiian refinement changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Hawaiian localization'
          git fetch origin release/1.0.0-hawaiian
          git rebase origin/release/1.0.0-hawaiian
          git push origin HEAD:release/1.0.0-hawaiian
