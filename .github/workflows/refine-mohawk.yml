name: Refine Mohawk localization
on:
  push:
    branches: [release/1.0.0-mohawk]
    paths: [scripts/refine_mohawk.py, .github/workflows/refine-mohawk.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with: {ref: release/1.0.0-mohawk}
      - name: Set up Python
        uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install Mohawk translation runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers<5' sentencepiece sacremoses
      - name: Restrict add-on audits to Mohawk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=['scripts/audit_medievalorigins_upstream.py','scripts/audit_ibarnorigins_upstream.py','scripts/audit_origins_fantasy_upstream.py','scripts/audit_origins_backgrounds_upstream.py','scripts/audit_origins_more_backgrounds_upstream.py','scripts/audit_origins_backgrounds_iss_upstream.py','scripts/audit_origins_furries_upstream.py','scripts/audit_origins_classes_extended_upstream.py','scripts/audit_origins_classes_iss_upstream.py','scripts/audit_origin_architect_upstream.py']
          for f in files:
              p=Path(f);t=p.read_text(encoding='utf-8');u,n=re.subn(r'^LOCALES\s*=.*$','LOCALES = ("moh_ca",)',t,count=1,flags=re.M)
              if n==0:u,n=re.subn(r'^DEFAULT_LOCALES\s*=.*$','DEFAULT_LOCALES = ("moh_ca",)',t,count=1,flags=re.M)
              if n!=1:raise SystemExit(f'Could not patch {f}')
              p.write_text(u,encoding='utf-8')
          PY
      - name: Discover Mohawk NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/moh-discovery-mc-1.21.1 --locale moh_ca
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/moh-discovery-mc-26.1 --locale moh_ca
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/moh-discovery-mc-26.2 --locale moh_ca
      - name: Discover Mohawk add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py
      - name: Refine Mohawk fallback files
        run: python3 scripts/refine_mohawk.py
      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune
      - name: Strict audit Mohawk NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/moh-audit-mc-1.21.1 --locale moh_ca --fallback-namespace-glob 'neoorigins_moh_common_*' --extra-namespace neoorigins_moh_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/moh-audit-mc-26.1 --locale moh_ca --fallback-namespace-glob 'neoorigins_moh_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/moh-audit-mc-26.2 --locale moh_ca --fallback-namespace-glob 'neoorigins_moh_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders
      - name: Strict audit Mohawk add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
      - name: Validate localization JSON
        run: python3 scripts/validate.py
      - name: Verify Mohawk refinement structure
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/moh_ca.json'))
          if len(files)!=29:raise SystemExit(f'Expected 29 moh_ca files, found {len(files)}')
          total=0
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8'));total+=len(d)
              if any('>>moh<<' in str(v) for v in d.values()):raise SystemExit(f'OPUS marker survived in {p}')
          print(f'Mohawk refinement structure passed: 29 files, {total} values')
          PY
      - name: Check whitespace
        run: git diff --check
      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py
      - name: Upload Mohawk refinement reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mohawk-refinement-audits-${{ github.sha }}
          path: |
            build/moh-discovery-*
            build/moh-audit-*
            build/*-upstream-audit
          if-no-files-found: warn
      - name: Commit validated Mohawk refinement
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'moh_ca.json' -print0 | xargs -0 -r git add
          if git diff --cached --quiet;then echo 'No Mohawk refinement changes to commit.';exit 0;fi
          git commit -m 'Refine Mohawk localization'
          git fetch origin release/1.0.0-mohawk
          git rebase origin/release/1.0.0-mohawk
          git push origin HEAD:release/1.0.0-mohawk
