name: Finalize Luxembourgish handoff

on:
  push:
    branches: [ release/0.9.0-luxembourgish ]
    paths:
      - scripts/finalize_luxembourgish_handoff.py
      - .github/workflows/finalize-luxembourgish-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.9.0-luxembourgish
          fetch-depth: 0

      - name: Finalize Luxembourgish handoffs
        run: python3 scripts/finalize_luxembourgish_handoff.py

      - name: Assert final handoff state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project=Path('PROJECT_HANDOFF.txt').read_text(encoding='utf-8')
          nxt=Path('NEXT_CHAT_HANDOFF.md').read_text(encoding='utf-8')
          checks = [
              ('PROJECT 61 locale count', '0.9.0 development currently has 61 locales:' in project),
              ('PROJECT locale list lb_lu', 'uz_uz, mt_mt, lb_lu.' in project),
              ('PROJECT #61 section', '53. LUXEMBOURGISH 0.9.0 STATUS' in project),
              ('PROJECT next #62', 'NEXT LANGUAGE = language 62.' in project),
              ('PROJECT build run', 'build run: 34411581514' in project),
              ('PROJECT 1.21.1 hash', '13a4193011778e243d4003f8f7acfaf3979df5dbc44c64e779abb22da65974c3' in project),
              ('PROJECT 26.1 hash', '1f1f6e49f32c3127b27fe2a795f4a9c958b2173bf3a433058777c93eb7384f4a' in project),
              ('PROJECT 26.2 hash', '554e1159fbfbc2dba1978976dbc6b9ab60825c86ae252ca26ea055bdb2ef82ec' in project),
              ('NEXT completed 61', 'Completed language count: **61**.' in nxt),
              ('NEXT last #61', 'Last completed language: **#61 Luxembourgish' in nxt),
              ('NEXT next #62', 'Next language: **#62**.' in nxt),
              ('NEXT bootstrap proof', '34410661769' in nxt and '10127180809' in nxt),
              ('NEXT refinement proof', '34411346403' in nxt and '10127342267' in nxt),
              ('NEXT build proof', '34411581514' in nxt and '10127486985' in nxt and '10127468957' in nxt and '10127470282' in nxt),
              ('NEXT contextual terms', all(x in nxt for x in ('Nuechtsiicht','Netherit','Fäegkeeten','Schnelltast'))),
          ]
          failed=[name for name,ok in checks if not ok]
          if failed: raise SystemExit('Handoff assertions failed: '+', '.join(failed))
          print('All Luxembourgish handoff assertions passed; next language 62.')
          PY
          git diff --check

      - name: Commit final handoffs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.txt NEXT_CHAT_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'No handoff changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Luxembourgish handoff and prepare language 62'
          git fetch origin release/0.9.0-luxembourgish
          git rebase origin/release/0.9.0-luxembourgish
          git push origin HEAD:release/0.9.0-luxembourgish
