name: Finalize Tagalog metadata

on:
  push:
    branches: [ release/0.9.0-tagalog ]
    paths:
      - scripts/finalize_tagalog_metadata.py
      - .github/workflows/finalize-tagalog-metadata.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.9.0-tagalog
          fetch-depth: 0

      - name: Synchronize Tagalog catalog and README metadata
        run: python3 scripts/finalize_tagalog_metadata.py

      - name: Assert 66-language metadata state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          assert catalog['project']['supported_locale_count'] == 66
          count = 0
          def walk(obj):
              global count
              if isinstance(obj, dict):
                  if 'tl_ph' in obj and isinstance(obj['tl_ph'], dict) and obj['tl_ph'].get('name') == 'Tagalog':
                      count += 1
                  for value in obj.values(): walk(value)
              elif isinstance(obj, list):
                  for value in obj: walk(value)
          walk(catalog)
          assert count >= 11, count
          neo = next(x for x in catalog['supported_projects'] if x.get('id') == 'neoorigins')
          ns = neo['compatibility']['fallback_namespaces']
          assert ns['tagalog_common_glob'] == 'neoorigins_tl_common_*'
          assert ns['tagalog_mc_1_21_1'] == 'neoorigins_tl_121'
          readme = Path('README.md').read_text(encoding='utf-8')
          assert readme.count('| 66 |') == 3
          assert 'Tagalog (`tl_ph`)' in readme
          assert 'Pour le tagalog :' in readme
          assert 'Les soixante-six langues' in readme
          catalogue = Path('CATALOG.md').read_text(encoding='utf-8')
          assert catalogue.count('Tagalog (`tl_ph`)') >= 11
          print(f'Metadata assertions passed: 66 locales, {count} Tagalog catalog entries.')
          PY

      - name: Validate JSON and whitespace
        run: |
          python3 scripts/validate.py
          git diff --check

      - name: Commit Tagalog metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Tagalog localization in 0.9.0 beta'
          git fetch origin release/0.9.0-tagalog
          git rebase origin/release/0.9.0-tagalog
          git push origin HEAD:release/0.9.0-tagalog
