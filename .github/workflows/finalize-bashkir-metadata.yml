name: Finalize Bashkir metadata

on:
  push:
    branches: [ release/0.9.0-bashkir ]
    paths:
      - scripts/finalize_bashkir_metadata.py
      - .github/workflows/finalize-bashkir-metadata.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.9.0-bashkir
          fetch-depth: 0

      - name: Synchronize Bashkir catalog and README metadata
        run: python3 scripts/finalize_bashkir_metadata.py

      - name: Assert 69-language metadata state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          assert catalog['project']['supported_locale_count'] == 69
          count = 0
          def walk(obj):
              global count
              if isinstance(obj, dict):
                  if 'ba_ru' in obj and isinstance(obj['ba_ru'], dict) and obj['ba_ru'].get('name') == 'Башҡортса':
                      count += 1
                  for value in obj.values(): walk(value)
              elif isinstance(obj, list):
                  for value in obj: walk(value)
          walk(catalog)
          assert count >= 11, count
          neo = next(x for x in catalog['supported_projects'] if x.get('id') == 'neoorigins')
          ns = neo['compatibility']['fallback_namespaces']
          assert ns['bashkir_common_glob'] == 'neoorigins_ba_common_*'
          assert ns['bashkir_mc_1_21_1'] == 'neoorigins_ba_121'
          readme = Path('README.md').read_text(encoding='utf-8')
          assert readme.count('| 69 |') == 3
          assert 'Bachkir (`ba_ru`)' in readme
          assert 'Pour le bachkir :' in readme
          assert 'Les soixante-neuf langues' in readme
          catalogue = Path('CATALOG.md').read_text(encoding='utf-8')
          assert catalogue.count('Башҡортса (`ba_ru`)') >= 11
          print(f'Metadata assertions passed: 69 locales, {count} Bashkir catalog entries.')
          PY

      - name: Validate JSON and whitespace
        run: |
          python3 scripts/validate.py
          git diff --check

      - name: Commit Bashkir metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Bashkir localization in 0.9.0 beta'
          git fetch origin release/0.9.0-bashkir
          git rebase origin/release/0.9.0-bashkir
          git push origin HEAD:release/0.9.0-bashkir
