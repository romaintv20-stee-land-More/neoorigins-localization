name: Sync Irish 46-locale handoff

on:
  push:
    branches:
      - release/0.9.0-irish
    paths:
      - .github/workflows/sync-handoff-irish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-irish

      - name: Update handoff
        run: python3 scripts/update_handoff_irish.py

      - name: Validate handoff state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('PROJECT_HANDOFF.txt').read_text(encoding='utf-8')
          required = [
              '0.9.0 development currently has 46 locales:',
              '- 46: Irish / ga_ie',
              'FORTY-SIX IS NOT THE FINAL TARGET.',
              'Irish locale: ga_ie / Gaeilge.',
              'workflow run 34341089048: SUCCESS',
              'workflow run 34341643267: SUCCESS',
              'run ID 34341885267: SUCCESS on all three jobs',
              'artifact ID 10100114965',
              'artifact ID 10100117423',
              'artifact ID 10100112461',
              'NEXT LANGUAGE = language 47.',
              'Do not stop permanently at 47;',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Handoff markers missing: {missing}')
          print('Irish handoff validation passed: 46 locales, next 47')
          PY

      - name: Commit handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.txt
          if git diff --cached --quiet; then
            echo 'No handoff changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Irish 0.9.0 handoff'
          git fetch origin release/0.9.0-irish
          git rebase origin/release/0.9.0-irish
          git push origin HEAD:release/0.9.0-irish
