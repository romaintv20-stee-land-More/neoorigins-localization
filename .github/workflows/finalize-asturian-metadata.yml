name: Finalize Asturian metadata

on:
  push:
    branches: [ release/0.9.0-asturian ]
    paths:
      - scripts/finalize_asturian_metadata.py
      - .github/workflows/finalize-asturian-metadata.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.9.0-asturian
          fetch-depth: 0

      - name: Synchronize Asturian catalog and README metadata
        run: python3 scripts/finalize_asturian_metadata.py

      - name: Assert 71-language metadata state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          assert catalog['project']['supported_locale_count'] == 71
          count = 0
          def walk(obj):
              global count
              if isinstance(obj, dict):
                  if 'ast_es' in obj and isinstance(obj['ast_es'], dict) and obj['ast_es'].get('name') == 'Asturianu':
                      count += 1
                  for value in obj.values(): walk(value)
              elif isinstance(obj, list):
                  for value in obj: walk(value)
          walk(catalog)
          assert count >= 11, count
          neo = next(x for x in catalog['supported_projects'] if x.get('id') == 'neoorigins')
          ns = neo['compatibility']['fallback_namespaces']
          assert ns['asturian_common_glob'] == 'neoorigins_ast_common_*'
          assert ns['asturian_mc_1_21_1'] == 'neoorigins_ast_121'
          readme = Path('README.md').read_text(encoding='utf-8')
          assert readme.count('| 71 |') == 3
          assert 'Asturien (`ast_es`)' in readme
          assert "Pour l'asturien :" in readme
          assert 'Les soixante-et-onze langues' in readme
          catalogue = Path('CATALOG.md').read_text(encoding='utf-8')
          assert catalogue.count('Asturianu (`ast_es`)') >= 11
          print(f'Metadata assertions passed: 71 locales, {count} Asturian catalog entries.')
          PY

      - name: Validate JSON and whitespace
        run: |
          python3 scripts/validate.py
          git diff --check

      - name: Commit Asturian metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Asturian localization in 0.9.0 beta'
          git fetch origin release/0.9.0-asturian
          git rebase origin/release/0.9.0-asturian
          git push origin HEAD:release/0.9.0-asturian
