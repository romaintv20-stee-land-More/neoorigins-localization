name: Refine Filipino localization

on:
  push:
    branches:
      - release/0.9.0-filipino
    paths:
      - scripts/refine_filipino.py
      - .github/workflows/refine-filipino.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-filipino

      - name: Apply contextual Filipino fixes
        run: python3 scripts/refine_filipino.py

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Check Filipino placeholders against NeoOrigins upstream
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref 860ecdb24e723983e93004ea8ceb5de90ccf0d70 --output build/fil-refine-audit-121 --locale fil_ph --fallback-namespace-glob 'neoorigins_fil_common_*' --extra-namespace neoorigins_fil_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 3c1c7365507679c836d3c14af5d4dd0654652e87 --output build/fil-refine-audit-261 --locale fil_ph --fallback-namespace-glob 'neoorigins_fil_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 65864716a5a796fa1c51ec3e8a6d9640abebb4ca --output build/fil-refine-audit-262 --locale fil_ph --fallback-namespace-glob 'neoorigins_fil_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Sanity-check corrected Filipino terminology
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/fil_ph.json'))
          text = '\n'.join(str(v) for p in files for v in json.loads(p.read_text(encoding='utf-8')).values())
          markers = len(re.findall(r'(?i)\b(?:ang|ng|mga|sa|na|at|para|kapag|iyong|mo|ay|hindi|maaari|mula|gamit)\b', text))
          bad = [
              'hindi maaaring maging ugat sa akin',
              '"Patak"',
              'Kababaang-loob',
              '"singilin"',
              'Pavloved',
              'I-toggle ang Arkitekto ng HUD',
              'Ipakita ang antas ng Arkitekto',
          ]
          remaining = [item for item in bad if item in text]
          if remaining:
              raise SystemExit(f'Known Filipino false-friends remain: {remaining}')
          if markers < 500:
              raise SystemExit(f'Filipino lexical sanity check too low: {markers}')
          print(f'Filipino refinement sanity passed: {markers} Filipino markers across {len(files)} files')
          PY

      - name: Commit refined Filipino translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'fil_ph.json' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo 'No Filipino refinement changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Filipino Minecraft terminology'
          git fetch origin release/0.9.0-filipino
          git rebase origin/release/0.9.0-filipino
          git push origin HEAD:release/0.9.0-filipino
