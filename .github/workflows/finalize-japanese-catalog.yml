name: Finalize Japanese catalog

on:
  push:
    branches:
      - release/0.8.0-japanese
    paths:
      - scripts/finalize_japanese_catalog.py
      - .github/workflows/finalize-japanese-catalog.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-japanese
      - name: Finalize docs and catalog
        run: python3 scripts/finalize_japanese_catalog.py
      - name: Commit documentation updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CATALOG.md catalog.json
          git commit -m "Document Japanese as thirteenth locale" || exit 0
          git push origin HEAD:release/0.8.0-japanese
