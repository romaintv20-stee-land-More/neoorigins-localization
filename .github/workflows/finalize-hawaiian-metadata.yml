name: Finalize Hawaiian locale metadata

on:
  push:
    branches:
      - release/1.0.0-hawaiian
    paths:
      - scripts/finalize_hawaiian_metadata.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/1.0.0-hawaiian
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Finalize Hawaiian metadata
        run: python scripts/finalize_hawaiian_metadata.py

      - name: Validate JSON
        run: python scripts/validate.py

      - name: Assert metadata state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          assert catalog['project']['supported_locale_count'] == 86

          def count_hawaiian(node):
              if isinstance(node, dict):
                  return (1 if 'haw_us' in node and isinstance(node['haw_us'], dict) and node['haw_us'].get('status') == 'supported' else 0) + sum(count_hawaiian(v) for v in node.values())
              if isinstance(node, list):
                  return sum(count_hawaiian(v) for v in node)
              return 0

          count = count_hawaiian(catalog)
          assert count == 11, f'Expected 11 Hawaiian project locale entries, found {count}'
          neo = next(p for p in catalog['supported_projects'] if p['id'] == 'neoorigins')
          ns = neo['compatibility']['fallback_namespaces']
          assert ns['hawaiian_common_glob'] == 'neoorigins_haw_common_*'
          assert ns['hawaiian_mc_1_21_1'] == 'neoorigins_haw_121'
          readme = Path('README.md').read_text(encoding='utf-8')
          catalogue = Path('CATALOG.md').read_text(encoding='utf-8')
          assert 'Hawaïen (`haw_us`)' in readme
          assert 'ʻŌlelo Hawaiʻi (`haw_us`)' in catalogue
          print('Hawaiian metadata audit: 86 locales; haw_us across 11 projects; namespaces OK')
          PY

      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CATALOG.md catalog.json
          if git diff --cached --quiet; then
            echo "No metadata changes to commit"
          else
            git commit -m "Finalize Hawaiian locale 86 metadata"
            git push origin HEAD:release/1.0.0-hawaiian
          fi
