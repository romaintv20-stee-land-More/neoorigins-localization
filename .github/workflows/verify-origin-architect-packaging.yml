name: Verify Origin Architect packaging

on:
  push:
    branches:
      - release/0.8.0-origin-architect
    paths:
      - .github/workflows/verify-origin-architect-packaging.yml
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc-1.21.1
            minecraft: '1.21.1'
            minecraft_range: '[1.21.1]'
            java: '21'
            gradle: '8.14.3'
            neoforge: '21.1.248'
            loader_range: '[1,)'
            parchment: 'true'
            pack_format: '34'
            source_variant: 'mc1_21_1'
            mod_version: '0.8.0-beta+1.21.1'
            include_addons: 'true'
            include_121_batch: 'true'
            include_turkish_split: 'true'
            include_26_2: 'false'
            expected_origin_architect_files: '10'
          - target: mc-26.1.x
            minecraft: '26.1.2'
            minecraft_range: '[26.1,26.2)'
            java: '25'
            gradle: '9.4.1'
            neoforge: '26.1.2.29-beta'
            loader_range: '[4,)'
            parchment: 'false'
            pack_format: '84'
            source_variant: 'mc26_1'
            mod_version: '0.8.0-beta+26.1'
            include_addons: 'false'
            include_121_batch: 'true'
            include_turkish_split: 'true'
            include_26_2: 'false'
            expected_origin_architect_files: '0'
          - target: mc-26.2
            minecraft: '26.2'
            minecraft_range: '[26.2,26.3)'
            java: '25'
            gradle: '9.4.1'
            neoforge: '26.2.0.3-beta'
            loader_range: '[4,)'
            parchment: 'false'
            pack_format: '84'
            source_variant: 'mc26_1'
            mod_version: '0.8.0-beta+26.2'
            include_addons: 'false'
            include_121_batch: 'false'
            include_turkish_split: 'true'
            include_26_2: 'true'
            expected_origin_architect_files: '0'

    runs-on: ubuntu-latest
    name: Verify ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Validate localization files
        run: python3 scripts/validate.py
      - name: Build without upstream audits
        run: |
          gradle build --stacktrace \
            "-Pjava_version=${{ matrix.java }}" \
            "-Puse_parchment=${{ matrix.parchment }}" \
            "-Presource_pack_format=${{ matrix.pack_format }}" \
            "-Psource_variant=${{ matrix.source_variant }}" \
            "-Pinclude_addon_translations=${{ matrix.include_addons }}" \
            "-Pinclude_121_batch_translations=${{ matrix.include_121_batch }}" \
            "-Pinclude_turkish_split_translations=${{ matrix.include_turkish_split }}" \
            "-Pinclude_26_2_translations=${{ matrix.include_26_2 }}" \
            "-Pminecraft_version=${{ matrix.minecraft }}" \
            "-Pminecraft_version_range=${{ matrix.minecraft_range }}" \
            "-Pneo_version=${{ matrix.neoforge }}" \
            "-Ploader_version_range=${{ matrix.loader_range }}" \
            "-Pmod_version=${{ matrix.mod_version }}"
      - name: Verify Origin Architect namespace
        env:
          EXPECTED: ${{ matrix.expected_origin_architect_files }}
        run: |
          python3 - <<'PY'
          import glob, json, os, zipfile
          jars = glob.glob('build/libs/*.jar')
          assert len(jars) == 1, jars
          with zipfile.ZipFile(jars[0]) as jar:
              names = [n for n in jar.namelist() if 'resourcepacks/fallback_localizations/assets/originsmodernui/lang/' in n and n.endswith('.json')]
              print('Origin Architect locale files:', names)
              assert len(names) == int(os.environ['EXPECTED']), (len(names), os.environ['EXPECTED'])
              if int(os.environ['EXPECTED']) == 10:
                  for name in names:
                      data = json.loads(jar.read(name).decode('utf-8'))
                      assert len(data) == 22, (name, len(data))
          PY
