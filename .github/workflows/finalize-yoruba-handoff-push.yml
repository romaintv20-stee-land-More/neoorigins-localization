name: Finalize Yoruba handoff push

on:
  push:
    branches:
      - release/0.9.0-yoruba
    paths:
      - '.github/workflows/finalize-yoruba-handoff-push.yml'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact handoff source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Finalize Yoruba handoffs
        run: python3 scripts/finalize_yoruba_handoff.py

      - name: Assert Yoruba handoff state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path('PROJECT_HANDOFF.txt').read_text(encoding='utf-8')
          nxt = Path('NEXT_CHAT_HANDOFF.md').read_text(encoding='utf-8')
          assertions = [
              ('75 locale baseline', '0.9.0 development currently has 75 locales:' in project),
              ('Yoruba expansion entry', '- 75: Yoruba / yo_ng' in project),
              ('Yoruba final status', 'YORUBA / LANGUAGE #75 FINAL STATUS' in project),
              ('language 76 project next', 'Language #76 is the next expansion task.' in project),
              ('next handoff 75 complete', 'first **75 languages are complete' in nxt),
              ('latest Yoruba', '#75 Yoruba — `yo_ng / Yorùbá`' in nxt),
              ('next handoff language 76', 'Start and finish **language #76**' in nxt),
              ('beta source of truth', '`release/0.9.0-beta` as the source-of-truth branch' in nxt),
              ('main prohibited', '**Do not use `main`**' in nxt),
          ]
          failed = [name for name, ok in assertions if not ok]
          if failed:
              raise SystemExit(f'Handoff assertions failed: {failed}')
          print('Yoruba handoff assertions passed')
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Commit Yoruba handoffs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.txt NEXT_CHAT_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'No Yoruba handoff changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Yoruba localization handoff'
          git fetch origin release/0.9.0-yoruba
          git rebase origin/release/0.9.0-yoruba
          git push origin HEAD:release/0.9.0-yoruba
