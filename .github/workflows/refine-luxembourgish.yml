name: Refine Luxembourgish localization

on:
  push:
    branches: [ release/0.9.0-luxembourgish ]
    paths:
      - scripts/refine_luxembourgish.py
      - .github/workflows/refine-luxembourgish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.9.0-luxembourgish
          fetch-depth: 0

      - name: Apply contextual Luxembourgish refinements
        run: python3 scripts/refine_luxembourgish.py

      - name: Restrict add-on audits to Luxembourgish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("lb_lu",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("lb_lu",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Strict NeoOrigins audits
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/lb-refined-121 --locale lb_lu --fallback-namespace-glob 'neoorigins_lb_common_*' --extra-namespace neoorigins_lb_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/lb-refined-261 --locale lb_lu --fallback-namespace-glob 'neoorigins_lb_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/lb-refined-262 --locale lb_lu --fallback-namespace-glob 'neoorigins_lb_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict add-on audits
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate localization JSON
        run: python3 scripts/validate.py

      - name: Assert contextual terms and Luxembourgish text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/lb_lu.json'))
          merged = {}; values = []
          for p in files:
              data = json.loads(p.read_text(encoding='utf-8'))
              merged.update(data); values.extend(str(v) for v in data.values())
          expected = {
              'origins.layer.origin': 'Origin',
              'origins.layer.class': 'Klass',
              'gui.neoorigins.detail.powers_header': 'Fäegkeeten',
              'gui.neoorigins.mob_creator.tab.spawn_rules': 'Spawn-Reegelen',
              'power.origins_furries.scales.name': 'Schuppen',
              'power.origins_furries.pavlov.name': 'Pavlov-Reaktioun',
              'power.origins_furries.night_vision.name': 'Nuechtsiicht',
              'screen.originsmodernui.title': 'Wiel deng Origin',
          }
          for key, want in expected.items():
              got = merged.get(key)
              if got != want: raise SystemExit(f'{key}: expected {want!r}, got {got!r}')
          for i in range(1,65):
              key=f'key.neoorigins.hotkey.{i}'
              if merged.get(key) != f'Schnelltast {i:02d}': raise SystemExit(f'Bad hotkey {i}: {merged.get(key)!r}')
          text='\n'.join(values); low=text.lower().replace('’',"'").replace('‘',"'")
          markers=len(re.findall(r'(?:den|déi|dat|eng|een|mat|fir|vun|op|wann|kann|du|dech|deng|ass|sinn|gëtt|hues|méi|net|oder|awer|wéi|dës)',low))
          letters=len(re.findall(r'[äÄëËéÉèÈöÖüÜ]',text))
          if markers < 1200 or letters < 150: raise SystemExit(f'Luxembourgish sanity too low after refinement: markers={markers}, letters={letters}')
          print(f'Luxembourgish contextual assertions passed: {len(files)} files, {markers} lexical markers, {letters} accented letters.')
          PY

      - name: Restore temporary audit script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload refined audits
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luxembourgish-refined-audits-${{ github.sha }}
          path: build/lb-refined-*
          if-no-files-found: warn

      - name: Commit contextual refinement
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'lb_lu.json' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo 'No contextual changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Luxembourgish gameplay terminology'
          git fetch origin release/0.9.0-luxembourgish
          git rebase origin/release/0.9.0-luxembourgish
          git push origin HEAD:release/0.9.0-luxembourgish
