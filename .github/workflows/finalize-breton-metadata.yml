name: Finalize Breton metadata

on:
  push:
    branches: [ release/0.9.0-breton ]
    paths:
      - scripts/finalize_breton_metadata.py
      - .github/workflows/finalize-breton-metadata.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.9.0-breton
          fetch-depth: 0

      - name: Synchronize Breton catalog and README metadata
        run: python3 scripts/finalize_breton_metadata.py

      - name: Assert 70-language metadata state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          assert catalog['project']['supported_locale_count'] == 70
          count = 0
          def walk(obj):
              global count
              if isinstance(obj, dict):
                  if 'br_fr' in obj and isinstance(obj['br_fr'], dict) and obj['br_fr'].get('name') == 'Brezhoneg':
                      count += 1
                  for value in obj.values(): walk(value)
              elif isinstance(obj, list):
                  for value in obj: walk(value)
          walk(catalog)
          assert count >= 11, count
          neo = next(x for x in catalog['supported_projects'] if x.get('id') == 'neoorigins')
          ns = neo['compatibility']['fallback_namespaces']
          assert ns['breton_common_glob'] == 'neoorigins_br_common_*'
          assert ns['breton_mc_1_21_1'] == 'neoorigins_br_121'
          readme = Path('README.md').read_text(encoding='utf-8')
          assert readme.count('| 70 |') == 3
          assert 'Breton (`br_fr`)' in readme
          assert 'Pour le breton :' in readme
          assert 'Les soixante-dix langues' in readme
          catalogue = Path('CATALOG.md').read_text(encoding='utf-8')
          assert catalogue.count('Brezhoneg (`br_fr`)') >= 11
          print(f'Metadata assertions passed: 70 locales, {count} Breton catalog entries.')
          PY

      - name: Validate JSON and whitespace
        run: |
          python3 scripts/validate.py
          git diff --check

      - name: Commit Breton metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Breton localization in 0.9.0 beta'
          git fetch origin release/0.9.0-breton
          git rebase origin/release/0.9.0-breton
          git push origin HEAD:release/0.9.0-breton
