name: Finalize Kyrgyz handoff

on:
  push:
    branches: [ release/0.9.0-kyrgyz ]
    paths:
      - 'scripts/finalize_kyrgyz_handoff.py'
      - '.github/workflows/finalize-kyrgyz-handoff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-kyrgyz

      - name: Finalize handoff documents
        run: python3 scripts/finalize_kyrgyz_handoff.py

      - name: Verify handoff state
        run: |
          grep -F '0.9.0 development currently has 64 locales:' PROJECT_HANDOFF.txt
          grep -F -- '- 64: Kyrgyz / ky_kg' PROJECT_HANDOFF.txt
          grep -F 'SIXTY-FOUR IS NOT THE FINAL TARGET.' PROJECT_HANDOFF.txt
          grep -F 'NEXT LANGUAGE = #65.' PROJECT_HANDOFF.txt
          grep -F 'Completed language count: **64**.' NEXT_CHAT_HANDOFF.md
          grep -F 'Last completed language: **#64 Kyrgyz — `ky_kg / Кыргызча`**.' NEXT_CHAT_HANDOFF.md
          grep -F 'Next language: **#65**.' NEXT_CHAT_HANDOFF.md

      - name: Commit finalized handoffs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.txt NEXT_CHAT_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'No handoff changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Kyrgyz language 64 handoff'
          git fetch origin release/0.9.0-kyrgyz
          git rebase origin/release/0.9.0-kyrgyz
          git push origin HEAD:release/0.9.0-kyrgyz
