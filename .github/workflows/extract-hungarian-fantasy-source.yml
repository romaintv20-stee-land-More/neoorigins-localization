name: Extract Origins Fantasy English source

on:
  push:
    branches:
      - release/0.8.0-hungarian
    paths:
      - .github/workflows/extract-hungarian-fantasy-source.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-hungarian
      - name: Extract pinned English locale
        run: |
          mkdir -p tmp
          python3 - <<'PY'
          import io, json, zipfile
          from scripts.audit_origins_fantasy_upstream import download_jar, read_locale, DEFAULT_FILE_ID, DEFAULT_FILENAME
          data, _ = download_jar(DEFAULT_FILE_ID, DEFAULT_FILENAME)
          with zipfile.ZipFile(io.BytesIO(data)) as jar:
              en = read_locale(jar, 'en_us')
          if len(en) != 240:
              raise SystemExit(f'Expected 240 English keys, got {len(en)}')
          with open('tmp/origins_fantasy_en_us.json', 'w', encoding='utf-8') as f:
              json.dump(en, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
      - name: Commit temporary source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/origins_fantasy_en_us.json
          git commit -m "Extract temporary Origins Fantasy English source"
          git push origin HEAD:release/0.8.0-hungarian
