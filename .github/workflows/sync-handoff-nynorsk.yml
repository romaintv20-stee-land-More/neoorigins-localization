name: Sync Nynorsk handoff

on:
  push:
    branches:
      - release/0.9.0-nynorsk
    paths:
      - .github/workflows/sync-handoff-nynorsk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-nynorsk

      - name: Update project handoff
        run: python3 scripts/update_handoff_nynorsk.py

      - name: Validate Nynorsk handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('PROJECT_HANDOFF.txt').read_text(encoding='utf-8')
          required = [
              '0.9.0 development currently has 40 locales:',
              '- 40: Norwegian Nynorsk / nn_no',
              'FORTY IS NOT THE FINAL TARGET.',
              '28. NORWEGIAN NYNORSK 0.9.0 STATUS',
              'run ID 34310968849: SUCCESS on all three jobs',
              'catalog.json says 40 supported locales',
              'NEXT LANGUAGE = language 41.',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Nynorsk handoff markers missing: {missing}')
          print('Nynorsk handoff validation passed; next language 41')
          PY

      - name: Commit Nynorsk handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.txt
          if git diff --cached --quiet; then
            echo 'No Nynorsk handoff changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Nynorsk 0.9.0 handoff'
          git fetch origin release/0.9.0-nynorsk
          git rebase origin/release/0.9.0-nynorsk
          git push origin HEAD:release/0.9.0-nynorsk
