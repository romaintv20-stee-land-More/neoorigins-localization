name: Sync Galician handoff

on:
  push:
    branches:
      - release/0.9.0-beta
    paths:
      - .github/workflows/sync-handoff-galician.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-beta

      - name: Update handoff
        run: python3 scripts/update_handoff_galician.py

      - name: Validate handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('PROJECT_HANDOFF.txt').read_text(encoding='utf-8')
          required = [
              '0.9.0 development currently has 38 locales:',
              '- 38: Galician / gl_es',
              '26. GALICIAN 0.9.0 STATUS',
              'run ID 34307757409: SUCCESS on all three jobs',
              'catalog.json says 38 supported locales',
              'NEXT LANGUAGE = language 39.',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing Galician handoff markers: {missing}')
          print('Galician handoff validation passed; next language 39')
          PY

      - name: Commit handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.txt
          if git diff --cached --quiet; then
            echo 'No Galician handoff changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Galician 0.9.0 handoff'
          git fetch origin release/0.9.0-beta
          git rebase origin/release/0.9.0-beta
          git push origin HEAD:release/0.9.0-beta
