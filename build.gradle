tasks.named('jar', Jar) {
    from('LICENSE') {
        rename { 'LICENSE_neoorigins_localization' }
    }
    from('docs/ATTRIBUTIONS.md') {
        into 'META-INF'
        rename { 'ATTRIBUTIONS.md' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
