name: Integrate Ukrainian metadata

on:
  push:
    branches: [ release/0.8.0-ukrainian ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-ukrainian
      - name: Update metadata and audits
        run: |
          python3 scripts/integrate_ukrainian_metadata.py
          python3 scripts/validate.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CATALOG.md catalog.json scripts/audit_*upstream.py scripts/audit_origin_architect_upstream.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: integrate Ukrainian localization metadata'
          git push origin HEAD:release/0.8.0-ukrainian
