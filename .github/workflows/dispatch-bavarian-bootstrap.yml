name: Dispatch hardened Bavarian bootstrap

on:
  push:
    branches:
      - release/1.0.0-bavarian
    paths:
      - '.github/workflows/dispatch-bavarian-bootstrap.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch bootstrap workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/bootstrap-bavarian.yml/dispatches \
            -d '{"ref":"release/1.0.0-bavarian"}'
