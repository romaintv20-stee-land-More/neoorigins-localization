plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

def targetJavaVersion = (project.findProperty('java_version') ?: '21') as int
def targetResourcePackFormat = project.property('resource_pack_format').toString()
def sourceVariant = project.findProperty('source_variant') ?: 'mc1_21_1'
def includeAddonTranslations = (project.findProperty('include_addon_translations') ?: 'true').toBoolean()
def legacyExpanded = project.findProperty('include_121_expanded_translations')
def include121BatchTranslations = (project.findProperty('include_121_batch_translations') ?: legacyExpanded ?: 'true').toBoolean()
def includeTurkishSplitTranslations = (project.findProperty('include_turkish_split_translations') ?: legacyExpanded ?: 'true').toBoolean()
def include26_2Translations = (project.findProperty('include_26_2_translations') ?: 'false').toBoolean()

java.toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)

sourceSets.main.java.setSrcDirs(["src/${sourceVariant}/java"])

neoForge {
    version = project.neo_version

    if ((project.findProperty('use_parchment') ?: 'true').toBoolean()) {
        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }
    }

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources) {
    inputs.property 'resource_pack_format', targetResourcePackFormat
    inputs.property 'include_addon_translations', includeAddonTranslations
    inputs.property 'include_121_batch_translations', include121BatchTranslations
    inputs.property 'include_turkish_split_translations', includeTurkishSplitTranslations
    inputs.property 'include_26_2_translations', include26_2Translations

    filesMatching('resourcepacks/fallback_localizations/pack.mcmeta') {
        expand(resource_pack_format: targetResourcePackFormat)
    }

    if (!includeAddonTranslations) {
        exclude 'resourcepacks/fallback_localizations/assets/medievalorigins/**'
        exclude 'resourcepacks/fallback_localizations/assets/medievalorigins_*/**'
        exclude 'resourcepacks/fallback_localizations/assets/ibarnorigins/**'
        exclude 'resourcepacks/fallback_localizations/assets/origins_fantasy/**'
    }

    if (!include121BatchTranslations) {
        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_121_batch1/**'
    }

    if (!includeTurkishSplitTranslations) {
        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_tr_*/**'
    }

    if (!include26_2Translations) {
        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_26_2/**'
    }
}

tasks.named('jar', Jar) {
    from('LICENSE') {
        rename { 'LICENSE_neoorigins_localization' }
    }
    from('docs/ATTRIBUTIONS.md') {
        into 'META-INF'
        rename { 'ATTRIBUTIONS.md' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
