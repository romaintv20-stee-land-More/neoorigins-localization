name: Smoke Kabyle clause-level fallback

on:
  push:
    branches: [release/1.0.0-kabyle]
    paths: [.github/workflows/smoke-kabyle-clause-fallback.yml]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/1.0.0-kabyle
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers<5' sentencepiece protobuf
      - name: Translate suspect clauses independently
        run: |
          python3 - <<'PY'
          import torch
          from transformers import AutoModelForSeq2SeqLM,AutoTokenizer
          model_id='facebook/nllb-200-distilled-1.3B'
          tok=AutoTokenizer.from_pretrained(model_id,src_lang='eng_Latn')
          model=AutoModelForSeq2SeqLM.from_pretrained(model_id);model.eval()
          target=tok.convert_tokens_to_ids('kab_Latn')
          tests=[
            'Immune to Regeneration.',
            'Immune to Instant Health.',
            'Immune to Poison.',
            'Other potion effects still apply.',
            'A warper of gravitational fields who bends space itself.',
            'Pull enemies into a crushing singularity or blast them away, but your own body is untethered from the earth.',
            'Toggle: walk through solid blocks.',
            'While inside a block, fly freely (jump = up, shift = down).',
            'Obsidian, crying obsidian, and bedrock block your passage.',
            'Phasing drains hunger.',
            'You cannot eat these blocks when your stomach is full.',
          ]
          enc=tok(tests,return_tensors='pt',padding=True,truncation=True,max_length=256)
          with torch.inference_mode():out=model.generate(**enc,forced_bos_token_id=target,num_beams=4,max_new_tokens=256,early_stopping=True)
          for s,t in zip(tests,tok.batch_decode(out,skip_special_tokens=True)):
              print(f'SOURCE: {s}\nCLAUSE_KAB: {t.strip()}\n---',flush=True)
          PY
