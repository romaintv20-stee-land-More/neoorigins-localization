name: Refine Scottish Gaelic localization

on:
  push:
    branches:
      - release/0.9.0-scottish-gaelic
    paths:
      - scripts/refine_scottish_gaelic.py
      - .github/workflows/refine-scottish-gaelic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-scottish-gaelic

      - name: Apply contextual Scottish Gaelic fixes
        run: python3 scripts/refine_scottish_gaelic.py

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Check Scottish Gaelic placeholders against NeoOrigins upstream
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref 860ecdb24e723983e93004ea8ceb5de90ccf0d70 --output build/gd-refine-audit-121 --locale gd_gb --fallback-namespace-glob 'neoorigins_gd_common_*' --extra-namespace neoorigins_gd_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 3c1c7365507679c836d3c14af5d4dd0654652e87 --output build/gd-refine-audit-261 --locale gd_gb --fallback-namespace-glob 'neoorigins_gd_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 65864716a5a796fa1c51ec3e8a6d9640abebb4ca --output build/gd-refine-audit-262 --locale gd_gb --fallback-namespace-glob 'neoorigins_gd_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Sanity-check corrected Scottish Gaelic terminology
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/gd_gb.json'))
          text = '\n'.join(str(v) for p in files for v in json.loads(p.read_text(encoding='utf-8')).values())
          markers = len(re.findall(r'(?i)\b(?:an|na|agus|air|le|do|de|sa|tha|chan|nach|seo|sin|ann|aig|mar|urrainn|chun|bho|fo|ma|nuair|aon|agad|aca|thu|iad|bhith|bheil|gun|ris|às)\b', text))
          bad = [
              '"Eireannach"',
              '"Mealladh"',
              '"Neo-Thùs"',
              '"Sèididh"',
              '"Cìs"',
              '"Pavloved"',
              'Tog hud ailtire',
              'Taisbeanadh ìre ailtireachd',
              'diogan.Bidh',
              'mhionaid.Às',
          ]
          remaining = [item for item in bad if item in text]
          if remaining:
              raise SystemExit(f'Known Scottish Gaelic false-friends remain: {remaining}')
          if markers < 500:
              raise SystemExit(f'Scottish Gaelic lexical sanity check too low: {markers}')
          print(f'Scottish Gaelic refinement sanity passed: {markers} markers across {len(files)} files')
          PY

      - name: Commit refined Scottish Gaelic translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'gd_gb.json' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo 'No Scottish Gaelic refinement changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Scottish Gaelic Minecraft terminology'
          git fetch origin release/0.9.0-scottish-gaelic
          git rebase origin/release/0.9.0-scottish-gaelic
          git push origin HEAD:release/0.9.0-scottish-gaelic
