name: Audit Hungarian NeoOrigins main coverage

on:
  push:
    branches:
      - release/0.8.0-hungarian
    paths:
      - .github/workflows/audit-hungarian-main.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-hungarian
      - name: Fix known Hungarian typos
        run: python3 .github/scripts/fix_hungarian_typos.py
      - name: Commit typo fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/resourcepacks/fallback_localizations/assets/neoorigins_hu_*/lang/hu_hu.json
          git diff --cached --quiet || git commit -m "Fix Hungarian NeoOrigins translation typos"
          git push origin HEAD:release/0.8.0-hungarian
      - name: Audit Hungarian NeoOrigins 2.2.26
        run: |
          python3 scripts/audit_neoorigins_upstream.py \
            --ref 860ecdb24e723983e93004ea8ceb5de90ccf0d70 \
            --locale hu_hu \
            --fallback-namespace-glob 'neoorigins_hu_*' \
            --fail-on-overlap \
            --fail-on-missing
