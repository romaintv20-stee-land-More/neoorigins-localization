name: Finalize Uzbek handoff

on:
  push:
    branches: [ release/0.9.0-uzbek ]
    paths:
      - scripts/finalize_uzbek_handoff.py
      - .github/workflows/finalize-uzbek-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.9.0-uzbek
          fetch-depth: 0

      - name: Finalize Uzbek handoffs
        run: python3 scripts/finalize_uzbek_handoff.py

      - name: Assert final handoff state
        run: |
          grep -F "0.9.0 development currently has 59 locales:" PROJECT_HANDOFF.txt
          grep -F "59: Uzbek / uz_uz" PROJECT_HANDOFF.txt
          grep -F "RESOLVED BEFORE LANGUAGE 59" PROJECT_HANDOFF.txt
          grep -F "NEXT LANGUAGE = language 60." PROJECT_HANDOFF.txt
          grep -F "Completed language count: **59**." NEXT_CHAT_HANDOFF.md
          grep -F "#59 Uzbek / Ouzbek" NEXT_CHAT_HANDOFF.md
          grep -F "Next language: **#60**." NEXT_CHAT_HANDOFF.md
          if grep -F "decide whether to complete the seven legacy partial locales" PROJECT_HANDOFF.txt; then
            echo "Stale legacy-gap note remains"
            exit 1
          fi

      - name: Commit final handoffs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.txt NEXT_CHAT_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'No handoff changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Uzbek handoff and prepare language 60'
          git fetch origin release/0.9.0-uzbek
          git rebase origin/release/0.9.0-uzbek
          git push origin HEAD:release/0.9.0-uzbek
