name: Bootstrap Yoruba localization

on:
  push:
    branches:
      - release/0.9.0-yoruba
    paths:
      - scripts/bootstrap_yoruba.py
      - .github/workflows/bootstrap-yoruba.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-yoruba

      - name: Restrict add-on audits to Yoruba
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("yo_ng",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("yo_ng",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Yoruba NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/yo-discovery-mc-1.21.1 --locale yo_ng
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/yo-discovery-mc-26.1 --locale yo_ng
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/yo-discovery-mc-26.2 --locale yo_ng

      - name: Discover Yoruba add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Yoruba fallback files
        run: python3 scripts/bootstrap_yoruba.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Yoruba NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/yo-audit-mc-1.21.1 --locale yo_ng --fallback-namespace-glob 'neoorigins_yo_common_*' --extra-namespace neoorigins_yo_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/yo-audit-mc-26.1 --locale yo_ng --fallback-namespace-glob 'neoorigins_yo_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/yo-audit-mc-26.2 --locale yo_ng --fallback-namespace-glob 'neoorigins_yo_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Yoruba add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Yoruba text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/yo_ng.json'))
          if not files:
              raise SystemExit('No yo_ng localization files found')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          latin_chars = len(re.findall(r'[A-Za-zÀ-ÿẸẹỌọṢṣ]', text))
          yoruba_signals = len(re.findall(r'(?:Ẹ|ẹ|Ọ|ọ|Ṣ|ṣ|À|à|Á|á|È|è|É|é|Ì|ì|Í|í|Ò|ò|Ó|ó|Ù|ù|Ú|ú|gb)', text))
          markers = len(re.findall(r"\b(?:ati|ti|ni|lati|fun|ninu|eyi|rẹ|ṣe|awọn|kan|pẹlu|jẹ|agbara|iyara|aye|ede|ere|nigbati|le|ko|si|lọwọ|ọkan|ọna|naa)\b", text, flags=re.I))
          print(f'Yoruba sanity counts: {latin_chars} Latin chars, {yoruba_signals} Yoruba orthographic signals, {markers} lexical markers across {len(files)} files')
          if latin_chars < 70000:
              raise SystemExit(f'Yoruba Latin-script sanity too low: {latin_chars}')
          if yoruba_signals < 500:
              raise SystemExit(f'Yoruba orthographic-signal sanity too low: {yoruba_signals}')
          if markers < 500:
              raise SystemExit(f'Yoruba lexical-marker sanity too low: {markers}')
          print('Yoruba text sanity passed')
          PY

      - name: Add Yoruba target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeYoruba121Translations' not in text:
              anchor = "def includeIgbo121Translations = (project.findProperty('include_igbo_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Igbo Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeYoruba121Translations = (project.findProperty('include_yoruba_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)
              anchor = "    inputs.property 'include_igbo_121_translations', includeIgbo121Translations\n"
              if anchor not in text:
                  raise SystemExit('Igbo Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_yoruba_121_translations', includeYoruba121Translations\n", 1)
              anchor = "    if (!includeIgbo121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_ig_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Igbo Gradle exclusion anchor not found')
              block = anchor + "\n    if (!includeYoruba121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_yo_121/**'\n    }\n"
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Yoruba audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yoruba-localization-audits-${{ github.sha }}
          path: |
            build/yo-discovery-*
            build/yo-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Yoruba translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'yo_ng.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Yoruba translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Yoruba localization fallback'
          git fetch origin release/0.9.0-yoruba
          git rebase origin/release/0.9.0-yoruba
          git push origin HEAD:release/0.9.0-yoruba
