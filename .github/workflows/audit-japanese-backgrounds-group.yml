name: Audit Japanese Backgrounds group

on:
  push:
    branches:
      - release/0.8.0-japanese
    paths:
      - .github/workflows/audit-japanese-backgrounds-group.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-japanese
      - name: Audit Origins Backgrounds
        run: python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
      - name: Audit Origins More Backgrounds
        run: python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
      - name: Audit Origins Backgrounds ISS
        run: python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
