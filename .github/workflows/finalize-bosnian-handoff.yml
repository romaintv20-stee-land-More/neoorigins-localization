name: Finalize Bosnian handoff

on:
  push:
    branches: [ release/0.9.0-bosnian ]
    paths:
      - scripts/finalize_bosnian_handoff.py
      - .github/workflows/finalize-bosnian-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.9.0-bosnian
          fetch-depth: 0

      - name: Finalize Bosnian handoffs
        run: python3 scripts/finalize_bosnian_handoff.py

      - name: Assert handoff state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path('PROJECT_HANDOFF.txt').read_text(encoding='utf-8')
          nxt = Path('NEXT_CHAT_HANDOFF.md').read_text(encoding='utf-8')
          expected_project = [
              '0.9.0 development currently has 68 locales:',
              '- 68: Bosnian / bs_ba',
              'SIXTY-EIGHT IS NOT THE FINAL TARGET.',
              'BOSNIAN / LANGUAGE #68 FINAL STATUS',
              'Language #69 is the next expansion task.',
          ]
          expected_next = [
              'first **68 languages are complete',
              '#68 Bosnian — `bs_ba / Bosanski`',
              'Start and finish **language #69**',
          ]
          missing = [x for x in expected_project if x not in project] + [x for x in expected_next if x not in nxt]
          if missing:
              raise SystemExit(f'Handoff assertions failed: {missing}')
          print('Bosnian handoff assertions passed; #69 is next.')
          PY

      - name: Validate repository JSON and whitespace
        run: |
          python3 scripts/validate.py
          git diff --check

      - name: Commit final Bosnian handoffs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.txt NEXT_CHAT_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'No handoff changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Bosnian localization handoff'
          git fetch origin release/0.9.0-bosnian
          git rebase origin/release/0.9.0-bosnian
          git push origin HEAD:release/0.9.0-bosnian
