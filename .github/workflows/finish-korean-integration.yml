name: Finish Korean localization integration

on:
  push:
    branches:
      - release/0.8.0-korean

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Korean integration metadata
        run: python3 scripts/finish_korean_integration.py

      - name: Validate catalog and JSON files
        run: python3 scripts/validate.py

      - name: Commit finalized Korean integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Korean localization integration"
          git push origin HEAD:release/0.8.0-korean
