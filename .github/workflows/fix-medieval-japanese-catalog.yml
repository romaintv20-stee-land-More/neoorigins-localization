name: Fix Medieval Japanese catalog

on:
  push:
    branches:
      - release/0.8.0-japanese
    paths:
      - scripts/fix_medieval_japanese_catalog.py
      - .github/workflows/fix-medieval-japanese-catalog.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-japanese
      - run: python3 scripts/fix_medieval_japanese_catalog.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Fix Medieval Japanese catalog paths" || exit 0
          git push origin HEAD:release/0.8.0-japanese
