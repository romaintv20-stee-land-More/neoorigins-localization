name: Refine Hindi localization

on:
  push:
    branches:
      - release/0.9.0-hindi
    paths:
      - scripts/refine_hindi.py
      - .github/workflows/refine-hindi.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-hindi

      - name: Apply contextual Hindi fixes
        run: python3 scripts/refine_hindi.py

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Check Hindi placeholders against NeoOrigins upstream
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref 860ecdb24e723983e93004ea8ceb5de90ccf0d70 --output build/hi-refine-audit-121 --locale hi_in --fallback-namespace-glob 'neoorigins_hi_common_*' --extra-namespace neoorigins_hi_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 3c1c7365507679c836d3c14af5d4dd0654652e87 --output build/hi-refine-audit-261 --locale hi_in --fallback-namespace-glob 'neoorigins_hi_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 65864716a5a796fa1c51ec3e8a6d9640abebb4ca --output build/hi-refine-audit-262 --locale hi_in --fallback-namespace-glob 'neoorigins_hi_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Sanity-check Hindi text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/hi_in.json'))
          text = '\n'.join(str(v) for p in files for v in json.loads(p.read_text(encoding='utf-8')).values())
          if 'नीदरलैंड' in text:
              raise SystemExit('Nether false-friend remains in Hindi files')
          markers = len(re.findall(r'[\u0900-\u097F]', text))
          if markers < 3000:
              raise SystemExit(f'Hindi sanity check too low: {markers}')
          print(f'Hindi refinement sanity passed: {markers} Devanagari characters across {len(files)} files')
          PY

      - name: Commit refined Hindi translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'hi_in.json' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo 'No Hindi refinement changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Hindi Minecraft terminology'
          git fetch origin release/0.9.0-hindi
          git rebase origin/release/0.9.0-hindi
          git push origin HEAD:release/0.9.0-hindi
