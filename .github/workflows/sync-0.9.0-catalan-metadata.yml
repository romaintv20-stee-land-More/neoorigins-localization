name: Sync 0.9.0 Catalan metadata

on:
  push:
    branches:
      - release/0.9.0-beta
    paths:
      - 'src/main/resources/resourcepacks/fallback_localizations/assets/**/ca_es.json'
      - 'scripts/update_catalog_catalan.py'
      - 'scripts/update_readme_catalan.py'
      - '.github/workflows/sync-0.9.0-catalan-metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-beta

      - name: Update catalog and README
        run: |
          python3 scripts/update_catalog_catalan.py
          python3 scripts/generate_catalog.py
          python3 scripts/update_readme_catalan.py

      - name: Validate metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          if catalog['project']['supported_locale_count'] != 33:
              raise SystemExit('catalog locale count is not 33')
          for project in catalog['supported_projects']:
              if project['languages'].get('ca_es', {}).get('status') != 'supported':
                  raise SystemExit(f"ca_es missing from {project['id']}")
          readme = Path('README.md').read_text(encoding='utf-8')
          required = [
              'Catalan (`ca_es`)',
              'Les trente-trois langues',
              'SR-LAT / CA',
              'Pour le catalan :',
              '- **catalan** : 27 fichiers fallback `ca_es`',
          ]
          missing = [item for item in required if item not in readme]
          if missing:
              raise SystemExit(f'README Catalan metadata missing: {missing}')
          print('Catalan metadata validation passed')
          PY

      - name: Commit synchronized metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Catalan localization in 0.9.0 beta'
          git fetch origin release/0.9.0-beta
          git rebase origin/release/0.9.0-beta
          git push origin HEAD:release/0.9.0-beta
