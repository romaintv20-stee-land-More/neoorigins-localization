name: Sync Mongolian 51-locale metadata

on:
  push:
    branches:
      - release/0.9.0-mongolian
    paths:
      - .github/workflows/sync-metadata-mongolian.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-mongolian

      - name: Update catalog metadata
        run: |
          python3 scripts/update_catalog_mongolian.py
          python3 scripts/generate_catalog.py

      - name: Update README metadata
        run: python3 scripts/update_readme_mongolian.py

      - name: Validate 51-locale metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog=json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          if catalog['project']['supported_locale_count'] != 51:
              raise SystemExit('catalog locale count is not 51')
          for project in catalog['supported_projects']:
              for locale in ('kk_kz','mn_mn'):
                  if locale not in project['languages']:
                      raise SystemExit(f"{locale} missing from {project['id']}")
          readme=Path('README.md').read_text(encoding='utf-8')
          required=['Les cinquante et une langues','Kazakh (`kk_kz`)','Mongol (`mn_mn`)','Pour le kazakh :','Pour le mongol :','/ KK / MN']
          missing=[item for item in required if item not in readme]
          if missing: raise SystemExit(f'README Mongolian markers missing: {missing}')
          catalog_md=Path('CATALOG.md').read_text(encoding='utf-8')
          for marker in ('kk_kz','mn_mn','Қазақша','Монгол хэл'):
              if marker not in catalog_md:
                  raise SystemExit(f'CATALOG.md marker missing: {marker}')
          print('Mongolian 51-locale metadata validation passed')
          PY

      - name: Commit Mongolian metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No Mongolian metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Mongolian localization in 0.9.0 beta'
          git fetch origin release/0.9.0-mongolian
          git rebase origin/release/0.9.0-mongolian
          git push origin HEAD:release/0.9.0-mongolian
