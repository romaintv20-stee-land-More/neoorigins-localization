name: Probe Northern Sami context terminology

on:
  push:
    branches:
      - release/1.0.0-northern-sami
    paths:
      - '.github/workflows/probe-northern-sami-terms.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/1.0.0-northern-sami

      - name: Translate high-risk terms in one guarded batch
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          terms = [
              'origin', 'choose your origin', 'origin creator', 'mob origin creator',
              'class', 'choose a class', 'power', 'powers', 'ability', 'abilities',
              'apply', 'cancel', 'done', 'reset', 'position', 'scale',
              'flight', 'unique flight', 'support', 'phasing', 'undead',
              'magic', 'unique abilities', 'dagger damage', 'dextrous',
              'stealthy', "doesn\'t sleep", 'physical damage', 'armor',
              'soul mage attributes', 'sand person attributes', 'grant attributes',
              'revoke attributes', 'cooldown', 'cooldown countdown', 'opacity',
              'loot pool', 'loot table', 'feather footed', 'feather hop',
              'arcane spell power', 'frost spell power', 'high elf', 'high elves',
              'overview', 'weakness', 'resistance', 'health', 'damage',
              'player', 'target', 'key', 'hotkey',
              'unarmed bonus', 'unique movement', 'carnivore', 'nether bonuses',
              'mining', 'caving', 'ranged bonuses', 'speed', 'vegetarian',
              'loved by mobs', 'gold gear bonuses', 'crowd control', 'hydrophobe',
              'axe bonuses', 'defense', 'odd', 'withering', 'summons',
              'illager friendly', 'complex', 'reputation', 'water-based', 'utility',
              'weak on land', 'vulnerable to fire', 'frost-based', 'tanky',
              'heat sensitive', 'healing', 'feathered wings', 'weak to undead',
          ]

          def translate(text, attempts=7):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      params = urllib.parse.urlencode({
                          'client': 'gtx', 'sl': 'en', 'tl': 'se', 'dt': 't', 'q': text,
                      })
                      req = urllib.request.Request(
                          'https://translate.googleapis.com/translate_a/single?' + params,
                          headers={'User-Agent': 'Mozilla/5.0'},
                      )
                      raw = urllib.request.urlopen(req, timeout=60).read().decode('utf-8')
                      payload = json.loads(raw)
                      value = ''.join(seg[0] for seg in payload[0] if seg and isinstance(seg[0], str)).strip()
                      if value:
                          return value
                  except Exception as exc:
                      last = exc
                  try:
                      params = urllib.parse.urlencode({'sl': 'en', 'tl': 'se', 'q': text})
                      req = urllib.request.Request('https://translate.google.com/m?' + params, headers={'User-Agent': 'Mozilla/5.0'})
                      raw = urllib.request.urlopen(req, timeout=60).read().decode('utf-8')
                      match = re.search(r'<div class="result-container">(.*?)</div>', raw, flags=re.S)
                      if match:
                          value = html.unescape(re.sub(r'<[^>]+>', '', match.group(1))).strip()
                          if value:
                              return value
                  except Exception as exc:
                      last = exc
                  if attempt != attempts:
                      time.sleep(min(45, 3 ** attempt))
              raise RuntimeError(f'translation failed: {last}')

          sep_re = re.compile(r'ZZQXTERM\s*\d{4}\s*QXZZ', re.I)
          joined = terms[0] + ''.join(f'\nZZQXTERM{i:04d}QXZZ\n{term}' for i, term in enumerate(terms[1:], 1))
          translated = translate(joined)
          parts = [part.strip() for part in sep_re.split(translated)]
          if len(parts) != len(terms):
              raise SystemExit(f'Expected {len(terms)} translated terms, got {len(parts)}')

          lines = []
          for term, result in zip(terms, parts):
              lines.append(f'{term}\t{result}')
              print(f'{term} -> {result}')

          out = Path('diagnostics/northern-sami-term-probe.tsv')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit term probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/northern-sami-term-probe.tsv
          if git diff --cached --quiet; then
            echo 'No terminology probe changes.'
            exit 0
          fi
          git commit -m 'Record Northern Sami terminology probe'
          git fetch origin release/1.0.0-northern-sami
          git rebase origin/release/1.0.0-northern-sami
          git push origin HEAD:release/1.0.0-northern-sami
