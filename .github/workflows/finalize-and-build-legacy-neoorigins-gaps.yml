name: Finalize and build historical NeoOrigins locale recovery

on:
  push:
    branches: [ release/0.9.0-legacy-gap-recovery ]
    paths:
      - '.github/workflows/finalize-and-build-legacy-neoorigins-gaps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.9.0-legacy-gap-recovery
          fetch-depth: 0

      - name: Normalize version-specific packaging and prune stale 26.x keys
        run: |
          python3 - <<'PY'
          import json, urllib.request
          from pathlib import Path

          gradle = Path('build.gradle')
          text = gradle.read_text(encoding='utf-8')
          old_batch = "def include121BatchTranslations = (project.findProperty('include_121_batch_translations') ?: legacyExpanded ?: 'true').toBoolean()"
          new_batch = "def include121BatchTranslations = (sourceVariant == 'mc1_21_1') && (project.findProperty('include_121_batch_translations') ?: legacyExpanded ?: 'true').toBoolean()"
          old_tr = "def includeTurkishSplitTranslations = (project.findProperty('include_turkish_split_translations') ?: legacyExpanded ?: 'true').toBoolean()"
          new_tr = "def includeTurkishSplitTranslations = (project.findProperty('include_turkish_split_translations') ?: 'true').toBoolean()"
          if old_batch not in text: raise SystemExit('Could not find 1.21 batch packaging guard')
          if old_tr not in text: raise SystemExit('Could not find Turkish packaging guard')
          text = text.replace(old_batch, new_batch, 1).replace(old_tr, new_tr, 1)
          gradle.write_text(text, encoding='utf-8')

          assets = Path('src/main/resources/resourcepacks/fallback_localizations/assets')
          refs = {
              'neoorigins_26_1': 'aa207ef14cf3b938e28b4081162701953957c1d5',
              'neoorigins_26_2': '511cadcafe3027d2a56b4448652ec9b74e2f3b07',
          }
          base = 'https://raw.githubusercontent.com/CyberDay1/NeoOrigins/{ref}/src/main/resources/assets/neoorigins/lang/en_us.json'
          for namespace, ref in refs.items():
              with urllib.request.urlopen(base.format(ref=ref), timeout=30) as r:
                  english = json.load(r)
              for locale in ('tr_tr','cs_cz','hu_hu'):
                  path = assets / namespace / 'lang' / f'{locale}.json'
                  data = json.loads(path.read_text(encoding='utf-8'))
                  stale = sorted(set(data) - set(english))
                  if len(stale) != 3:
                      raise SystemExit(f'{namespace}/{locale}: expected 3 stale keys, got {len(stale)}: {stale}')
                  clean = {k:v for k,v in data.items() if k in english}
                  path.write_text(json.dumps(clean, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                  print(namespace, locale, 'removed stale:', stale, 'remaining overlay keys:', len(clean))
          PY

      - name: Strict source audit for all seven locales
        run: |
          set -euo pipefail
          audit(){ target="$1"; ref="$2"; locale="$3"; shift 3; python3 scripts/audit_neoorigins_upstream.py --ref "$ref" --locale "$locale" --output "build/legacy-final/$target/$locale" "$@" --fail-on-overlap --fail-on-missing --fail-on-placeholders; }
          for locale in it_it pl_pl ru_ru zh_cn; do
            audit 1.21.1 af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 "$locale" --extra-namespace neoorigins_226 --extra-namespace neoorigins_121_batch1
            audit 26.1.x aa207ef14cf3b938e28b4081162701953957c1d5 "$locale" --extra-namespace neoorigins_226 --extra-namespace neoorigins_26_1
            audit 26.2 511cadcafe3027d2a56b4448652ec9b74e2f3b07 "$locale" --extra-namespace neoorigins_226 --extra-namespace neoorigins_26_2
          done
          for spec in 'tr_tr neoorigins_tr_*' 'cs_cz neoorigins_cs_*' 'hu_hu neoorigins_hu_*'; do
            set -- $spec; locale="$1"; glob="$2"
            audit 1.21.1 af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 "$locale" --extra-namespace neoorigins_226 --fallback-namespace-glob "$glob"
            audit 26.1.x aa207ef14cf3b938e28b4081162701953957c1d5 "$locale" --extra-namespace neoorigins_226 --extra-namespace neoorigins_26_1 --fallback-namespace-glob "$glob"
            audit 26.2 511cadcafe3027d2a56b4448652ec9b74e2f3b07 "$locale" --extra-namespace neoorigins_226 --extra-namespace neoorigins_26_2 --fallback-namespace-glob "$glob"
          done
          python3 scripts/validate.py
          git diff --check

      - name: Commit final recovery cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.gradle src/main/resources/resourcepacks/fallback_localizations/assets/neoorigins_26_1/lang/{tr_tr,cs_cz,hu_hu}.json src/main/resources/resourcepacks/fallback_localizations/assets/neoorigins_26_2/lang/{tr_tr,cs_cz,hu_hu}.json
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize historical NeoOrigins locale packaging'
            git push origin HEAD:release/0.9.0-legacy-gap-recovery
          fi

      - id: head
        name: Record finalized HEAD
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload final source audits
        uses: actions/upload-artifact@v7
        with:
          name: legacy-neoorigins-final-source-audits-${{ github.sha }}
          path: build/legacy-final
          if-no-files-found: error

  build:
    needs: finalize
    name: Package check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc-1.21.1
            minecraft: '1.21.1'
            minecraft_range: '[1.21.1]'
            java: '21'
            gradle: '8.14.3'
            neoforge: '21.1.248'
            loader_range: '[1,)'
            parchment: 'true'
            pack_format: '34'
            source_variant: 'mc1_21_1'
            upstream_ref: 'af467a3bc118f6bbc0970d68f7e03fa631d7e6f2'
            include_addons: true
            include_121_batch: true
            include_26_1: false
            include_26_2: false
          - target: mc-26.1.x
            minecraft: '26.1.2'
            minecraft_range: '[26.1,26.2)'
            java: '25'
            gradle: '9.4.1'
            neoforge: '26.1.2.29-beta'
            loader_range: '[4,)'
            parchment: 'false'
            pack_format: '84'
            source_variant: 'mc26_1'
            upstream_ref: 'aa207ef14cf3b938e28b4081162701953957c1d5'
            include_addons: false
            include_121_batch: false
            include_26_1: true
            include_26_2: false
          - target: mc-26.2
            minecraft: '26.2'
            minecraft_range: '[26.2,26.3)'
            java: '25'
            gradle: '9.4.1'
            neoforge: '26.2.0.3-beta'
            loader_range: '[4,)'
            parchment: 'false'
            pack_format: '84'
            source_variant: 'mc26_1'
            upstream_ref: '511cadcafe3027d2a56b4448652ec9b74e2f3b07'
            include_addons: false
            include_121_batch: false
            include_26_1: false
            include_26_2: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.9.0-legacy-gap-recovery
          fetch-depth: 0

      - name: Require finalized HEAD
        run: |
          test "$(git rev-parse HEAD)" = '${{ needs.finalize.outputs.commit_sha }}'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build mod
        run: |
          gradle build --stacktrace \
            "-Pjava_version=${{ matrix.java }}" \
            "-Puse_parchment=${{ matrix.parchment }}" \
            "-Presource_pack_format=${{ matrix.pack_format }}" \
            "-Psource_variant=${{ matrix.source_variant }}" \
            "-Pinclude_addon_translations=${{ matrix.include_addons }}" \
            "-Pinclude_121_batch_translations=${{ matrix.include_121_batch }}" \
            "-Pinclude_turkish_split_translations=true" \
            "-Pinclude_26_1_translations=${{ matrix.include_26_1 }}" \
            "-Pinclude_26_2_translations=${{ matrix.include_26_2 }}" \
            "-Pminecraft_version=${{ matrix.minecraft }}" \
            "-Pminecraft_version_range=${{ matrix.minecraft_range }}" \
            "-Pneo_version=${{ matrix.neoforge }}" \
            "-Ploader_version_range=${{ matrix.loader_range }}" \
            "-Pmod_version=0.9.0-beta+legacy-gap-${{ matrix.target }}"

      - name: Verify packaged fallback coverage and no duplicate keys
        env:
          UPSTREAM_REF: ${{ matrix.upstream_ref }}
          TARGET: ${{ matrix.target }}
        run: |
          JAR=$(find build/libs -type f -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR"
          export JAR
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error, zipfile

          jar=os.environ['JAR']; ref=os.environ['UPSTREAM_REF']; target=os.environ['TARGET']
          locales=['it_it','pl_pl','ru_ru','zh_cn','tr_tr','cs_cz','hu_hu']
          base='https://raw.githubusercontent.com/CyberDay1/NeoOrigins/{ref}/src/main/resources/assets/neoorigins/lang/{locale}.json'
          def fetch(locale):
              try:
                  with urllib.request.urlopen(base.format(ref=ref,locale=locale),timeout=30) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  if e.code==404:return {}
                  raise
          english=fetch('en_us')
          with zipfile.ZipFile(jar) as z:
              names=z.namelist()
              for locale in locales:
                  official=fetch(locale)
                  expected=set(english)-set(official)
                  suffix=f'/lang/{locale}.json'
                  files=[]
                  for n in names:
                      if not n.endswith(suffix) or '/assets/' not in n: continue
                      ns=n.split('/assets/',1)[1].split('/',1)[0]
                      if ns == 'neoorigins' or ns.startswith('neoorigins_'):
                          files.append(n)
                  merged={}; duplicates=[]
                  for n in sorted(files):
                      data=json.loads(z.read(n).decode('utf-8'))
                      for k,v in data.items():
                          if k in merged: duplicates.append((k,n))
                          merged[k]=v
                  if duplicates:
                      raise SystemExit(f'{target} {locale}: duplicate packaged fallback keys: {duplicates[:10]}')
                  missing=sorted(expected-set(merged)); extra=sorted(set(merged)-expected)
                  print(target, locale, 'files', len(files), 'fallback keys', len(merged), 'expected', len(expected), 'missing', len(missing), 'extra', len(extra))
                  if missing or extra:
                      raise SystemExit(f'{target} {locale}: packaged fallback mismatch; missing={missing[:10]} extra={extra[:10]}')
                  if target != 'mc-1.21.1' and any('/assets/neoorigins_121_batch1/' in n for n in files):
                      raise SystemExit(f'{target} {locale}: 1.21.1 batch leaked into modern package')
          PY
          sha256sum "$JAR" | tee "build/${{ matrix.target }}.sha256"

      - name: Upload verified JAR
        uses: actions/upload-artifact@v7
        with:
          name: neoorigins-localization-legacy-gap-${{ matrix.target }}-${{ needs.finalize.outputs.commit_sha }}
          path: |
            build/libs/*.jar
            build/${{ matrix.target }}.sha256
          if-no-files-found: error
