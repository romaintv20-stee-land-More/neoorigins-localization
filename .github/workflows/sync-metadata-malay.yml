name: Sync Malay 0.9.0 metadata

on:
  push:
    branches:
      - release/0.9.0-malay
    paths:
      - .github/workflows/sync-metadata-malay.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-malay

      - name: Update catalog metadata
        run: |
          python3 scripts/update_catalog_malay.py
          python3 scripts/generate_catalog.py

      - name: Update README metadata
        run: python3 scripts/update_readme_malay.py

      - name: Validate Malay metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          if catalog['project']['supported_locale_count'] != 43:
              raise SystemExit('catalog locale count is not 43')
          for project in catalog['supported_projects']:
              if 'ms_my' not in project['languages']:
                  raise SystemExit(f"ms_my missing from {project['id']}")
          readme = Path('README.md').read_text(encoding='utf-8')
          required = ['Les quarante-trois langues', 'Malais (`ms_my`)', 'Pour le malais :', '2 296/2 296', '2 307/2 307', '/ IS / MS']
          missing = [item for item in required if item not in readme]
          if missing:
              raise SystemExit(f'README Malay markers missing: {missing}')
          catalog_md = Path('CATALOG.md').read_text(encoding='utf-8')
          if 'ms_my' not in catalog_md or 'Bahasa Melayu' not in catalog_md:
              raise SystemExit('CATALOG.md Malay markers missing')
          print('Malay metadata validation passed: 43 locales')
          PY

      - name: Commit Malay metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No Malay metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Malay localization in 0.9.0 beta'
          git fetch origin release/0.9.0-malay
          git rebase origin/release/0.9.0-malay
          git push origin HEAD:release/0.9.0-malay
