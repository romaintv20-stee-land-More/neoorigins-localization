name: Smoke Limburgish LatentMT 2.6B

on:
  push:
    branches: [release/1.0.0-limburgish]
    paths: [.github/workflows/smoke-limburgish-latentmt.yml]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install LatentMT runtime
        run: |
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.56.2 'peft>=0.10.0' accelerate sentencepiece
      - name: Translate representative Limburgish strings
        run: |
          python3 - <<'PY'
          import torch
          from peft import PeftConfig, PeftModel
          from transformers import AutoConfig, AutoModelForCausalLM, AutoTokenizer

          adapter_id='LatentMT/LatentMT-2.6B-eng-latn-lim-latn'
          fallback_base='ByteDance/Ouro-2.6B-Thinking'
          peft_config=PeftConfig.from_pretrained(adapter_id)
          base_id=peft_config.base_model_name_or_path or fallback_base
          config=AutoConfig.from_pretrained(base_id,trust_remote_code=True)
          config.total_ut_steps=4
          tok=AutoTokenizer.from_pretrained(base_id,trust_remote_code=True)
          if tok.pad_token is None:tok.pad_token=tok.eos_token
          base=AutoModelForCausalLM.from_pretrained(base_id,config=config,torch_dtype=torch.float32,trust_remote_code=True)
          model=PeftModel.from_pretrained(base,adapter_id);model.eval();model.config.use_cache=True
          tests=[
            'Charging Soul Fireball',
            'You cannot wear armor higher than iron armor.',
            'The primordial soul flame burning within you instills fear in all but the bravest Piglins.',
            "Soul Sorcerers' soul fireball ability. Fires a soul fireball on effect resolution.",
          ]
          for source in tests:
              enc=tok(source,return_tensors='pt')
              with torch.inference_mode():
                  out=model.generate(**enc,max_new_tokens=160,do_sample=False,use_cache=True,pad_token_id=tok.pad_token_id,eos_token_id=tok.eos_token_id)
              generated=out[0,enc['input_ids'].shape[1]:]
              value=tok.decode(generated,skip_special_tokens=True).strip()
              print(f'SOURCE: {source}\nLATENTMT_LIM: {value}\n---',flush=True)
          PY
