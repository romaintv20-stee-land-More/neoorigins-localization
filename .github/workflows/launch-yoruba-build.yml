name: Launch Yoruba build

on:
  push:
    branches:
      - release/0.9.0-yoruba
    paths:
      - '.github/workflows/launch-yoruba-build.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pinned Yoruba build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-0.9.0-yoruba.yml --repo romaintv20-stee-land-More/neoorigins-localization --ref release/0.9.0-yoruba
