name: Bootstrap Occitan localization

on:
  push:
    branches:
      - release/0.9.0-occitan
    paths:
      - scripts/bootstrap_occitan.py
      - .github/workflows/bootstrap-occitan.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-occitan

      - name: Restrict add-on audits to Occitan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("oc_fr",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("oc_fr",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Occitan NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/oc-discovery-mc-1.21.1 --locale oc_fr
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/oc-discovery-mc-26.1 --locale oc_fr
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/oc-discovery-mc-26.2 --locale oc_fr

      - name: Discover Occitan add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Occitan fallback files
        run: python3 scripts/bootstrap_occitan.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Occitan NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/oc-audit-mc-1.21.1 --locale oc_fr --fallback-namespace-glob 'neoorigins_oc_common_*' --extra-namespace neoorigins_oc_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/oc-audit-mc-26.1 --locale oc_fr --fallback-namespace-glob 'neoorigins_oc_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/oc-audit-mc-26.2 --locale oc_fr --fallback-namespace-glob 'neoorigins_oc_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Occitan add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Occitan text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/oc_fr.json'))
          if not files:
              raise SystemExit('No oc_fr localization files found')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          latin_chars = len(re.findall(r'[A-Za-zÀ-ÿ]', text))
          occitan_signals = len(re.findall(r'(?:à|á|è|é|í|ò|ó|ú|ç|nh|lh|qu|gu|À|Á|È|É|Í|Ò|Ó|Ú|Ç)', text))
          markers = len(re.findall(r"\b(?:lo|la|los|las|un|una|de|del|dels|e|en|dins|amb|per|pas|es|son|pòt|pòdon|aquest|aquesta|jogaire|mond|lenga|fòrça|velocitat|vida|nocturna|acabat|minatge)\b", text, flags=re.I))
          print(f'Occitan sanity counts: {latin_chars} Latin chars, {occitan_signals} Occitan orthographic signals, {markers} lexical markers across {len(files)} files')
          if latin_chars < 70000:
              raise SystemExit(f'Occitan Latin-script sanity too low: {latin_chars}')
          if occitan_signals < 500:
              raise SystemExit(f'Occitan orthographic-signal sanity too low: {occitan_signals}')
          if markers < 500:
              raise SystemExit(f'Occitan lexical-marker sanity too low: {markers}')
          print('Occitan text sanity passed')
          PY

      - name: Add Occitan target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeOccitan121Translations' not in text:
              anchor = "def includeFrisian121Translations = (project.findProperty('include_frisian_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Frisian Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeOccitan121Translations = (project.findProperty('include_occitan_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)
              anchor = "    inputs.property 'include_frisian_121_translations', includeFrisian121Translations\n"
              if anchor not in text:
                  raise SystemExit('Frisian Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_occitan_121_translations', includeOccitan121Translations\n", 1)
              anchor = "    if (!includeFrisian121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_fy_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Frisian Gradle exclusion anchor not found')
              block = anchor + "\n    if (!includeOccitan121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_oc_121/**'\n    }\n"
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Occitan audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: occitan-localization-audits-${{ github.sha }}
          path: |
            build/oc-discovery-*
            build/oc-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Occitan translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'oc_fr.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Occitan translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Occitan localization fallback'
          git fetch origin release/0.9.0-occitan
          git rebase origin/release/0.9.0-occitan
          git push origin HEAD:release/0.9.0-occitan
