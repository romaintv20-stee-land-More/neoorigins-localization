name: Audit Czech Origins Fantasy

on:
  push:
    branches:
      - release/0.8.0-czech
    paths:
      - .github/workflows/audit-czech-fantasy.yml
      - scripts/audit_origins_fantasy_upstream.py
      - src/main/resources/resourcepacks/fallback_localizations/assets/origins_fantasy/lang/cs_cz.json
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate localization JSON
        run: python3 scripts/validate.py
      - name: Audit Czech Origins Fantasy
        run: python3 scripts/audit_origins_fantasy_upstream.py --output build/czech-fantasy-audit --fail-on-overlap --fail-on-missing --fail-on-placeholders
      - name: Verify exact Czech key count
        run: |
          python3 - <<'PY'
          import io, json, re, zipfile
          from scripts.audit_origins_fantasy_upstream import download_jar, read_locale
          data, _ = download_jar('8816068', 'Origins-Fantasy-1.21.1-NeoOrigins-1.1.3.jar')
          with zipfile.ZipFile(io.BytesIO(data)) as jar:
              en = read_locale(jar, 'en_us')
              official_cs = read_locale(jar, 'cs_cz')
          with open('src/main/resources/resourcepacks/fallback_localizations/assets/origins_fantasy/lang/cs_cz.json', encoding='utf-8') as f:
              cs = json.load(f)
          assert not official_cs, len(official_cs)
          assert len(en) == 240, len(en)
          assert set(cs) == set(en), (len(cs), len(en), sorted(set(en)-set(cs))[:10], sorted(set(cs)-set(en))[:10])
          token = re.compile(r'%(?:\d+\$)?[sd]')
          errors = []
          for key in en:
              if sorted(token.findall(str(en[key]))) != sorted(token.findall(str(cs[key]))):
                  errors.append(key)
          assert not errors, errors[:20]
          print(f'Czech Origins Fantasy: {len(cs)}/{len(en)} keys; official cs=0; placeholders OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: czech-fantasy-audit
          path: build/czech-fantasy-audit
