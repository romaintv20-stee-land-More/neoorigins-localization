name: Push Ukrainian addon batch 1

on:
  push:
    branches: [ release/0.8.0-ukrainian ]

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-ukrainian
      - name: Write translations
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/ukbatch1.tar.gz
          tar -xzf /tmp/ukbatch1.tar.gz
      - name: Commit translations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/resourcepacks/fallback_localizations/assets
          git diff --cached --quiet && exit 0
          git commit -m "feat: add Ukrainian addon translations batch 1"
          git push origin HEAD:release/0.8.0-ukrainian
