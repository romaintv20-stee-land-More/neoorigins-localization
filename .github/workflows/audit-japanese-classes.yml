name: Audit Japanese Origins Classes

on:
  push:
    branches:
      - release/0.8.0-japanese
    paths:
      - src/main/resources/resourcepacks/fallback_localizations/assets/origins_classes_ex/lang/ja_jp.json
      - src/main/resources/resourcepacks/fallback_localizations/assets/origins_classes_iss/lang/ja_jp.json
      - scripts/audit_origins_classes_extended_upstream.py
      - scripts/audit_origins_classes_iss_upstream.py
      - .github/workflows/audit-japanese-classes.yml

jobs:
  audit-extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-japanese
      - name: Audit Origins Classes Extended Japanese
        run: python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

  audit-iss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-japanese
      - name: Audit Origins Classes ISS Japanese
        run: python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
