name: Bootstrap Igbo localization

on:
  push:
    branches:
      - release/0.9.0-igbo
    paths:
      - scripts/bootstrap_igbo.py
      - .github/workflows/bootstrap-igbo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-igbo

      - name: Restrict add-on audits to Igbo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("ig_ng",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("ig_ng",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Igbo NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/ig-discovery-mc-1.21.1 --locale ig_ng
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/ig-discovery-mc-26.1 --locale ig_ng
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/ig-discovery-mc-26.2 --locale ig_ng

      - name: Discover Igbo add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Igbo fallback files
        run: python3 scripts/bootstrap_igbo.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Igbo NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/ig-audit-mc-1.21.1 --locale ig_ng --fallback-namespace-glob 'neoorigins_ig_common_*' --extra-namespace neoorigins_ig_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/ig-audit-mc-26.1 --locale ig_ng --fallback-namespace-glob 'neoorigins_ig_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/ig-audit-mc-26.2 --locale ig_ng --fallback-namespace-glob 'neoorigins_ig_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Igbo add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Igbo text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/ig_ng.json'))
          if not files:
              raise SystemExit('No ig_ng localization files found')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          latin_chars = len(re.findall(r'[A-Za-zÀ-ÿỊịỌọỤụṄṅ]', text))
          igbo_signals = len(re.findall(r'(?:Ị|ị|Ọ|ọ|Ụ|ụ|Ṅ|ṅ|gb|kw|nw|ch)', text))
          markers = len(re.findall(r"\b(?:na|nke|ya|ka|anyị|bụ|ma|maka|onye|ike|ọsọ|ụwa|asụsụ|ahụ|egwuregwu|enweghị|nwere|mee|ime|otu)\b", text, flags=re.I))
          print(f'Igbo sanity counts: {latin_chars} Latin chars, {igbo_signals} Igbo orthographic signals, {markers} lexical markers across {len(files)} files')
          if latin_chars < 70000:
              raise SystemExit(f'Igbo Latin-script sanity too low: {latin_chars}')
          if igbo_signals < 500:
              raise SystemExit(f'Igbo orthographic-signal sanity too low: {igbo_signals}')
          if markers < 500:
              raise SystemExit(f'Igbo lexical-marker sanity too low: {markers}')
          print('Igbo text sanity passed')
          PY

      - name: Add Igbo target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeIgbo121Translations' not in text:
              anchor = "def includeOccitan121Translations = (project.findProperty('include_occitan_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Occitan Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeIgbo121Translations = (project.findProperty('include_igbo_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)
              anchor = "    inputs.property 'include_occitan_121_translations', includeOccitan121Translations\n"
              if anchor not in text:
                  raise SystemExit('Occitan Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_igbo_121_translations', includeIgbo121Translations\n", 1)
              anchor = "    if (!includeOccitan121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_oc_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Occitan Gradle exclusion anchor not found')
              block = anchor + "\n    if (!includeIgbo121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_ig_121/**'\n    }\n"
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Igbo audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: igbo-localization-audits-${{ github.sha }}
          path: |
            build/ig-discovery-*
            build/ig-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Igbo translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'ig_ng.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Igbo translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Igbo localization fallback'
          git fetch origin release/0.9.0-igbo
          git rebase origin/release/0.9.0-igbo
          git push origin HEAD:release/0.9.0-igbo
