name: Audit Hungarian Origins Fantasy

on:
  push:
    branches:
      - release/0.8.0-hungarian
    paths:
      - .github/workflows/audit-hungarian-fantasy.yml
      - src/main/resources/resourcepacks/fallback_localizations/assets/origins_fantasy/lang/hu_hu.json

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-hungarian
      - name: Audit Origins Fantasy Hungarian
        run: |
          python3 scripts/audit_origins_fantasy_upstream.py \
            --file-id 8816068 \
            --filename Origins-Fantasy-1.21.1-NeoOrigins-1.1.3.jar \
            --fail-on-overlap \
            --fail-on-missing \
            --fail-on-placeholders
