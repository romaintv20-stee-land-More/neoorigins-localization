name: Sync Armenian 48-locale metadata

on:
  push:
    branches:
      - release/0.9.0-armenian
    paths:
      - .github/workflows/sync-metadata-armenian.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-armenian

      - name: Update catalog metadata
        run: |
          python3 scripts/update_catalog_armenian.py
          python3 scripts/generate_catalog.py

      - name: Update README metadata
        run: python3 scripts/update_readme_armenian.py

      - name: Validate 48-locale metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog=json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          if catalog['project']['supported_locale_count'] != 48:
              raise SystemExit('catalog locale count is not 48')
          for project in catalog['supported_projects']:
              for locale in ('gd_gb','hy_am'):
                  if locale not in project['languages']:
                      raise SystemExit(f"{locale} missing from {project['id']}")
          readme=Path('README.md').read_text(encoding='utf-8')
          required=['Les quarante-huit langues','Gaélique écossais (`gd_gb`)','Arménien (`hy_am`)','Pour le gaélique écossais :','Pour l’arménien :','/ GD / HY']
          missing=[item for item in required if item not in readme]
          if missing: raise SystemExit(f'README Armenian markers missing: {missing}')
          catalog_md=Path('CATALOG.md').read_text(encoding='utf-8')
          for marker in ('gd_gb','hy_am','Gàidhlig','Հայերեն'):
              if marker not in catalog_md:
                  raise SystemExit(f'CATALOG.md marker missing: {marker}')
          print('Armenian 48-locale metadata validation passed')
          PY

      - name: Commit Armenian metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No Armenian metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Armenian localization in 0.9.0 beta'
          git fetch origin release/0.9.0-armenian
          git rebase origin/release/0.9.0-armenian
          git push origin HEAD:release/0.9.0-armenian
