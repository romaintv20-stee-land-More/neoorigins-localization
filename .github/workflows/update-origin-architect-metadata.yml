name: Update Origin Architect metadata

on:
  push:
    branches:
      - release/0.8.0-origin-architect
    paths:
      - scripts/update_origin_architect_metadata.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/0.8.0-origin-architect

      - name: Update metadata
        run: python scripts/update_origin_architect_metadata.py

      - name: Validate catalog and localization files
        run: python scripts/validate.py

      - name: Commit metadata if changed
        run: |
          if git diff --quiet; then
            echo "No metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ATTRIBUTIONS.md catalog.json
          git commit -m "Add Origin Architect to 0.8.0 catalog"
          git push origin HEAD:release/0.8.0-origin-architect
