name: Bootstrap Lao localization

on:
  push:
    branches:
      - release/0.9.0-lao
    paths:
      - scripts/bootstrap_lao.py
      - .github/workflows/bootstrap-lao.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-lao

      - name: Restrict add-on audits to Lao
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("lo_la",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("lo_la",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Lao NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/lo-discovery-mc-1.21.1 --locale lo_la
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/lo-discovery-mc-26.1 --locale lo_la
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/lo-discovery-mc-26.2 --locale lo_la

      - name: Discover Lao add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Lao fallback files
        run: python3 scripts/bootstrap_lao.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Lao NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/lo-audit-mc-1.21.1 --locale lo_la --fallback-namespace-glob 'neoorigins_lo_common_*' --extra-namespace neoorigins_lo_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/lo-audit-mc-26.1 --locale lo_la --fallback-namespace-glob 'neoorigins_lo_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/lo-audit-mc-26.2 --locale lo_la --fallback-namespace-glob 'neoorigins_lo_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Lao add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Lao text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/lo_la.json'))
          if not files:
              raise SystemExit('No lo_la localization files found')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          lao_chars = len(re.findall(r'[\u0E80-\u0EFF]', text))
          markers = len(re.findall(r'(?:ຂອງ|ແລະ|ໃນ|ທີ່|ໄດ້|ເປັນ|ຈະ|ກັບ|ຈາກ|ສາມາດ|ບໍ່|ເມື່ອ|ນີ້|ໃຫ້|ຄຸນ)', text))
          if lao_chars < 30000:
              raise SystemExit(f'Lao-script sanity too low: {lao_chars}')
          if markers < 500:
              raise SystemExit(f'Lao lexical sanity too low: {markers}')
          print(f'Lao text sanity passed: {markers} lexical markers, {lao_chars} Lao-script chars across {len(files)} files')
          PY

      - name: Add Lao target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeLao121Translations' not in text:
              anchor = "def includeAlbanian121Translations = (project.findProperty('include_albanian_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Albanian Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeLao121Translations = (project.findProperty('include_lao_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)
              anchor = "    inputs.property 'include_albanian_121_translations', includeAlbanian121Translations\n"
              if anchor not in text:
                  raise SystemExit('Albanian Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_lao_121_translations', includeLao121Translations\n", 1)
              anchor = "    if (!includeAlbanian121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_sq_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Albanian Gradle exclusion anchor not found')
              block = anchor + "\n    if (!includeLao121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_lo_121/**'\n    }\n"
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Lao audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lao-localization-audits-${{ github.sha }}
          path: |
            build/lo-discovery-*
            build/lo-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Lao translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'lo_la.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Lao translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Lao localization fallback'
          git fetch origin release/0.9.0-lao
          git rebase origin/release/0.9.0-lao
          git push origin HEAD:release/0.9.0-lao
