name: Bootstrap Luxembourgish localization

on:
  push:
    branches:
      - release/0.9.0-luxembourgish
    paths:
      - scripts/bootstrap_luxembourgish.py
      - .github/workflows/bootstrap-luxembourgish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-luxembourgish

      - name: Restrict add-on audits to Luxembourgish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("lb_lu",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("lb_lu",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Luxembourgish NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/lb-discovery-mc-1.21.1 --locale lb_lu
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/lb-discovery-mc-26.1 --locale lb_lu
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/lb-discovery-mc-26.2 --locale lb_lu

      - name: Discover Luxembourgish add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Luxembourgish fallback files
        run: python3 scripts/bootstrap_luxembourgish.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Luxembourgish NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/lb-audit-mc-1.21.1 --locale lb_lu --fallback-namespace-glob 'neoorigins_lb_common_*' --extra-namespace neoorigins_lb_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/lb-audit-mc-26.1 --locale lb_lu --fallback-namespace-glob 'neoorigins_lb_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/lb-audit-mc-26.2 --locale lb_lu --fallback-namespace-glob 'neoorigins_lb_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Luxembourgish add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Luxembourgish text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/lb_lu.json'))
          if not files:
              raise SystemExit('No lb_lu localization files found')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          low = text.lower().replace('’', "'").replace('‘', "'")
          markers = len(re.findall(r"(?:den|déi|dat|eng|een|mat|fir|vun|op|wann|kann|du|dech|deng|ass|sinn|gëtt|hues|méi|net|oder|awer|wéi|dës)", low))
          lux_letters = len(re.findall(r'[äÄëËéÉèÈöÖüÜ]', text))
          latin = len(re.findall(r'[A-Za-zÀ-ž]', text))
          if markers < 1200:
              raise SystemExit(f'Luxembourgish lexical sanity check too low: {markers}')
          if lux_letters < 150:
              raise SystemExit(f'Luxembourgish accented-letter sanity too low: {lux_letters}')
          if latin < 25000:
              raise SystemExit(f'Luxembourgish Latin sanity too low: {latin}')
          print(f'Luxembourgish text sanity passed: {markers} lexical markers, {lux_letters} accented letters, {latin} Latin chars across {len(files)} files')
          PY

      - name: Add Luxembourgish target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeLuxembourgish121Translations' not in text:
              anchor = "def includeMaltese121Translations = (project.findProperty('include_maltese_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Maltese Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeLuxembourgish121Translations = (project.findProperty('include_luxembourgish_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)
              anchor = "    inputs.property 'include_maltese_121_translations', includeMaltese121Translations\n"
              if anchor not in text:
                  raise SystemExit('Maltese Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_luxembourgish_121_translations', includeLuxembourgish121Translations\n", 1)
              anchor = "    if (!includeMaltese121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_mt_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Maltese Gradle exclusion anchor not found')
              block = anchor + "\n    if (!includeLuxembourgish121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_lb_121/**'\n    }\n"
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Luxembourgish audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luxembourgish-localization-audits-${{ github.sha }}
          path: |
            build/lb-discovery-*
            build/lb-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Luxembourgish translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'lb_lu.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Luxembourgish translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Luxembourgish localization fallback'
          git fetch origin release/0.9.0-luxembourgish
          git rebase origin/release/0.9.0-luxembourgish
          git push origin HEAD:release/0.9.0-luxembourgish
