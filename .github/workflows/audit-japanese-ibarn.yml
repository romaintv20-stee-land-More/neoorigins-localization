name: Audit Japanese ibarn origins

on:
  push:
    branches:
      - release/0.8.0-japanese
    paths:
      - scripts/audit_ibarnorigins_upstream.py
      - src/main/resources/resourcepacks/fallback_localizations/assets/ibarnorigins/lang/ja_jp.json
      - .github/workflows/audit-japanese-ibarn.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-japanese
      - name: Audit Japanese ibarn origins
        run: python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
