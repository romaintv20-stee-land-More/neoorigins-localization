name: Bootstrap Esperanto localization

on:
  push:
    branches:
      - release/0.9.0-esperanto
    paths:
      - scripts/bootstrap_esperanto.py
      - .github/workflows/bootstrap-esperanto.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-esperanto

      - name: Restrict add-on audits to Esperanto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("eo_uy",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("eo_uy",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Esperanto NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/eo-discovery-mc-1.21.1 --locale eo_uy
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/eo-discovery-mc-26.1 --locale eo_uy
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/eo-discovery-mc-26.2 --locale eo_uy

      - name: Discover Esperanto add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Esperanto fallback files
        run: python3 scripts/bootstrap_esperanto.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Esperanto NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/eo-audit-mc-1.21.1 --locale eo_uy --fallback-namespace-glob 'neoorigins_eo_common_*' --extra-namespace neoorigins_eo_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/eo-audit-mc-26.1 --locale eo_uy --fallback-namespace-glob 'neoorigins_eo_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/eo-audit-mc-26.2 --locale eo_uy --fallback-namespace-glob 'neoorigins_eo_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Esperanto add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Esperanto text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/eo_uy.json'))
          if not files:
              raise SystemExit('No eo_uy localization files found')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          low = text.lower()
          markers = len(re.findall(r'\b(?:la|kaj|de|al|en|por|kun|estas|kiu|kiuj|via|viaj|vi|ĝi|ili|se|kiam|aŭ|ne|sur|per|el|povas|povi|uzu|premu|ludanto|potenco|kapablo)\b', low))
          diacritics = len(re.findall(r'[ĉĝĥĵŝŭĈĜĤĴŜŬ]', text))
          latin = len(re.findall(r'[A-Za-zÀ-ž]', text))
          if markers < 1600:
              raise SystemExit(f'Esperanto lexical sanity check too low: {markers}')
          if diacritics < 900:
              raise SystemExit(f'Esperanto diacritic sanity too low: {diacritics}')
          if latin < 25000:
              raise SystemExit(f'Esperanto Latin sanity too low: {latin}')
          print(f'Esperanto text sanity passed: {markers} lexical markers, {diacritics} Esperanto diacritics, {latin} Latin chars across {len(files)} files')
          PY

      - name: Add Esperanto target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeEsperanto121Translations' not in text:
              anchor = "def includeSomali121Translations = (project.findProperty('include_somali_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Somali Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeEsperanto121Translations = (project.findProperty('include_esperanto_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)
              anchor = "    inputs.property 'include_somali_121_translations', includeSomali121Translations\n"
              if anchor not in text:
                  raise SystemExit('Somali Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_esperanto_121_translations', includeEsperanto121Translations\n", 1)
              anchor = "    if (!includeSomali121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_so_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Somali Gradle exclusion anchor not found')
              block = anchor + "\n    if (!includeEsperanto121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_eo_121/**'\n    }\n"
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Esperanto audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esperanto-localization-audits-${{ github.sha }}
          path: |
            build/eo-discovery-*
            build/eo-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Esperanto translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'eo_uy.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Esperanto translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Esperanto localization fallback'
          git fetch origin release/0.9.0-esperanto
          git rebase origin/release/0.9.0-esperanto
          git push origin HEAD:release/0.9.0-esperanto
