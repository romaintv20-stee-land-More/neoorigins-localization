name: Sync 0.9.0 Latvian metadata

on:
  push:
    branches:
      - release/0.9.0-beta
    paths:
      - 'src/main/resources/resourcepacks/fallback_localizations/assets/**/lv_lv.json'
      - 'scripts/update_catalog_latvian.py'
      - 'scripts/update_readme_latvian.py'
      - '.github/workflows/sync-0.9.0-latvian-metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-beta

      - name: Update catalog and README
        run: |
          python3 scripts/update_catalog_latvian.py
          python3 scripts/generate_catalog.py
          python3 scripts/update_readme_latvian.py

      - name: Validate metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          if catalog['project']['supported_locale_count'] != 36:
              raise SystemExit('catalog locale count is not 36')
          for project in catalog['supported_projects']:
              if project['languages'].get('lv_lv', {}).get('status') != 'supported':
                  raise SystemExit(f"lv_lv missing from {project['id']}")
          readme = Path('README.md').read_text(encoding='utf-8')
          required = [
              'Letton (`lv_lv`)',
              'Les trente-six langues',
              'CA / ET / LT / LV',
              'Pour le letton :',
              '- **letton** : 27 fichiers fallback `lv_lv`',
          ]
          missing = [item for item in required if item not in readme]
          if missing:
              raise SystemExit(f'README Latvian metadata missing: {missing}')
          print('Latvian metadata validation passed')
          PY

      - name: Commit synchronized metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Latvian localization in 0.9.0 beta'
          git fetch origin release/0.9.0-beta
          git rebase origin/release/0.9.0-beta
          git push origin HEAD:release/0.9.0-beta
