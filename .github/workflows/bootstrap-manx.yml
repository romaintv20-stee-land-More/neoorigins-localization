name: Bootstrap Manx localization

on:
  push:
    branches:
      - release/1.0.0-manx
    paths:
      - scripts/bootstrap_manx.py
      - .github/workflows/bootstrap-manx.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/1.0.0-manx

      - name: Restrict add-on audits to Manx
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("gv_im",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("gv_im",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Manx NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/gv-discovery-mc-1.21.1 --locale gv_im
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/gv-discovery-mc-26.1 --locale gv_im
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/gv-discovery-mc-26.2 --locale gv_im

      - name: Discover Manx add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Manx fallback files
        run: python3 scripts/bootstrap_manx.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Manx NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/gv-audit-mc-1.21.1 --locale gv_im --fallback-namespace-glob 'neoorigins_gv_common_*' --extra-namespace neoorigins_gv_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/gv-audit-mc-26.1 --locale gv_im --fallback-namespace-glob 'neoorigins_gv_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/gv-audit-mc-26.2 --locale gv_im --fallback-namespace-glob 'neoorigins_gv_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Manx add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Manx text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/gv_im.json'))
          if len(files) != 29:
              raise SystemExit(f'Expected 29 gv_im localization files, found {len(files)}')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          markers = len(re.findall(r'\b(?:yn|ny|ta|cha|nel|jeant|erash|scryssey|seose|sheese|dagh|ennym|tendeilagh|sarey|cloieder|slaynt|bieauid|keyll|faarkey|dorrys|cleigh|fuygh|seihll|ushtey|aile|reaghey|sauail|croo|reih|crootagh|mayrnaght|cadjin|follit|aachroo|kiangil|cretooryn|cooid|bundeilyn|kishtey|lioar|ollan|baatey|side|gyn|lesh|jeh|ass)\b', text, re.I))
          if markers < 25:
              raise SystemExit(f'Manx lexical sanity too low: {markers}')
          if re.search(r'[А-Яа-яЁё一-龯ぁ-ゟ゠-ヿ]', text):
              raise SystemExit('Unexpected non-Latin script found in Manx output')
          print(f'Manx sanity passed: {markers} lexical markers across {len(files)} files')
          PY

      - name: Add Manx target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeManx121Translations' not in text:
              anchor = "def includeGallo121Translations = (project.findProperty('include_gallo_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Gallo Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeManx121Translations = (project.findProperty('include_manx_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)

              anchor = "    inputs.property 'include_gallo_121_translations', includeGallo121Translations\n"
              if anchor not in text:
                  raise SystemExit('Gallo Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_manx_121_translations', includeManx121Translations\n", 1)

              anchor = "    if (!includeGallo121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_go_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Gallo Gradle exclusion anchor not found')
              text = text.replace(anchor, anchor + "\n    if (!includeManx121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_gv_121/**'\n    }\n", 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Manx audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manx-localization-audits-${{ github.sha }}
          path: |
            build/gv-discovery-*
            build/gv-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Manx translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'gv_im.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Manx translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Manx localization fallback'
          git fetch origin release/1.0.0-manx
          git rebase origin/release/1.0.0-manx
          git push origin HEAD:release/1.0.0-manx
