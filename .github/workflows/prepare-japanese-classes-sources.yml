name: Prepare Japanese Origins Classes sources

on:
  push:
    branches:
      - release/0.8.0-japanese
    paths:
      - scripts/prepare_japanese_classes_sources.py
      - .github/workflows/prepare-japanese-classes-sources.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-japanese
      - name: Extract missing Japanese Classes sources
        run: python3 scripts/prepare_japanese_classes_sources.py
      - name: Commit sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_origins_classes_extended_ja_missing_en.json tmp_origins_classes_iss_ja_missing_en.json
          git commit -m "Generate temporary Japanese Origins Classes sources" || exit 0
          git push origin HEAD:release/0.8.0-japanese
