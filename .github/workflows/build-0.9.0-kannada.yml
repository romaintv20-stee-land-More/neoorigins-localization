name: Build 0.9.0 Kannada

on:
  push:
    branches: [ release/0.9.0-kannada ]
    paths:
      - '.github/workflows/build-0.9.0-kannada.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Kannada ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc-1.21.1
            minecraft: '1.21.1'
            minecraft_range: '[1.21.1]'
            java: '21'
            gradle: '8.14.3'
            neoforge: '21.1.248'
            loader_range: '[1,)'
            parchment: 'true'
            pack_format: '34'
            source_variant: 'mc1_21_1'
            upstream_ref: '860ecdb24e723983e93004ea8ceb5de90ccf0d70'
            kn_extra_namespace: 'neoorigins_kn_121'
            include_addons: true
            include_121_batch: true
            include_26_1: false
            include_26_2: false
          - target: mc-26.1.x
            minecraft: '26.1.2'
            minecraft_range: '[26.1,26.2)'
            java: '25'
            gradle: '9.4.1'
            neoforge: '26.1.2.29-beta'
            loader_range: '[4,)'
            parchment: 'false'
            pack_format: '84'
            source_variant: 'mc26_1'
            upstream_ref: '3c1c7365507679c836d3c14af5d4dd0654652e87'
            kn_extra_namespace: 'neoorigins_26_1'
            include_addons: false
            include_121_batch: true
            include_26_1: true
            include_26_2: false
          - target: mc-26.2
            minecraft: '26.2'
            minecraft_range: '[26.2,26.3)'
            java: '25'
            gradle: '9.4.1'
            neoforge: '26.2.0.3-beta'
            loader_range: '[4,)'
            parchment: 'false'
            pack_format: '84'
            source_variant: 'mc26_1'
            upstream_ref: '65864716a5a796fa1c51ec3e8a6d9640abebb4ca'
            kn_extra_namespace: 'neoorigins_26_2'
            include_addons: false
            include_121_batch: false
            include_26_1: false
            include_26_2: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Strict audit Kannada NeoOrigins
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref '${{ matrix.upstream_ref }}' --output 'build/kn-${{ matrix.target }}' --locale kn_in --fallback-namespace-glob 'neoorigins_kn_common_*' --extra-namespace '${{ matrix.kn_extra_namespace }}' --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Kannada add-ons
        if: matrix.include_addons == true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          scripts=[
            ('scripts/audit_medievalorigins_upstream.py',['--ref','1.21.1-fabric']),
            ('scripts/audit_ibarnorigins_upstream.py',['--ref','multiloader-1.21.1-new-pack-format']),
            ('scripts/audit_origins_fantasy_upstream.py',[]),
            ('scripts/audit_origins_backgrounds_upstream.py',[]),
            ('scripts/audit_origins_more_backgrounds_upstream.py',[]),
            ('scripts/audit_origins_backgrounds_iss_upstream.py',[]),
            ('scripts/audit_origins_furries_upstream.py',[]),
            ('scripts/audit_origins_classes_extended_upstream.py',[]),
            ('scripts/audit_origins_classes_iss_upstream.py',[]),
            ('scripts/audit_origin_architect_upstream.py',[]),
          ]
          originals={n:Path(n).read_text(encoding='utf-8') for n,_ in scripts}
          try:
            for name,extra in scripts:
              p=Path(name); src=originals[name]
              out,count=re.subn(r'^LOCALES\s*=.*$','LOCALES = ("kn_in",)',src,count=1,flags=re.M)
              if count==0: out,count=re.subn(r'^DEFAULT_LOCALES\s*=.*$','DEFAULT_LOCALES = ("kn_in",)',src,count=1,flags=re.M)
              if count!=1: raise SystemExit(f'Could not patch locale in {name}')
              p.write_text(out,encoding='utf-8')
              subprocess.run(['python3',name,*extra,'--fail-on-overlap','--fail-on-missing','--fail-on-placeholders'],check=True)
              p.write_text(src,encoding='utf-8')
          finally:
            for n,src in originals.items(): Path(n).write_text(src,encoding='utf-8')
          PY

      - name: Validate localization files
        run: python3 scripts/validate.py

      - name: Sanity-check Kannada text
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          files=list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/kn_in.json'))
          all_data={}; parts=[]
          for p in files:
              data=json.loads(p.read_text(encoding='utf-8'))
              all_data.update(data); parts.extend(str(v) for v in data.values())
          text='\n'.join(parts)
          markers=len(re.findall(r'(?:ಮತ್ತು|ನೀವು|ನಿಮ್ಮ|ಈ|ಒಂದು|ಅನ್ನು|ಇದು|ಆಗ|ಮಾಡಿ|ಮಾಡಲು|ಹೆಚ್ಚು|ಇಲ್ಲ|ಮೂಲಕ|ಜೊತೆ|ಮಾತ್ರ|ಯಾವಾಗ|ಆದರೆ)',text))
          specific=len(re.findall(r'[\u0C80-\u0CFF]',text))
          expected={
            'neoorigins.toggle.on':'ಸಾಮರ್ಥ್ಯ ಸಕ್ರಿಯವಾಗಿದೆ',
            'neoorigins.ultimine.no_power':'ನಿಮ್ಮ Origin‌ಗೆ Ultimine ಸಾಮರ್ಥ್ಯ ಇಲ್ಲ.',
            'gui.neoorigins.mob_creator.tab.drops':'ಲೂಟ್',
            'gui.neoorigins.mob_creator.tab.spawn_rules':'ಸ್ಪಾನ್ ನಿಯಮಗಳು',
            'gui.neoorigins.creator.apply':'ಅನ್ವಯಿಸಿ',
            'origins.neoorigins.avian.name':'Avian',
            'power.neoorigins.blazeling_nether_born.name':'Nether‌ನಲ್ಲಿ ಜನಿಸಿದ',
            'power.origins_furries.pavlov.name':'ಪಾವ್ಲೋವ್ ಪ್ರತಿಕ್ರಿಯೆ',
            'power.origins_furries.scales.name':'ಶಲ್ಕಗಳು',
            'power.origins_furries.night_vision.name':'ರಾತ್ರಿ ದೃಷ್ಟಿ',
            'originsmodernui.config.hud.show_level':'Origin Architect ಮಟ್ಟವನ್ನು ತೋರಿಸಿ',
          }
          bad=[f'{k}={all_data.get(k)!r}' for k,v in expected.items() if all_data.get(k)!=v]
          if bad: raise SystemExit(f'Kannada contextual fixes missing: {bad}')
          for i in range(1,65):
              k=f'key.neoorigins.hotkey.{i}'; want=f'ಹಾಟ್‌ಕೀ {i:02d}'
              if all_data.get(k)!=want: raise SystemExit(f'Kannada hotkey normalization failed: {k}')
          forbidden=['ಪವರ್ ಸಕ್ರಿಯಗೊಳಿಸಲಾಗಿದೆ','ವಿದ್ಯುತ್ ನಿಷ್ಕ್ರಿಯಗೊಳಿಸಲಾಗಿದೆ','ಮೂಲ ಸೃಷ್ಟಿಕರ್ತ','ಪಾವ್ಲೋವ್ಡ್','ಮಾಪಕಗಳು']
          hits=[x for x in forbidden if x in text]
          if hits: raise SystemExit(f'Known Kannada false friends remain: {hits}')
          if markers < 1400 or specific < 100000:
              raise SystemExit(f'Kannada lexical sanity too low: markers={markers}, specific={specific}')
          print(f'Kannada sanity passed: {markers} lexical markers, {specific} Kannada-script chars across {len(files)} files')
          PY

      - name: Build mod
        run: |
          gradle build --stacktrace \
            "-Pjava_version=${{ matrix.java }}" \
            "-Puse_parchment=${{ matrix.parchment }}" \
            "-Presource_pack_format=${{ matrix.pack_format }}" \
            "-Psource_variant=${{ matrix.source_variant }}" \
            "-Pinclude_addon_translations=${{ matrix.include_addons }}" \
            "-Pinclude_121_batch_translations=${{ matrix.include_121_batch }}" \
            "-Pinclude_kannada_121_translations=${{ matrix.include_addons }}" \
            "-Pinclude_26_1_translations=${{ matrix.include_26_1 }}" \
            "-Pinclude_26_2_translations=${{ matrix.include_26_2 }}" \
            "-Pminecraft_version=${{ matrix.minecraft }}" \
            "-Pminecraft_version_range=${{ matrix.minecraft_range }}" \
            "-Pneo_version=${{ matrix.neoforge }}" \
            "-Ploader_version_range=${{ matrix.loader_range }}" \
            "-Pmod_version=0.9.0-beta+kn-${{ matrix.target }}"

      - name: Verify Kannada packaging
        run: |
          JAR=$(find build/libs -type f -name '*.jar' ! -name '*-sources.jar' | head -n1)
          test -n "$JAR"
          jar tf "$JAR" > build/jar-kn.txt
          COUNT=$(grep -cE '(^|/)lang/kn_in\.json$' build/jar-kn.txt || true)
          for index in $(seq -w 1 16); do grep -Eq "assets/neoorigins_kn_common_${index}/lang/kn_in\.json$" build/jar-kn.txt; done
          ADDONS='medievalorigins ibarnorigins origins_fantasy origins_backgrounds origins_backgrounds_two origins_backgrounds_iss origins_furries origins_classes_ex origins_classes_iss originsmodernui'
          ADDON_PATTERN='assets/(medievalorigins|medievalorigins_[^/]*|ibarnorigins|origins_fantasy|origins_backgrounds|origins_backgrounds_two|origins_backgrounds_iss|origins_furries|origins_classes_ex|origins_classes_iss|originsmodernui)/'
          if [ '${{ matrix.include_addons }}' = 'true' ]; then
            EXPECTED=27
            grep -Eq 'assets/neoorigins_kn_121/lang/kn_in\.json$' build/jar-kn.txt
            for ns in $ADDONS; do grep -Eq "assets/$ns/lang/kn_in\.json$" build/jar-kn.txt; done
            ! grep -Eq 'assets/neoorigins_26_(1|2)/lang/kn_in\.json$' build/jar-kn.txt
          else
            EXPECTED=17
            ! grep -Eq "$ADDON_PATTERN" build/jar-kn.txt
            ! grep -Eq 'assets/neoorigins_kn_121/lang/kn_in\.json$' build/jar-kn.txt
            grep -Eq "assets/${{ matrix.kn_extra_namespace }}/lang/kn_in\.json$" build/jar-kn.txt
          fi
          echo "Kannada: $COUNT / $EXPECTED"
          test "$COUNT" -eq "$EXPECTED"

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: neoorigins-localization-kannada-${{ matrix.target }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
