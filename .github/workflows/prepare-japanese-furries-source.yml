name: Prepare Japanese Origins Furries source

on:
  push:
    branches:
      - release/0.8.0-japanese
    paths:
      - scripts/prepare_japanese_furries_source.py
      - .github/workflows/prepare-japanese-furries-source.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-japanese
      - name: Extract missing Japanese source
        run: python3 scripts/prepare_japanese_furries_source.py
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_origins_furries_ja_missing_en.json
          git commit -m "Generate temporary Japanese Origins Furries source" || exit 0
          git push origin HEAD:release/0.8.0-japanese
