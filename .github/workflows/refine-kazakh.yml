name: Refine Kazakh localization

on:
  push:
    branches:
      - release/0.9.0-kazakh
    paths:
      - .github/workflows/refine-kazakh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-kazakh

      - name: Apply contextual Kazakh fixes
        run: python3 scripts/refine_kazakh.py

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Strict Kazakh NeoOrigins audit
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref 860ecdb24e723983e93004ea8ceb5de90ccf0d70 --output build/kk-refine-audit-121 --locale kk_kz --fallback-namespace-glob 'neoorigins_kk_common_*' --extra-namespace neoorigins_kk_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 3c1c7365507679c836d3c14af5d4dd0654652e87 --output build/kk-refine-audit-261 --locale kk_kz --fallback-namespace-glob 'neoorigins_kk_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 65864716a5a796fa1c51ec3e8a6d9640abebb4ca --output build/kk-refine-audit-262 --locale kk_kz --fallback-namespace-glob 'neoorigins_kk_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict Kazakh add-on audits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          scripts=[
            ('scripts/audit_medievalorigins_upstream.py',['--ref','1.21.1-fabric']),
            ('scripts/audit_ibarnorigins_upstream.py',['--ref','multiloader-1.21.1-new-pack-format']),
            ('scripts/audit_origins_fantasy_upstream.py',[]),
            ('scripts/audit_origins_backgrounds_upstream.py',[]),
            ('scripts/audit_origins_more_backgrounds_upstream.py',[]),
            ('scripts/audit_origins_backgrounds_iss_upstream.py',[]),
            ('scripts/audit_origins_furries_upstream.py',[]),
            ('scripts/audit_origins_classes_extended_upstream.py',[]),
            ('scripts/audit_origins_classes_iss_upstream.py',[]),
            ('scripts/audit_origin_architect_upstream.py',[]),
          ]
          originals={n:Path(n).read_text(encoding='utf-8') for n,_ in scripts}
          try:
            for name,extra in scripts:
              p=Path(name); src=originals[name]
              out,count=re.subn(r'^LOCALES\s*=.*$','LOCALES = ("kk_kz",)',src,count=1,flags=re.M)
              if count==0: out,count=re.subn(r'^DEFAULT_LOCALES\s*=.*$','DEFAULT_LOCALES = ("kk_kz",)',src,count=1,flags=re.M)
              if count!=1: raise SystemExit(f'Could not patch locale in {name}')
              p.write_text(out,encoding='utf-8')
              subprocess.run(['python3',name,*extra,'--fail-on-overlap','--fail-on-missing','--fail-on-placeholders'],check=True)
              p.write_text(src,encoding='utf-8')
          finally:
            for n,src in originals.items(): Path(n).write_text(src,encoding='utf-8')
          PY

      - name: Sanity-check corrected Kazakh terminology
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          files=list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/kk_kz.json'))
          all_data={}; parts=[]
          for p in files:
              data=json.loads(p.read_text(encoding='utf-8'))
              all_data.update(data); parts.extend(str(v) for v in data.values())
          text='\n'.join(parts)
          specific=len(re.findall(r'[ӘәҒғҚқҢңӨөҰұҮүҺһІі]',text))
          expected={
            'neoorigins.toggle.on':'Қабілет қосулы',
            'neoorigins.ultimine.no_power':'Сіздің Origin-іңізде Ultimine қабілеті жоқ.',
            'gui.neoorigins.mob_creator.tab.drops':'Олжа',
            'gui.neoorigins.mob_creator.tab.spawn_rules':'Пайда болу ережелері',
            'origins.neoorigins.arachnid.name':'Arachnid',
            'power.neoorigins.blazeling_nether_born.name':'Незерде туған',
            'power.origins_furries.pavlov.name':'Павлов реакциясы',
            'power.origins_furries.scales.name':'Қабыршақтар',
            'power.origins_furries.night_vision.name':'Түнде көру',
            'originsmodernui.config.hud.show_level':'Origin Architect деңгейін көрсету',
          }
          bad=[f'{k}={all_data.get(k)!r}' for k,v in expected.items() if all_data.get(k)!=v]
          if bad: raise SystemExit(f'Kazakh contextual fixes missing: {bad}')
          if specific < 1000: raise SystemExit(f'Kazakh-specific letter sanity too low: {specific}')
          print(f'Kazakh refinement sanity passed: {specific} Kazakh-specific letters across {len(files)} files')
          PY

      - name: Commit refined Kazakh translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'kk_kz.json' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo 'No Kazakh refinement changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Kazakh Minecraft terminology'
          git fetch origin release/0.9.0-kazakh
          git rebase origin/release/0.9.0-kazakh
          git push origin HEAD:release/0.9.0-kazakh
