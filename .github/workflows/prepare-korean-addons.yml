name: Prepare Korean addon coverage

on:
  push:
    branches:
      - release/0.8.0-korean

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Temporarily include Korean in addon audits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if '"ko_kr"' not in text:
                  text = text.replace('"ja_jp")', '"ja_jp", "ko_kr")')
                  text = text.replace('"ja_jp",\n)', '"ja_jp", "ko_kr",\n)')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Audit Medieval Origins
        run: python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
      - name: Audit ibarn origins
        run: python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
      - name: Audit Origins Fantasy
        run: python3 scripts/audit_origins_fantasy_upstream.py
      - name: Audit Origins Backgrounds
        run: python3 scripts/audit_origins_backgrounds_upstream.py
      - name: Audit Origins More Backgrounds
        run: python3 scripts/audit_origins_more_backgrounds_upstream.py
      - name: Audit Origins Backgrounds ISS
        run: python3 scripts/audit_origins_backgrounds_iss_upstream.py
      - name: Audit Origins Furries
        run: python3 scripts/audit_origins_furries_upstream.py
      - name: Audit Origins Classes Extended
        run: python3 scripts/audit_origins_classes_extended_upstream.py
      - name: Audit Origins Classes ISS
        run: python3 scripts/audit_origins_classes_iss_upstream.py
      - name: Audit Origin Architect
        run: python3 scripts/audit_origin_architect_upstream.py
      - name: Export exact English sources and validated key sets
        run: |
          mkdir -p build/korean-sources
          cp build/medievalorigins-upstream-audit/ko_kr_missing_en.json build/korean-sources/medievalorigins_missing_en.json
          cp build/origins-backgrounds-upstream-audit/upstream_en_us.json build/korean-sources/origins_backgrounds_en_us.json
          cp build/origins-more-backgrounds-upstream-audit/upstream_en_us.json build/korean-sources/origins_backgrounds_two_en_us.json
          cp build/origins-backgrounds-iss-upstream-audit/upstream_en_us.json build/korean-sources/origins_backgrounds_iss_en_us.json
          cp build/origins-furries-upstream-audit/upstream_en_us.json build/korean-sources/origins_furries_en_us.json
          cp build/origins-classes-extended-upstream-audit/upstream_en_us.json build/korean-sources/origins_classes_ex_en_us.json
          cp build/origins-classes-iss-upstream-audit/upstream_en_us.json build/korean-sources/origins_classes_iss_en_us.json
          cp build/origin-architect-upstream-audit/upstream_en_us.json build/korean-sources/originsmodernui_en_us.json
          cp src/main/resources/resourcepacks/fallback_localizations/assets/origins_backgrounds/lang/ja_jp.json build/korean-sources/origins_backgrounds_ja_keyset.json
          cp src/main/resources/resourcepacks/fallback_localizations/assets/origins_backgrounds_two/lang/ja_jp.json build/korean-sources/origins_backgrounds_two_ja_keyset.json
          cp src/main/resources/resourcepacks/fallback_localizations/assets/origins_backgrounds_iss/lang/ja_jp.json build/korean-sources/origins_backgrounds_iss_ja_keyset.json
          python3 - <<'PY'
          import io, json, urllib.request, zipfile
          from pathlib import Path
          out = Path('build/korean-sources')
          raw = 'https://raw.githubusercontent.com/ibarn-Recreational/ibarn-origins-addon/multiloader-1.21.1-new-pack-format/common/src/main/resources/assets/ibarnorigins/lang/en_us.json'
          req = urllib.request.Request(raw, headers={'User-Agent':'NeoOrigins-Localization-Audit'})
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.load(r)
          (out/'ibarnorigins_en_us.json').write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          file_id='8816068'; filename='Origins-Fantasy-1.21.1-NeoOrigins-1.1.3.jar'
          a,b=file_id[:-3],file_id[-3:]
          jar_data=None
          for url in [f'https://edge.forgecdn.net/files/{a}/{b}/{filename}', f'https://mediafilez.forgecdn.net/files/{a}/{b}/{filename}']:
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'NeoOrigins-Localization-Audit','Referer':'https://www.curseforge.com/','Accept':'*/*'})
                  with urllib.request.urlopen(req, timeout=60) as r: candidate=r.read()
                  if candidate[:2]==b'PK': jar_data=candidate; break
              except Exception:
                  pass
          if jar_data is None: raise SystemExit('Could not download pinned Origins Fantasy JAR')
          with zipfile.ZipFile(io.BytesIO(jar_data)) as jar:
              fantasy=json.loads(jar.read('assets/origins_fantasy/lang/en_us.json').decode('utf-8'))
          (out/'origins_fantasy_en_us.json').write_text(json.dumps(fantasy, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korean-addon-preparation
          path: |
            build/medievalorigins-upstream-audit
            build/ibarnorigins-upstream-audit
            build/origins-fantasy-upstream-audit
            build/origins-backgrounds-upstream-audit
            build/origins-more-backgrounds-upstream-audit
            build/origins-backgrounds-iss-upstream-audit
            build/origins-furries-upstream-audit
            build/origins-classes-extended-upstream-audit
            build/origins-classes-iss-upstream-audit
            build/origin-architect-upstream-audit
            build/korean-sources
          if-no-files-found: warn
