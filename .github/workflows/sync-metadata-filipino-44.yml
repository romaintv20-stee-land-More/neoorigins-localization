name: Sync Filipino 44-locale metadata

on:
  push:
    branches:
      - release/0.9.0-filipino-rebased
    paths:
      - .github/workflows/sync-metadata-filipino-44.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-filipino-rebased

      - name: Update catalog metadata
        run: |
          python3 scripts/update_catalog_filipino_44.py
          python3 scripts/generate_catalog.py

      - name: Update README metadata
        run: python3 scripts/update_readme_filipino_44.py

      - name: Validate combined Malay and Filipino metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          if catalog['project']['supported_locale_count'] != 44:
              raise SystemExit('catalog locale count is not 44')
          for project in catalog['supported_projects']:
              for locale in ('ms_my', 'fil_ph'):
                  if locale not in project['languages']:
                      raise SystemExit(f"{locale} missing from {project['id']}")
          readme = Path('README.md').read_text(encoding='utf-8')
          required = ['Les quarante-quatre langues', 'Malais (`ms_my`)', 'Filipino (`fil_ph`)', 'Pour le malais :', 'Pour le filipino :', '/ MS / FIL']
          missing = [item for item in required if item not in readme]
          if missing:
              raise SystemExit(f'README combined markers missing: {missing}')
          catalog_md = Path('CATALOG.md').read_text(encoding='utf-8')
          for marker in ('ms_my', 'fil_ph', 'Bahasa Melayu', 'Filipino'):
              if marker not in catalog_md:
                  raise SystemExit(f'CATALOG.md marker missing: {marker}')
          print('Combined Malay + Filipino metadata validation passed: 44 locales')
          PY

      - name: Commit combined metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No combined metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Filipino as locale 44 after Malay'
          git fetch origin release/0.9.0-filipino-rebased
          git rebase origin/release/0.9.0-filipino-rebased
          git push origin HEAD:release/0.9.0-filipino-rebased
