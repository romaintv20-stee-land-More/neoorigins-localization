name: Audit Japanese Medieval Origins

on:
  push:
    branches:
      - release/0.8.0-japanese
    paths:
      - scripts/audit_medievalorigins_upstream.py
      - src/main/resources/resourcepacks/fallback_localizations/assets/medievalorigins_ja_*/lang/ja_jp.json
      - .github/workflows/audit-japanese-medieval.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-japanese
      - name: Audit Japanese Medieval Origins
        run: python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
