name: Analyze 26.2 locale port

on:
  push:
    branches: [ work/070-26-2-locales ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit five new locales without failing
        run: |
          python3 scripts/audit_neoorigins_upstream.py \
            --ref 26.2 \
            --output build/analysis-26-2 \
            --locale it_it --locale pl_pl --locale ru_ru --locale tr_tr --locale zh_cn \
            --extra-namespace neoorigins_26_2
      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: analysis-26-2-locales-${{ github.sha }}
          path: build/analysis-26-2
          if-no-files-found: error
