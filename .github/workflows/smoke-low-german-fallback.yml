name: Smoke Low German fallback strategies
on:
  push:
    branches: [release/1.0.0-low-german]
    paths: ['.github/workflows/smoke-low-german-fallback.yml']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers<5' sentencepiece sacremoses
      - name: Compare direct and fallback translations
        run: |
          python3 - <<'PY'
          import torch
          from transformers import AutoTokenizer, AutoModelForSeq2SeqLM
          models=[
            ('base-gmw','Helsinki-NLP/opus-mt-tc-base-gmw-gmw'),
            ('big-gmw','Helsinki-NLP/opus-mt-tc-bible-big-deu_eng_fra_por_spa-gmw'),
          ]
          tests=[
            'Evolution disabled',
            'Evolution enabled',
            'Evolution is disabled.',
            'Evolution is enabled.',
            'Evolution progress',
            'Evolution path',
            'Random',
            'Charging Soul Fireball',
            'Night vision is disabled on this server.',
            'You cannot wear armor higher than iron armor.',
          ]
          for label,model_id in models:
              print('MODEL',label,model_id,flush=True)
              tok=AutoTokenizer.from_pretrained(model_id)
              model=AutoModelForSeq2SeqLM.from_pretrained(model_id); model.eval()
              enc=tok([f'>>nds<< {s}' for s in tests],return_tensors='pt',padding=True,truncation=True,max_length=256)
              with torch.inference_mode():
                  out=model.generate(**enc,num_beams=4,max_new_tokens=256,early_stopping=True)
              for s,t in zip(tests,tok.batch_decode(out,skip_special_tokens=True)):
                  print(f'SOURCE: {s}\n{label}: {t.strip()}\n---',flush=True)
              del model
          PY
