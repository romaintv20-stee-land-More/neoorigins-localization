name: Smoke Māori sentence-complete 1.3B
on:
  push:
    branches: [release/1.0.0-maori]
    paths: ['.github/workflows/smoke-maori-sentence-split.yml']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers<5' sentencepiece protobuf
      - name: Translate omitted Māori sentences separately
        run: |
          python3 - <<'PY'
          import re, torch
          from transformers import AutoTokenizer, AutoModelForSeq2SeqLM
          model_id='facebook/nllb-200-distilled-1.3B'
          tok=AutoTokenizer.from_pretrained(model_id,src_lang='eng_Latn')
          model=AutoModelForSeq2SeqLM.from_pretrained(model_id); model.eval()
          target=tok.convert_tokens_to_ids('mri_Latn')
          tests=[
            'A bee-like insectoid who flies freely, stings foes with a venomous strike, and coaxes crops to grow. Fragile wings and endless hunger are the price of flight.',
            'A fearless beast handler who bends hostile mobs to their will. Alone they are frail, but with a loyal pack at their side, they are a force to be reckoned with.',
            'Fires a devastating sonic bolt that hits in a 7-block radius. Costs 2 stamina. 6-second cooldown.',
            'Toggleable: gusts lift your jump higher (Jump Boost II). On by default — toggle off with the skill key if you want normal jump height.',
            'You carry your family\'s sword. It was your father\'s, and his mother\'s and...',
            '§cBlazenbreath:§r Press %s while holding coal in either hand to shoot forth a weak cone of flame. Hold blaze powder instead to shoot forth a moderate cone of flame. Scales with Fire Spell Power.',
          ]
          def parts(text):
              out=[]; pos=0
              for m in re.finditer(r'(?<=[.!?])\s+',text):
                  out.append((text[pos:m.start()],True)); out.append((m.group(0),False)); pos=m.end()
              out.append((text[pos:],True))
              return out
          for source in tests:
              result=[]
              for piece,translate in parts(source):
                  if not translate or not piece.strip(): result.append(piece); continue
                  enc=tok(piece.strip(),return_tensors='pt',truncation=True,max_length=512)
                  with torch.inference_mode():
                      gen=model.generate(**enc,forced_bos_token_id=target,num_beams=4,max_new_tokens=512,early_stopping=True)
                  result.append(tok.decode(gen[0],skip_special_tokens=True).strip())
              print('SOURCE:',source,flush=True)
              print('SPLIT_MRI:',''.join(result),flush=True)
              print('---',flush=True)
          PY
