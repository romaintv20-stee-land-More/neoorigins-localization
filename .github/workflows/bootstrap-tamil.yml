name: Bootstrap Tamil localization

on:
  push:
    branches:
      - release/0.9.0-tamil
    paths:
      - scripts/bootstrap_tamil.py
      - .github/workflows/bootstrap-tamil.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-tamil

      - name: Restrict add-on audits to Tamil
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("ta_in",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("ta_in",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Tamil NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/ta-discovery-mc-1.21.1 --locale ta_in
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/ta-discovery-mc-26.1 --locale ta_in
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/ta-discovery-mc-26.2 --locale ta_in

      - name: Discover Tamil add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Tamil fallback files
        run: python3 scripts/bootstrap_tamil.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Tamil NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/ta-audit-mc-1.21.1 --locale ta_in --fallback-namespace-glob 'neoorigins_ta_common_*' --extra-namespace neoorigins_ta_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/ta-audit-mc-26.1 --locale ta_in --fallback-namespace-glob 'neoorigins_ta_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/ta-audit-mc-26.2 --locale ta_in --fallback-namespace-glob 'neoorigins_ta_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Tamil add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Tamil text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/ta_in.json'))
          if not files:
              raise SystemExit('No ta_in localization files found')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          low = text.lower()
          tamil = len(re.findall(r'[\u0B80-\u0BFF]', text))
          markers = len(re.findall(r'(?:மற்றும்|நீங்கள்|உங்கள்|இந்த|ஒரு|மூலம்|உள்ள|இல்லை|செய்ய|பயன்படுத்த|போது|ஆனால்|வேண்டும்|முடியும்|இருந்து|வரை|என்ற|இது)', low))
          if tamil < 25000:
              raise SystemExit(f'Tamil script sanity too low: {tamil}')
          if markers < 500:
              raise SystemExit(f'Tamil lexical sanity too low: {markers}')
          print(f'Tamil text sanity passed: {markers} lexical markers, {tamil} Tamil-script chars across {len(files)} files')
          PY

      - name: Add Tamil target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeTamil121Translations' not in text:
              anchor = "def includeKyrgyz121Translations = (project.findProperty('include_kyrgyz_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Kyrgyz Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeTamil121Translations = (project.findProperty('include_tamil_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)
              anchor = "    inputs.property 'include_kyrgyz_121_translations', includeKyrgyz121Translations\n"
              if anchor not in text:
                  raise SystemExit('Kyrgyz Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_tamil_121_translations', includeTamil121Translations\n", 1)
              anchor = "    if (!includeKyrgyz121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_ky_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Kyrgyz Gradle exclusion anchor not found')
              block = anchor + "\n    if (!includeTamil121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_ta_121/**'\n    }\n"
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Tamil audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tamil-localization-audits-${{ github.sha }}
          path: |
            build/ta-discovery-*
            build/ta-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Tamil translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'ta_in.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Tamil translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Tamil localization fallback'
          git fetch origin release/0.9.0-tamil
          git rebase origin/release/0.9.0-tamil
          git push origin HEAD:release/0.9.0-tamil
