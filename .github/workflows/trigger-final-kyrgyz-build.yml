name: Trigger final Kyrgyz build

on:
  push:
    branches: [ release/0.9.0-kyrgyz ]
    paths:
      - '.github/workflows/trigger-final-kyrgyz-build.yml'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch final Kyrgyz build on current staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-0.9.0-kyrgyz.yml/dispatches" \
            -d '{"ref":"release/0.9.0-kyrgyz"}'
