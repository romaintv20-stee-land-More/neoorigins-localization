name: Finalize 26.1 locale port

on:
  push:
    branches: [ work/070-26-1-locales ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/070-26-1-locales
          fetch-depth: 0

      - name: Update metadata and docs
        run: python3 scripts/finalize_26_1_locales.py

      - name: Validate localization files
        run: python3 scripts/validate.py

      - name: Audit 26.1.x ten-language coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py \
            --ref v2.2.25 \
            --output build/upstream-audit-mc-26.1.x \
            --locale fr_fr --locale nl_nl --locale es_es --locale de_de --locale pt_br \
            --locale it_it --locale pl_pl --locale ru_ru --locale tr_tr --locale zh_cn \
            --extra-namespace neoorigins_121_batch1 \
            --fallback-namespace-glob 'neoorigins_tr_*' \
            --fail-on-overlap --fail-on-missing

      - name: Commit metadata and docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json CATALOG.md README.md docs/TEST_PLAN.md
          if ! git diff --cached --quiet; then
            git commit -m "Document 0.7.0 support for Minecraft 26.1.x"
            git push origin HEAD:work/070-26-1-locales
          fi
