def includeHebrew121Translations = (project.findProperty('include_hebrew_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeThai121Translations = (project.findProperty('include_thai_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeSlovak121Translations = (project.findProperty('include_slovak_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeSlovenian121Translations = (project.findProperty('include_slovenian_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeCroatian121Translations = (project.findProperty('include_croatian_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeSerbian121Translations = (project.findProperty('include_serbian_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeCatalan121Translations = (project.findProperty('include_catalan_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeEstonian121Translations = (project.findProperty('include_estonian_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
def includeLithuanian121Translations = (project.findProperty('include_lithuanian_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()
