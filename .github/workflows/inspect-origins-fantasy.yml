name: Inspect Origins Fantasy

on:
  push:
    branches: [ work/070-origins-fantasy ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Argos Translate
        run: pip install --quiet argostranslate

      - name: Fetch Origins Fantasy 1.1.3 and generate localization drafts
        run: |
          python3 - <<'PY'
          import html, json, re, urllib.request, zipfile
          from pathlib import Path
          import argostranslate.package
          import argostranslate.translate

          project_url = 'https://www.curseforge.com/minecraft/mc-mods/origins-fantsy-neoorigins/files/all?page=1&pageSize=50'
          req = urllib.request.Request(project_url, headers={'User-Agent': 'Mozilla/5.0'})
          text = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
          name = 'Origins-Fantasy-1.21.1-NeoOrigins-1.1.3.jar'
          candidates = []
          for m in re.finditer(r'href="([^"]*/files/(\d+)[^"]*)"[^>]*>[^<]*' + re.escape(name), text):
              candidates.append((m.group(2), html.unescape(m.group(1))))
          if not candidates:
              for pos in [m.start() for m in re.finditer(re.escape(name), text)]:
                  chunk = text[max(0, pos-4000):pos+1000]
                  ids = re.findall(r'/files/(\d+)', chunk)
                  if ids:
                      candidates.append((ids[-1], ''))
          if not candidates:
              raise SystemExit('Could not find current CurseForge file id')

          file_id = candidates[0][0]
          a, b = file_id[:-3], file_id[-3:]
          urls = [
              f'https://edge.forgecdn.net/files/{a}/{b}/{name}',
              f'https://mediafilez.forgecdn.net/files/{a}/{b}/{name}',
              f'https://www.curseforge.com/minecraft/mc-mods/origins-fantsy-neoorigins/download/{file_id}/file',
          ]
          data = used_url = None
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Referer': 'https://www.curseforge.com/', 'Accept': '*/*'})
                  candidate = urllib.request.urlopen(req, timeout=60).read()
                  if candidate[:2] == b'PK':
                      data, used_url = candidate, url
                      break
              except Exception as exc:
                  print('Download failed:', url, type(exc).__name__, exc)
          if data is None:
              raise SystemExit('Unable to download current Origins Fantasy JAR')

          out = Path('build/origins-fantasy-inspection')
          out.mkdir(parents=True, exist_ok=True)
          jar = Path('build/fantasy.jar')
          jar.write_bytes(data)
          with zipfile.ZipFile(jar) as z:
              en = json.loads(z.read('assets/origins_fantasy/lang/en_us.json').decode('utf-8'))
              mod_toml = z.read('META-INF/neoforge.mods.toml').decode('utf-8')
          (out/'en_us.json').write_text(json.dumps(en, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          (out/'neoforge.mods.toml').write_text(mod_toml, encoding='utf-8')
          (out/'metadata.json').write_text(json.dumps({'file_id': file_id, 'filename': name, 'download_url': used_url, 'english_keys': len(en)}, indent=2)+'\n', encoding='utf-8')

          targets = {
              'fr_fr': 'fr', 'de_de': 'de', 'es_es': 'es', 'pt_br': 'pt', 'nl_nl': 'nl',
              'it_it': 'it', 'pl_pl': 'pl', 'ru_ru': 'ru', 'tr_tr': 'tr', 'zh_cn': 'zh'
          }
          argostranslate.package.update_package_index()
          available = argostranslate.package.get_available_packages()
          installed_targets = set()
          for locale, target in targets.items():
              if target in installed_targets:
                  continue
              matches = [p for p in available if p.from_code == 'en' and p.to_code == target]
              if not matches:
                  raise SystemExit(f'No Argos model en->{target}')
              pkg = matches[0]
              print('Downloading model en->', target, pkg.package_version)
              path = pkg.download()
              argostranslate.package.install_from_path(path)
              installed_targets.add(target)

          drafts = out/'drafts'
          drafts.mkdir(exist_ok=True)
          for locale, target in targets.items():
              translated = {key: argostranslate.translate.translate(value, 'en', target).strip() for key, value in en.items()}
              (drafts/f'{locale}.json').write_text(json.dumps(translated, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
              print(locale, len(translated))
          PY

      - name: Upload inspection and drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origins-fantasy-inspection-${{ github.sha }}
          path: build/origins-fantasy-inspection
          if-no-files-found: error
