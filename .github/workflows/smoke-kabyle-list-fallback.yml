name: Smoke Kabyle 1.3B list fallback

on:
  push:
    branches: [release/1.0.0-kabyle]
    paths: [.github/workflows/smoke-kabyle-list-fallback.yml]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/1.0.0-kabyle
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers<5' sentencepiece protobuf
      - name: Translate problematic sentence by segments
        run: |
          python3 - <<'PY'
          import torch
          from transformers import AutoModelForSeq2SeqLM,AutoTokenizer
          weights='mimech011/nllb-200-kabyle-1.3B'
          tok=AutoTokenizer.from_pretrained('facebook/nllb-200-distilled-1.3B',src_lang='eng_Latn')
          model=AutoModelForSeq2SeqLM.from_pretrained(weights);model.eval()
          target=tok.convert_tokens_to_ids('kab_Latn')
          tests=[
            'Can eat cobblestone for modest nutrition.',
            'Can eat stone for modest nutrition.',
            'Can eat granite for modest nutrition.',
            'Can eat diorite for modest nutrition.',
            'Can eat andesite for modest nutrition.',
            'Can eat tuff for modest nutrition.',
            'Can eat deepslate for modest nutrition.',
            'Can eat cobbled deepslate for modest nutrition.',
            'Can eat basalt for modest nutrition.',
            'Can eat blackstone for modest nutrition.',
            "Won't go down on a full stomach.",
            'Can eat the following blocks for modest nutrition:',
          ]
          enc=tok(tests,return_tensors='pt',padding=True,truncation=True,max_length=256)
          with torch.inference_mode():
              out=model.generate(**enc,forced_bos_token_id=target,num_beams=4,max_new_tokens=128,early_stopping=True)
          for s,t in zip(tests,tok.batch_decode(out,skip_special_tokens=True)):
              print(f'SOURCE: {s}\nKAB: {t.strip()}\n---',flush=True)
          PY
