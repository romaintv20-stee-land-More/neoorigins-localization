name: Audit Classes Extended

on:
  push:
    branches: [ release/0.8.0-classes-extended ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Origins Classes Extended upstream locales
        run: python3 scripts/audit_origins_classes_extended_upstream.py --annotate-missing --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origins-classes-extended-upstream-audit-${{ github.sha }}
          path: build/origins-classes-extended-upstream-audit
          if-no-files-found: error
