name: Smoke Low German gmw-gmw direct model

on:
  push:
    branches: [release/1.0.0-low-german]
    paths: [.github/workflows/smoke-low-german-gmw.yml]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers<5' sentencepiece sacremoses
      - name: Translate representative Low German strings
        run: |
          python3 - <<'PY'
          import torch
          from transformers import AutoModelForSeq2SeqLM,AutoTokenizer
          model_id='Helsinki-NLP/opus-mt-tc-base-gmw-gmw';target='>>nds<<'
          tok=AutoTokenizer.from_pretrained(model_id);model=AutoModelForSeq2SeqLM.from_pretrained(model_id);model.eval()
          tests=[
            'Inflicts Wither and Suppression, dealing damage over time. When broken by a Soul Sorcerer, deals percentage-based damage to the target based on its maximum health.',
            'A distant descendant of the Ghasts that escaped from the Nether and became more human due to prolonged exposure to the Overworld.',
            'Although you feel fine near soul fire, the regular burning fire from torches and campfires has a strong weakening effect on you.',
            'You gain twice the xp from killing chickens.',
            'Choose your origin',
            'Night vision is disabled on this server.',
          ]
          enc=tok([f'{target} {x}' for x in tests],return_tensors='pt',padding=True,truncation=True,max_length=512)
          with torch.inference_mode():out=model.generate(**enc,num_beams=4,max_new_tokens=512,early_stopping=True)
          for s,t in zip(tests,tok.batch_decode(out,skip_special_tokens=True)):
              print(f'SOURCE: {s}\nNDS_GMW: {t.strip()}\n---',flush=True)
          PY
