name: Finalize Bosnian metadata

on:
  push:
    branches: [ release/0.9.0-bosnian ]
    paths:
      - scripts/finalize_bosnian_metadata.py
      - .github/workflows/finalize-bosnian-metadata.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.9.0-bosnian
          fetch-depth: 0

      - name: Synchronize Bosnian catalog and README metadata
        run: python3 scripts/finalize_bosnian_metadata.py

      - name: Assert 68-language metadata state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          assert catalog['project']['supported_locale_count'] == 68
          count = 0
          def walk(obj):
              global count
              if isinstance(obj, dict):
                  if 'bs_ba' in obj and isinstance(obj['bs_ba'], dict) and obj['bs_ba'].get('name') == 'Bosanski':
                      count += 1
                  for value in obj.values(): walk(value)
              elif isinstance(obj, list):
                  for value in obj: walk(value)
          walk(catalog)
          assert count >= 11, count
          neo = next(x for x in catalog['supported_projects'] if x.get('id') == 'neoorigins')
          ns = neo['compatibility']['fallback_namespaces']
          assert ns['bosnian_common_glob'] == 'neoorigins_bs_common_*'
          assert ns['bosnian_mc_1_21_1'] == 'neoorigins_bs_121'
          readme = Path('README.md').read_text(encoding='utf-8')
          assert readme.count('| 68 |') == 3
          assert 'Bosnien (`bs_ba`)' in readme
          assert 'Pour le bosnien :' in readme
          assert 'Les soixante-huit langues' in readme
          catalogue = Path('CATALOG.md').read_text(encoding='utf-8')
          assert catalogue.count('Bosanski (`bs_ba`)') >= 11
          print(f'Metadata assertions passed: 68 locales, {count} Bosnian catalog entries.')
          PY

      - name: Validate JSON and whitespace
        run: |
          python3 scripts/validate.py
          git diff --check

      - name: Commit Bosnian metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Bosnian localization in 0.9.0 beta'
          git fetch origin release/0.9.0-bosnian
          git rebase origin/release/0.9.0-bosnian
          git push origin HEAD:release/0.9.0-bosnian
