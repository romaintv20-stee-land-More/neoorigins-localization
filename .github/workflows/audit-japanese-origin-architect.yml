name: Audit Japanese Origin Architect

on:
  push:
    branches:
      - release/0.8.0-japanese
    paths:
      - src/main/resources/resourcepacks/fallback_localizations/assets/originsmodernui/lang/ja_jp.json
      - scripts/audit_origin_architect_upstream.py
      - .github/workflows/audit-japanese-origin-architect.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-japanese
      - name: Audit Origin Architect Japanese
        run: python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
