name: Bootstrap Frisian localization

on:
  push:
    branches:
      - release/0.9.0-frisian
    paths:
      - scripts/bootstrap_frisian.py
      - .github/workflows/bootstrap-frisian.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-frisian

      - name: Restrict add-on audits to Frisian
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("fy_nl",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("fy_nl",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Frisian NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/fy-discovery-mc-1.21.1 --locale fy_nl
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/fy-discovery-mc-26.1 --locale fy_nl
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/fy-discovery-mc-26.2 --locale fy_nl

      - name: Discover Frisian add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Frisian fallback files
        run: python3 scripts/bootstrap_frisian.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Frisian NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/fy-audit-mc-1.21.1 --locale fy_nl --fallback-namespace-glob 'neoorigins_fy_common_*' --extra-namespace neoorigins_fy_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/fy-audit-mc-26.1 --locale fy_nl --fallback-namespace-glob 'neoorigins_fy_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/fy-audit-mc-26.2 --locale fy_nl --fallback-namespace-glob 'neoorigins_fy_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Frisian add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Frisian text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/fy_nl.json'))
          if not files:
              raise SystemExit('No fy_nl localization files found')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          latin_chars = len(re.findall(r'[A-Za-zÀ-ÿ]', text))
          frisian_signals = len(re.findall(r'(?:û|â|ê|ô|ú|Û|Â|Ê|Ô|Ú|ij|sk|tsj|sj)', text))
          markers = len(re.findall(r'\b(?:de|it|in|en|fan|mei|foar|net|gjin|is|binne|hat|op|oan|út|sûnder|kin|spiler|wrâld|taal|krêft|snelheid|sûnens|nacht|klear)\b', text, flags=re.I))
          print(f'Frisian sanity counts: {latin_chars} Latin chars, {frisian_signals} Frisian orthographic signals, {markers} lexical markers across {len(files)} files')
          if latin_chars < 70000:
              raise SystemExit(f'Frisian Latin-script sanity too low: {latin_chars}')
          if frisian_signals < 500:
              raise SystemExit(f'Frisian orthographic-signal sanity too low: {frisian_signals}')
          if markers < 500:
              raise SystemExit(f'Frisian lexical-marker sanity too low: {markers}')
          print('Frisian text sanity passed')
          PY

      - name: Add Frisian target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeFrisian121Translations' not in text:
              anchor = "def includeAsturian121Translations = (project.findProperty('include_asturian_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Asturian Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeFrisian121Translations = (project.findProperty('include_frisian_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)
              anchor = "    inputs.property 'include_asturian_121_translations', includeAsturian121Translations\n"
              if anchor not in text:
                  raise SystemExit('Asturian Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_frisian_121_translations', includeFrisian121Translations\n", 1)
              anchor = "    if (!includeAsturian121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_ast_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Asturian Gradle exclusion anchor not found')
              block = anchor + "\n    if (!includeFrisian121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_fy_121/**'\n    }\n"
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Frisian audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frisian-localization-audits-${{ github.sha }}
          path: |
            build/fy-discovery-*
            build/fy-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Frisian translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'fy_nl.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Frisian translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Frisian localization fallback'
          git fetch origin release/0.9.0-frisian
          git rebase origin/release/0.9.0-frisian
          git push origin HEAD:release/0.9.0-frisian
