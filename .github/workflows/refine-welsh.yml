name: Refine Welsh localization

on:
  push:
    branches:
      - release/0.9.0-welsh
    paths:
      - scripts/refine_welsh.py
      - .github/workflows/refine-welsh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-welsh

      - name: Apply contextual Welsh fixes
        run: python3 scripts/refine_welsh.py

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Check Welsh placeholders against NeoOrigins upstream
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref 860ecdb24e723983e93004ea8ceb5de90ccf0d70 --output build/cy-refine-audit-121 --locale cy_gb --fallback-namespace-glob 'neoorigins_cy_common_*' --extra-namespace neoorigins_cy_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 3c1c7365507679c836d3c14af5d4dd0654652e87 --output build/cy-refine-audit-261 --locale cy_gb --fallback-namespace-glob 'neoorigins_cy_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 65864716a5a796fa1c51ec3e8a6d9640abebb4ca --output build/cy-refine-audit-262 --locale cy_gb --fallback-namespace-glob 'neoorigins_cy_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Sanity-check corrected Welsh terminology
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/cy_gb.json'))
          text = '\n'.join(str(v) for p in files for v in json.loads(p.read_text(encoding='utf-8')).values())
          markers = len(re.findall(r'(?i)\b(?:y|yr|a|ac|yn|i|o|ar|gyda|gall|eich|chi|pan|nid|mae|cael|neu|hwn|hon|hyn|wedi|fel|gan)\b', text))
          bad = [
              'Ymgeisiwch',
              'Ni all eich tarddiad gwythiennau-mwynglawdd.',
              '"Tâl"',
              'Pavloved',
              '"Graddfeydd"',
              'Toggle Pensaer HUD',
              'Dangos lefel Pensaer',
              'funud.Heb',
              'gwlân.Digon',
          ]
          remaining = [item for item in bad if item in text]
          if remaining:
              raise SystemExit(f'Known Welsh false-friends remain: {remaining}')
          if markers < 500:
              raise SystemExit(f'Welsh lexical sanity check too low: {markers}')
          print(f'Welsh refinement sanity passed: {markers} Welsh markers across {len(files)} files')
          PY

      - name: Commit refined Welsh translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'cy_gb.json' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo 'No Welsh refinement changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Welsh Minecraft terminology'
          git fetch origin release/0.9.0-welsh
          git rebase origin/release/0.9.0-welsh
          git push origin HEAD:release/0.9.0-welsh
