name: Finalize Lao metadata

on:
  push:
    branches: [ release/0.9.0-lao ]
    paths:
      - scripts/finalize_lao_metadata.py
      - .github/workflows/finalize-lao-metadata.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.9.0-lao
          fetch-depth: 0

      - name: Synchronize Lao catalog and README metadata
        run: python3 scripts/finalize_lao_metadata.py

      - name: Assert 67-language metadata state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          assert catalog['project']['supported_locale_count'] == 67
          count = 0
          def walk(obj):
              global count
              if isinstance(obj, dict):
                  if 'lo_la' in obj and isinstance(obj['lo_la'], dict) and obj['lo_la'].get('name') == 'ລາວ':
                      count += 1
                  for value in obj.values(): walk(value)
              elif isinstance(obj, list):
                  for value in obj: walk(value)
          walk(catalog)
          assert count >= 11, count
          neo = next(x for x in catalog['supported_projects'] if x.get('id') == 'neoorigins')
          ns = neo['compatibility']['fallback_namespaces']
          assert ns['lao_common_glob'] == 'neoorigins_lo_common_*'
          assert ns['lao_mc_1_21_1'] == 'neoorigins_lo_121'
          readme = Path('README.md').read_text(encoding='utf-8')
          assert readme.count('| 67 |') == 3
          assert 'Lao (`lo_la`)' in readme
          assert 'Pour le lao :' in readme
          assert 'Les soixante-sept langues' in readme
          catalogue = Path('CATALOG.md').read_text(encoding='utf-8')
          assert catalogue.count('ລາວ (`lo_la`)') >= 11
          print(f'Metadata assertions passed: 67 locales, {count} Lao catalog entries.')
          PY

      - name: Validate JSON and whitespace
        run: |
          python3 scripts/validate.py
          git diff --check

      - name: Commit Lao metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Lao localization in 0.9.0 beta'
          git fetch origin release/0.9.0-lao
          git rebase origin/release/0.9.0-lao
          git push origin HEAD:release/0.9.0-lao
