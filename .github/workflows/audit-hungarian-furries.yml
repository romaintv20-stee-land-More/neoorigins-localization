name: Audit Hungarian Origins Furries

on:
  push:
    branches:
      - release/0.8.0-hungarian
    paths:
      - .github/workflows/audit-hungarian-furries.yml
      - scripts/audit_origins_furries_upstream.py
      - src/main/resources/resourcepacks/fallback_localizations/assets/origins_furries/lang/hu_hu.json

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-hungarian
      - name: Audit Origins Furries Hungarian
        run: |
          python3 scripts/audit_origins_furries_upstream.py \
            --file-id 8397352 \
            --filename Origins-Furries-1.21.1-NeoOrigins-1.0.0.jar \
            --fail-on-overlap \
            --fail-on-missing \
            --fail-on-placeholders
