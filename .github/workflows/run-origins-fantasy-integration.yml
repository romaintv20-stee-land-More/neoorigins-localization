name: Finalize Origins Fantasy integration

on:
  push:
    branches: [ work/070-origins-fantasy ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/070-origins-fantasy
          fetch-depth: 0

      - name: Finalize metadata and docs
        run: |
          # The helper performs the intended edits before its legacy catalog invocation.
          python3 scripts/finalize_origins_fantasy_integration.py || true
          python3 scripts/generate_catalog.py

      - name: Validate localization files
        run: python3 scripts/validate.py

      - name: Audit Origins Fantasy translations
        run: python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Commit non-workflow integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md catalog.json CATALOG.md docs/TEST_PLAN.md scripts/generate_catalog.py
          git add -u scripts/integrate_origins_fantasy_artifacts.py || true
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Origins Fantasy metadata for 0.7.0"
            git push origin HEAD:work/070-origins-fantasy
          fi
