name: Sync Faroese 54-locale handoff

on:
  push:
    branches:
      - release/0.9.0-faroese
    paths:
      - .github/workflows/sync-handoff-faroese.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-faroese

      - name: Update handoff
        run: python3 scripts/update_handoff_faroese.py

      - name: Validate handoff state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('PROJECT_HANDOFF.txt').read_text(encoding='utf-8')
          required=[
              '0.9.0 development currently has 54 locales:',
              '- 54: Faroese / fo_fo',
              'FIFTY-FOUR IS NOT THE FINAL TARGET.',
              'Faroese locale: fo_fo / Føroyskt.',
              'workflow run 34365948928: SUCCESS',
              'workflow run 34366799610: SUCCESS',
              'synchronization run 34367019804: SUCCESS',
              'run ID 34367146697: SUCCESS on all three jobs',
              'artifact ID 10110417327',
              'artifact ID 10110379318',
              'artifact ID 10110383382',
              'NEXT LANGUAGE = language 55.',
              'Do not stop permanently at 55;',
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit(f'Handoff markers missing: {missing}')
          print('Faroese handoff validation passed: 54 locales, next 55')
          PY

      - name: Commit handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.txt
          if git diff --cached --quiet; then
            echo 'No handoff changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Faroese 0.9.0 handoff'
          git fetch origin release/0.9.0-faroese
          git rebase origin/release/0.9.0-faroese
          git push origin HEAD:release/0.9.0-faroese
