name: Bootstrap Kyrgyz localization

on:
  push:
    branches:
      - release/0.9.0-kyrgyz
    paths:
      - scripts/bootstrap_kyrgyz.py
      - .github/workflows/bootstrap-kyrgyz.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-kyrgyz

      - name: Restrict add-on audits to Kyrgyz
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("ky_kg",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("ky_kg",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Kyrgyz NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/ky-discovery-mc-1.21.1 --locale ky_kg
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/ky-discovery-mc-26.1 --locale ky_kg
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/ky-discovery-mc-26.2 --locale ky_kg

      - name: Discover Kyrgyz add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Kyrgyz fallback files
        run: python3 scripts/bootstrap_kyrgyz.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Kyrgyz NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/ky-audit-mc-1.21.1 --locale ky_kg --fallback-namespace-glob 'neoorigins_ky_common_*' --extra-namespace neoorigins_ky_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/ky-audit-mc-26.1 --locale ky_kg --fallback-namespace-glob 'neoorigins_ky_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/ky-audit-mc-26.2 --locale ky_kg --fallback-namespace-glob 'neoorigins_ky_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Kyrgyz add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Kyrgyz text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/ky_kg.json'))
          if not files:
              raise SystemExit('No ky_kg localization files found')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          low = text.lower()
          kyrgyz = len(re.findall(r'[ҢңӨөҮү]', text))
          cyrillic = len(re.findall(r'[А-Яа-яЁёҢңӨөҮү]', text))
          markers = len(re.findall(r'\b(?:жана|үчүн|менен|бул|сиз|сен|же|эгер|болот|болгон|колдон|оюнчу|күч|бас|кийин|чейин|аркылуу)\b', low))
          if kyrgyz < 500:
              raise SystemExit(f'Kyrgyz-specific letter sanity check too low: {kyrgyz}')
          if cyrillic < 25000:
              raise SystemExit(f'Kyrgyz Cyrillic sanity check too low: {cyrillic}')
          if markers < 500:
              raise SystemExit(f'Kyrgyz lexical sanity check too low: {markers}')
          print(f'Kyrgyz text sanity passed: {markers} lexical markers, {kyrgyz} Kyrgyz-specific letters, {cyrillic} Cyrillic chars across {len(files)} files')
          PY

      - name: Add Kyrgyz target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeKyrgyz121Translations' not in text:
              anchor = "def includeEsperanto121Translations = (project.findProperty('include_esperanto_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Esperanto Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeKyrgyz121Translations = (project.findProperty('include_kyrgyz_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)
              anchor = "    inputs.property 'include_esperanto_121_translations', includeEsperanto121Translations\n"
              if anchor not in text:
                  raise SystemExit('Esperanto Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_kyrgyz_121_translations', includeKyrgyz121Translations\n", 1)
              anchor = "    if (!includeEsperanto121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_eo_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Esperanto Gradle exclusion anchor not found')
              block = anchor + "\n    if (!includeKyrgyz121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_ky_121/**'\n    }\n"
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Kyrgyz audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kyrgyz-localization-audits-${{ github.sha }}
          path: |
            build/ky-discovery-*
            build/ky-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Kyrgyz translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'ky_kg.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Kyrgyz translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Kyrgyz localization fallback'
          git fetch origin release/0.9.0-kyrgyz
          git rebase origin/release/0.9.0-kyrgyz
          git push origin HEAD:release/0.9.0-kyrgyz
