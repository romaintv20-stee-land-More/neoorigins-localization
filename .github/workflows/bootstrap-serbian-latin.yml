name: Bootstrap Serbian Latin localization

on:
  push:
    branches:
      - release/0.9.0-beta
    paths:
      - scripts/bootstrap_serbian_latin.py
      - .github/workflows/bootstrap-serbian-latin.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-beta

      - name: Restrict add-on audits to Serbian Latin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("sr_cs",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("sr_cs",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Serbian Latin NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref 860ecdb24e723983e93004ea8ceb5de90ccf0d70 --output build/sr-latn-discovery-mc-1.21.1 --locale sr_cs
          python3 scripts/audit_neoorigins_upstream.py --ref 3c1c7365507679c836d3c14af5d4dd0654652e87 --output build/sr-latn-discovery-mc-26.1 --locale sr_cs
          python3 scripts/audit_neoorigins_upstream.py --ref 65864716a5a796fa1c51ec3e8a6d9640abebb4ca --output build/sr-latn-discovery-mc-26.2 --locale sr_cs

      - name: Discover Serbian Latin add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Serbian Latin fallback files
        run: python3 scripts/bootstrap_serbian_latin.py

      - name: Prune NeoOrigins keys already translated upstream
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref 860ecdb24e723983e93004ea8ceb5de90ccf0d70 --output build/sr-latn-prune-mc-1.21.1 --locale sr_cs --fallback-namespace-glob 'neoorigins_sr_common_*' --extra-namespace neoorigins_sr_121 --prune
          python3 scripts/audit_neoorigins_upstream.py --ref 3c1c7365507679c836d3c14af5d4dd0654652e87 --output build/sr-latn-prune-mc-26.1 --locale sr_cs --fallback-namespace-glob 'neoorigins_sr_common_*' --extra-namespace neoorigins_26_1 --prune
          python3 scripts/audit_neoorigins_upstream.py --ref 65864716a5a796fa1c51ec3e8a6d9640abebb4ca --output build/sr-latn-prune-mc-26.2 --locale sr_cs --fallback-namespace-glob 'neoorigins_sr_common_*' --extra-namespace neoorigins_26_2 --prune

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Serbian Latin NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref 860ecdb24e723983e93004ea8ceb5de90ccf0d70 --output build/sr-latn-audit-mc-1.21.1 --locale sr_cs --fallback-namespace-glob 'neoorigins_sr_common_*' --extra-namespace neoorigins_sr_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 3c1c7365507679c836d3c14af5d4dd0654652e87 --output build/sr-latn-audit-mc-26.1 --locale sr_cs --fallback-namespace-glob 'neoorigins_sr_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 65864716a5a796fa1c51ec3e8a6d9640abebb4ca --output build/sr-latn-audit-mc-26.2 --locale sr_cs --fallback-namespace-glob 'neoorigins_sr_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Serbian Latin add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Serbian Latin text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/sr_cs.json'))
          if not files:
              raise SystemExit('No sr_cs localization files found')
          values = []
          for path in files:
              values.extend(str(v) for v in json.loads(path.read_text(encoding='utf-8')).values())
          cyrillic = sum(len(re.findall(r'[А-Яа-яЂЈЉЊЋЏђјљњћџ]', value)) for value in values)
          serbian_latin = sum(len(re.findall(r'[ČĆŽŠĐčćžšđ]', value)) for value in values)
          if cyrillic != 0:
              raise SystemExit(f'Serbian Latin still contains {cyrillic} Serbian Cyrillic letters')
          if serbian_latin < 1000:
              raise SystemExit(f'Serbian Latin sanity check too low: {serbian_latin} Serbian Latin diacritics')
          print(f'Serbian Latin text sanity check passed: {serbian_latin} Serbian Latin diacritics across {len(files)} files; 0 Cyrillic letters')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Serbian Latin audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: serbian-latin-localization-audits-${{ github.sha }}
          path: |
            build/sr-latn-discovery-*
            build/sr-latn-prune-*
            build/sr-latn-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Serbian Latin translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'sr_cs.json' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo 'No Serbian Latin translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Serbian Latin localization fallback'
          git fetch origin release/0.9.0-beta
          git rebase origin/release/0.9.0-beta
          git push origin HEAD:release/0.9.0-beta
