name: Build NeoOrigins Localization 1.0.0 Interslavic staging

on:
  push:
    branches:
      - release/1.0.0-interslavic
    paths:
      - 'src/**/isv.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc-1.21.1
            java: '21'
            gradle: '8.14.3'
            minecraft: '1.21.1'
            minecraft_range: '[1.21.1]'
            neoforge: '21.1.248'
            loader_range: '[1,)'
            parchment: 'true'
            pack_format: '34'
            source_variant: mc1_21_1
            include_addon_translations: 'true'
            include_121_batch_translations: 'true'
            include_interslavic_121_translations: 'true'
            include_26_1_translations: 'false'
            include_26_2_translations: 'false'
            expected_delta: neoorigins_isv_121
            expected_files: '27'
            mod_version: 1.0.0-beta+1.21.1
          - target: mc-26.1.x
            java: '25'
            gradle: '9.4.1'
            minecraft: '26.1.2'
            minecraft_range: '[26.1,26.2)'
            neoforge: '26.1.2.29-beta'
            loader_range: '[4,)'
            parchment: 'false'
            pack_format: '84'
            source_variant: mc26_1
            include_addon_translations: 'false'
            include_121_batch_translations: 'true'
            include_interslavic_121_translations: 'false'
            include_26_1_translations: 'true'
            include_26_2_translations: 'false'
            expected_delta: neoorigins_26_1
            expected_files: '17'
            mod_version: 1.0.0-beta+26.1
          - target: mc-26.2
            java: '25'
            gradle: '9.4.1'
            minecraft: '26.2'
            minecraft_range: '[26.2,26.3)'
            neoforge: '26.2.0.3-beta'
            loader_range: '[4,)'
            parchment: 'false'
            pack_format: '84'
            source_variant: mc26_1
            include_addon_translations: 'false'
            include_121_batch_translations: 'false'
            include_interslavic_121_translations: 'false'
            include_26_1_translations: 'false'
            include_26_2_translations: 'true'
            expected_delta: neoorigins_26_2
            expected_files: '17'
            mod_version: 1.0.0-beta+26.2

    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/1.0.0-interslavic

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Validate localization JSON
        run: python3 scripts/validate.py

      - name: Build pinned target
        run: |
          gradle build --stacktrace \
            "-Pjava_version=${{ matrix.java }}" \
            "-Puse_parchment=${{ matrix.parchment }}" \
            "-Presource_pack_format=${{ matrix.pack_format }}" \
            "-Psource_variant=${{ matrix.source_variant }}" \
            "-Pinclude_addon_translations=${{ matrix.include_addon_translations }}" \
            "-Pinclude_121_batch_translations=${{ matrix.include_121_batch_translations }}" \
            "-Pinclude_turkish_split_translations=true" \
            "-Pinclude_interslavic_121_translations=${{ matrix.include_interslavic_121_translations }}" \
            "-Pinclude_26_1_translations=${{ matrix.include_26_1_translations }}" \
            "-Pinclude_26_2_translations=${{ matrix.include_26_2_translations }}" \
            "-Pminecraft_version=${{ matrix.minecraft }}" \
            "-Pminecraft_version_range=${{ matrix.minecraft_range }}" \
            "-Pneo_version=${{ matrix.neoforge }}" \
            "-Ploader_version_range=${{ matrix.loader_range }}" \
            "-Pmod_version=${{ matrix.mod_version }}"

      - name: Inspect Interslavic files in built JAR
        env:
          TARGET: ${{ matrix.target }}
          EXPECTED_DELTA: ${{ matrix.expected_delta }}
          EXPECTED_FILES: ${{ matrix.expected_files }}
          INCLUDE_ADDONS: ${{ matrix.include_addon_translations }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          jars = [p for p in Path('build/libs').glob('*.jar') if not p.name.endswith('-sources.jar')]
          if len(jars) != 1:
              raise SystemExit(f'Expected exactly one runtime JAR, found {[p.name for p in jars]}')
          jar = jars[0]
          with ZipFile(jar) as zf:
              names = zf.namelist()
              locale_files = sorted(n for n in names if n.endswith('/lang/isv.json'))

          target = os.environ['TARGET']
          expected_delta = os.environ['EXPECTED_DELTA']
          expected_files = int(os.environ['EXPECTED_FILES'])
          include_addons = os.environ['INCLUDE_ADDONS'] == 'true'

          def present(fragment):
              return any(fragment in name for name in locale_files)

          missing_common = [
              f'neoorigins_isv_common_{index:02d}/lang/isv.json'
              for index in range(1, 17)
              if not present(f'neoorigins_isv_common_{index:02d}/lang/isv.json')
          ]
          if missing_common:
              raise SystemExit(f'Missing Interslavic common entries: {missing_common}')
          if not present(f'{expected_delta}/lang/isv.json'):
              raise SystemExit(f'Missing expected Interslavic delta: {expected_delta}')

          addon_namespaces = [
              'medievalorigins', 'ibarnorigins', 'origins_fantasy',
              'origins_backgrounds', 'origins_backgrounds_two',
              'origins_backgrounds_iss', 'origins_furries',
              'origins_classes_ex', 'origins_classes_iss', 'originsmodernui',
          ]
          addon_entries = [f'{ns}/lang/isv.json' for ns in addon_namespaces]
          if include_addons:
              missing_addons = [entry for entry in addon_entries if not present(entry)]
              if missing_addons:
                  raise SystemExit(f'Missing Interslavic add-on entries: {missing_addons}')
              if present('neoorigins_26_1/lang/isv.json') or present('neoorigins_26_2/lang/isv.json'):
                  raise SystemExit('1.21.1 JAR contains a 26.x Interslavic delta')
          else:
              wrongly_included = [entry for entry in addon_entries if present(entry)]
              if wrongly_included:
                  raise SystemExit(f'26.x JAR contains Interslavic add-ons: {wrongly_included}')
              if present('neoorigins_isv_121/lang/isv.json'):
                  raise SystemExit('26.x JAR contains the Interslavic 1.21.1 delta')
              other_delta = 'neoorigins_26_2' if expected_delta == 'neoorigins_26_1' else 'neoorigins_26_1'
              if present(f'{other_delta}/lang/isv.json'):
                  raise SystemExit(f'{target} JAR contains wrong Interslavic delta {other_delta}')

          if len(locale_files) != expected_files:
              raise SystemExit(f'{target}: expected {expected_files} isv files, got {len(locale_files)}: {locale_files}')
          print(f'Interslavic isv audit: {target} = {len(locale_files)} files; JAR={jar.name}; delta={expected_delta}')
          PY

      - name: Upload built JAR
        uses: actions/upload-artifact@v7
        with:
          name: neoorigins-localization-1.0.0-interslavic-${{ matrix.target }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

  finalize-metadata:
    name: Finalize locale 88 metadata
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest staging branch
        uses: actions/checkout@v7
        with:
          ref: release/1.0.0-interslavic
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Finalize Interslavic metadata
        run: python scripts/finalize_interslavic_metadata.py

      - name: Validate metadata and JSON
        run: |
          python scripts/validate.py
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          assert catalog['project']['supported_locale_count'] == 88

          def count_locale(node):
              if isinstance(node, dict):
                  here = 1 if 'isv' in node and isinstance(node['isv'], dict) and node['isv'].get('status') == 'supported' else 0
                  return here + sum(count_locale(v) for v in node.values())
              if isinstance(node, list):
                  return sum(count_locale(v) for v in node)
              return 0

          assert count_locale(catalog) == 11
          neo = next(p for p in catalog['supported_projects'] if p['id'] == 'neoorigins')
          ns = neo['compatibility']['fallback_namespaces']
          assert ns['interslavic_common_glob'] == 'neoorigins_isv_common_*'
          assert ns['interslavic_mc_1_21_1'] == 'neoorigins_isv_121'
          readme = Path('README.md').read_text(encoding='utf-8')
          catalogue = Path('CATALOG.md').read_text(encoding='utf-8')
          assert 'Interslave (`isv`)' in readme
          assert 'Medžuslovjansky (`isv`)' in catalogue
          print('Interslavic metadata audit: locale 88; isv across 11 projects; namespaces OK')
          PY

      - name: Commit validated metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CATALOG.md catalog.json
          if git diff --cached --quiet; then
            echo 'No Interslavic metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Interslavic locale 88 metadata'
          git fetch origin release/1.0.0-interslavic
          git rebase origin/release/1.0.0-interslavic
          git push origin HEAD:release/1.0.0-interslavic
