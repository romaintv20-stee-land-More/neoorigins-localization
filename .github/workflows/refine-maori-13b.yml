name: Refine Māori localization with NLLB 1.3B

on:
  push:
    branches: [release/1.0.0-maori]
    paths:
      - scripts/refine_maori_13b.py
      - .github/workflows/refine-maori-13b.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate-shards:
    name: Translate Māori 1.3B shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/1.0.0-maori
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Māori 1.3B runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers<5' sentencepiece protobuf
      - name: Restrict add-on audits to Māori
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts=['scripts/audit_medievalorigins_upstream.py','scripts/audit_ibarnorigins_upstream.py','scripts/audit_origins_fantasy_upstream.py','scripts/audit_origins_backgrounds_upstream.py','scripts/audit_origins_more_backgrounds_upstream.py','scripts/audit_origins_backgrounds_iss_upstream.py','scripts/audit_origins_furries_upstream.py','scripts/audit_origins_classes_extended_upstream.py','scripts/audit_origins_classes_iss_upstream.py','scripts/audit_origin_architect_upstream.py']
          for filename in scripts:
              path=Path(filename);text=path.read_text(encoding='utf-8')
              updated,count=re.subn(r'^LOCALES\s*=.*$','LOCALES = ("mi_nz",)',text,count=1,flags=re.M)
              if count==0:updated,count=re.subn(r'^DEFAULT_LOCALES\s*=.*$','DEFAULT_LOCALES = ("mi_nz",)',text,count=1,flags=re.M)
              if count!=1:raise SystemExit(f'Could not patch {filename}')
              path.write_text(updated,encoding='utf-8')
          PY
      - name: Discover Māori source coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/mi-discovery-mc-1.21.1 --locale mi_nz
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/mi-discovery-mc-26.1 --locale mi_nz
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/mi-discovery-mc-26.2 --locale mi_nz
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py
      - name: Translate Māori 1.3B shard
        run: python3 scripts/refine_maori_13b.py --shard-index ${{ matrix.shard }} --shard-count 8 --shard-output build/maori-13b-shards/shard-${{ matrix.shard }}.json
      - name: Upload Māori shard
        uses: actions/upload-artifact@v7
        with:
          name: maori-13b-shard-${{ matrix.shard }}-${{ github.sha }}
          path: build/maori-13b-shards/shard-${{ matrix.shard }}.json
          if-no-files-found: error

  refine:
    name: Merge and validate Māori 1.3B refinement
    needs: translate-shards
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/1.0.0-maori
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers<5' sentencepiece protobuf
      - name: Restrict add-on audits to Māori
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts=['scripts/audit_medievalorigins_upstream.py','scripts/audit_ibarnorigins_upstream.py','scripts/audit_origins_fantasy_upstream.py','scripts/audit_origins_backgrounds_upstream.py','scripts/audit_origins_more_backgrounds_upstream.py','scripts/audit_origins_backgrounds_iss_upstream.py','scripts/audit_origins_furries_upstream.py','scripts/audit_origins_classes_extended_upstream.py','scripts/audit_origins_classes_iss_upstream.py','scripts/audit_origin_architect_upstream.py']
          for filename in scripts:
              path=Path(filename);text=path.read_text(encoding='utf-8')
              updated,count=re.subn(r'^LOCALES\s*=.*$','LOCALES = ("mi_nz",)',text,count=1,flags=re.M)
              if count==0:updated,count=re.subn(r'^DEFAULT_LOCALES\s*=.*$','DEFAULT_LOCALES = ("mi_nz",)',text,count=1,flags=re.M)
              if count!=1:raise SystemExit(f'Could not patch {filename}')
              path.write_text(updated,encoding='utf-8')
          PY
      - name: Discover Māori source coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/mi-discovery-mc-1.21.1 --locale mi_nz
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/mi-discovery-mc-26.1 --locale mi_nz
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/mi-discovery-mc-26.2 --locale mi_nz
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py
      - name: Download Māori shards
        uses: actions/download-artifact@v8
        with:
          pattern: maori-13b-shard-*-${{ github.sha }}
          path: build/maori-13b-shards
          merge-multiple: true
      - name: Merge Māori shards
        run: python3 scripts/refine_maori_13b.py --merge-shards build/maori-13b-shards
      - name: Prune add-on overlaps
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune
      - name: Strict Māori NeoOrigins audits
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/mi-audit-mc-1.21.1 --locale mi_nz --fallback-namespace-glob 'neoorigins_mi_common_*' --extra-namespace neoorigins_mi_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/mi-audit-mc-26.1 --locale mi_nz --fallback-namespace-glob 'neoorigins_mi_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/mi-audit-mc-26.2 --locale mi_nz --fallback-namespace-glob 'neoorigins_mi_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders
      - name: Strict Māori add-on audits
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
      - name: Validate localization JSON
        run: python3 scripts/validate.py
      - name: Verify Māori 1.3B structure
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/mi_nz.json'))
          if len(files)!=29:raise SystemExit(f'Expected 29 mi_nz files, found {len(files)}')
          seen={};total=0
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8'));seen.update(d);total+=len(d)
          if seen.get('neoorigins.night_vision.on')==seen.get('neoorigins.night_vision.off'):raise SystemExit('Night vision labels identical')
          if not seen.get('button.neoorigins.random','').strip():raise SystemExit('Random label empty')
          print(f'Māori 1.3B structure passed: 29 files, {total} values')
          PY
      - name: Check whitespace
        run: git diff --check
      - name: Restore audit scripts
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py
      - name: Upload Māori 1.3B reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maori-13b-audits-${{ github.sha }}
          path: |
            build/mi-discovery-*
            build/mi-audit-*
            build/*-upstream-audit
          if-no-files-found: warn
      - name: Commit validated Māori 1.3B refinement
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'mi_nz.json' -print0 | xargs -0 -r git add
          if git diff --cached --quiet;then echo 'No Māori 1.3B changes to commit.';exit 0;fi
          git commit -m 'Refine Māori localization with NLLB 1.3B'
          git fetch origin release/1.0.0-maori
          git rebase origin/release/1.0.0-maori
          git push origin HEAD:release/1.0.0-maori
