name: Finish Korean localization integration

on:
  push:
    branches:
      - release/0.8.0-korean

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update audits, catalog, docs and build workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import copy
          import json
          import re

          expr = '$' + '{{'

          audit_scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in audit_scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              match = re.search(r'LOCALES\s*=\s*\((.*?)\)', text, re.S)
              if not match:
                  raise SystemExit(f'LOCALES assignment not found in {filename}')
              inner = match.group(1)
              if '"ko_kr"' not in inner:
                  if '"ja_jp"' not in inner:
                      raise SystemExit(f'ja_jp not found in LOCALES for {filename}')
                  new_inner = inner.replace('"ja_jp"', '"ja_jp", "ko_kr"', 1)
                  text = text[:match.start(1)] + new_inner + text[match.end(1):]
                  path.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = re.sub(r'(\| (?:21|25) \| )13( \|)', r'\g<1>14\2', text)
          text = text.replace(
              '**Hongrois (`hu_hu`)** et **Japonais (`ja_jp`)**.',
              '**Hongrois (`hu_hu`)**, **Japonais (`ja_jp`)** et **Coréen (`ko_kr`)**.'
          )
          text = text.replace('Les treize langues', 'Les quatorze langues')
          text = text.replace('Couverture CS / HU / JA', 'Couverture CS / HU / JA / KO')
          coverage = {
              'Medieval Origins Revival': '401/401',
              "ibarn's quartet origins addon": '69/69',
              'Origins Fantasy for NeoOrigins': '240/240',
              'Origins: Backgrounds for NeoOrigins': '65/65',
              'Origins: More Backgrounds for NeoOrigins': '44/44',
              'Origins: Backgrounds ISS for NeoOrigins': '79/79',
              'Origins Furries for NeoOrigins': '117/117',
              'Origins: Classes Extended for NeoOrigins': '124/124',
              'Origins: Classes ISS for NeoOrigins': '99/99',
              'Origin Architect': '22/22',
          }
          lines = []
          for line in text.splitlines():
              for project, count in coverage.items():
                  if line.startswith(f'| {project} |') and line.count(' · ') == 2:
                      parts = line.split(' | ')
                      if len(parts) >= 4:
                          parts[2] = parts[2] + f' · {count}'
                          line = ' | '.join(parts)
                      break
              lines.append(line)
          text = '\n'.join(lines) + '\n'
          korean_section = '''Pour le coréen :

- **1.21.1 : 2 296/2 296 clés** couvertes ;
- **26.1.x : 2 307/2 307 clés** couvertes ;
- **26.2 : 2 307/2 307 clés** couvertes.

'''
          if 'Pour le coréen :' not in text:
              text = text.replace("Sur 26.x, trois anciennes clés", korean_section + "Sur 26.x, trois anciennes clés")
          readme.write_text(text, encoding='utf-8')

          catalog_md = Path('CATALOG.md')
          text = catalog_md.read_text(encoding='utf-8')
          text = text.replace('日本語 (`ja_jp`) |', '日本語 (`ja_jp`) · 한국어 (`ko_kr`) |')
          text = text.replace('Les treize langues ciblées sont', 'Les quatorze langues ciblées sont')
          text = text.replace('`hu_hu` et `ja_jp`.', '`hu_hu`, `ja_jp` et `ko_kr`.')
          korean_note = '- NeoOrigins coréen couvre **2 296/2 296** clés en 1.21.1, **2 307/2 307** en 26.1.x et **2 307/2 307** en 26.2.\n'
          if 'NeoOrigins coréen couvre' not in text:
              anchor = '- NeoOrigins hongrois couvre **2 296/2 296** clés en 1.21.1, **2 307/2 307** en 26.1.x et **2 307/2 307** en 26.2. Les trois anciennes clés de récompense absentes des branches 26.x restent sans effet et sont signalées comme obsolètes par l\'audit.\n'
              text = text.replace(anchor, anchor + korean_note)
          catalog_md.write_text(text, encoding='utf-8')

          catalog_path = Path('catalog.json')
          data = json.loads(catalog_path.read_text(encoding='utf-8'))
          data['project']['supported_locale_count'] = 14

          def replace_locale(value):
              if isinstance(value, str):
                  return value.replace('ja_jp', 'ko_kr').replace('日本語', '한국어')
              if isinstance(value, list):
                  return [replace_locale(v) for v in value]
              if isinstance(value, dict):
                  return {k: replace_locale(v) for k, v in value.items()}
              return value

          for project in data['supported_projects']:
              langs = project.get('languages', {})
              if 'ko_kr' not in langs:
                  if 'ja_jp' not in langs:
                      raise SystemExit(f"ja_jp catalog template missing for {project.get('id')}")
                  ko = replace_locale(copy.deepcopy(langs['ja_jp']))
                  ko['name'] = '한국어'
                  if project.get('id') == 'medievalorigins':
                      ko.pop('files_glob', None)
                      ko['file'] = 'src/main/resources/resourcepacks/fallback_localizations/assets/medievalorigins/lang/ko_kr.json'
                  langs['ko_kr'] = ko
              compat = project.get('compatibility', {})
              for key, value in list(compat.items()):
                  if isinstance(value, str):
                      compat[key] = value.replace('treize', 'quatorze')
          catalog_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          build = Path('.github/workflows/build.yml')
          text = build.read_text(encoding='utf-8')
          text = text.replace(
              'branches: [ main, release/0.8.0-japanese ]',
              'branches: [ main, release/0.8.0-japanese, release/0.8.0-korean ]'
          )
          text = re.sub(r"(audit_locales: '[^']*\bja_jp)(')", r"\1 ko_kr\2", text)
          start = text.index('      - name: Verify packaged Japanese localizations\n')
          end = text.index('      - name: Upload JAR\n', start)
          verify = '''      - name: Verify packaged Japanese and Korean localizations
        run: |
          JAR=$(find build/libs -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" > build/jar-contents-__EXPR__ matrix.target }}.txt

          for locale in ja_jp ko_kr; do
            COUNT=$(grep -cE "(^|/)lang/$locale\\.json$" build/jar-contents-__EXPR__ matrix.target }}.txt || true)
            echo "$locale localization files in __EXPR__ matrix.target }}: $COUNT"
            test "$COUNT" -gt 0
          done

          ADDON_PATTERN='(^|/)assets/(medievalorigins|medievalorigins_[^/]*|ibarnorigins|origins_fantasy|origins_backgrounds|origins_backgrounds_two|origins_backgrounds_iss|origins_furries|origins_classes_ex|origins_classes_iss|originsmodernui)/'

          if [ "__EXPR__ matrix.include_addon_translations }}" = "true" ]; then
            grep -Eq '(^|/)assets/medievalorigins_ja_[^/]*/lang/ja_jp\\.json$' build/jar-contents-__EXPR__ matrix.target }}.txt
            grep -Eq '(^|/)assets/medievalorigins/lang/ko_kr\\.json$' build/jar-contents-__EXPR__ matrix.target }}.txt
            for ns in ibarnorigins origins_fantasy origins_backgrounds origins_backgrounds_two origins_backgrounds_iss origins_furries origins_classes_ex origins_classes_iss originsmodernui; do
              grep -Eq "(^|/)assets/$ns/lang/ja_jp.json$" build/jar-contents-__EXPR__ matrix.target }}.txt
              grep -Eq "(^|/)assets/$ns/lang/ko_kr.json$" build/jar-contents-__EXPR__ matrix.target }}.txt
            done
            echo "Japanese and Korean addon packaging verified for __EXPR__ matrix.target }}."
          else
            if grep -Eq "$ADDON_PATTERN" build/jar-contents-__EXPR__ matrix.target }}.txt; then
              echo "Unexpected 1.21.1 addon localization found in __EXPR__ matrix.target }}"
              grep -E "$ADDON_PATTERN" build/jar-contents-__EXPR__ matrix.target }}.txt | head -n 50
              exit 1
            fi
            echo "No 1.21.1 addon namespaces packaged in __EXPR__ matrix.target }}."
          fi

'''.replace('__EXPR__', expr)
          text = text[:start] + verify + text[end:]
          build.write_text(text, encoding='utf-8')

          korean_audit = Path('.github/workflows/audit-korean-bootstrap.yml')
          permanent = '''name: Audit Korean NeoOrigins bootstrap

on:
  push:
    branches:
      - release/0.8.0-korean

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc-1.21.1
            ref: '860ecdb24e723983e93004ea8ceb5de90ccf0d70'
            extra: 'neoorigins_121_batch1'
          - target: mc-26.1.x
            ref: '3c1c7365507679c836d3c14af5d4dd0654652e87'
            extra: 'neoorigins_26_1'
          - target: mc-26.2
            ref: '65864716a5a796fa1c51ec3e8a6d9640abebb4ca'
            extra: 'neoorigins_26_2'
    runs-on: ubuntu-latest
    name: Audit __EXPR__ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit Korean fallback coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py \\
            --ref "__EXPR__ matrix.ref }}" \\
            --output "build/ko-audit-__EXPR__ matrix.target }}" \\
            --locale ko_kr \\
            --extra-namespace neoorigins_226 \\
            --extra-namespace "__EXPR__ matrix.extra }}" \\
            --fail-on-overlap \\
            --fail-on-missing
      - name: Print report
        run: cat "build/ko-audit-__EXPR__ matrix.target }}/report.json"
      - uses: actions/upload-artifact@v4
        with:
          name: korean-audit-__EXPR__ matrix.target }}
          path: build/ko-audit-__EXPR__ matrix.target }}
          if-no-files-found: error
'''.replace('__EXPR__', expr)
          korean_audit.write_text(permanent, encoding='utf-8')

          Path('.github/workflows/finish-korean-integration.yml').unlink()
          PY

      - name: Validate catalog and JSON files
        run: python3 scripts/validate.py

      - name: Commit final Korean integration metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Korean localization integration [korean-finish]"
          git push origin HEAD:release/0.8.0-korean
