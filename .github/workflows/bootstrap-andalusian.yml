name: Bootstrap Andalusian localization

on:
  push:
    branches:
      - release/1.0.0-andalusian
    paths:
      - scripts/bootstrap_andalusian.py
      - .github/workflows/bootstrap-andalusian.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/1.0.0-andalusian

      - name: Restrict add-on audits to Andalusian
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("esan",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("esan",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Andalusian NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/esan-discovery-mc-1.21.1 --locale esan
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/esan-discovery-mc-26.1 --locale esan
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/esan-discovery-mc-26.2 --locale esan

      - name: Discover Andalusian add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Andalusian fallback files from Spanish semantics and Minecraft corpus
        run: python3 scripts/bootstrap_andalusian.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Andalusian NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/esan-audit-mc-1.21.1 --locale esan --fallback-namespace-glob 'neoorigins_esan_common_*' --extra-namespace neoorigins_esan_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/esan-audit-mc-26.1 --locale esan --fallback-namespace-glob 'neoorigins_esan_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/esan-audit-mc-26.2 --locale esan --fallback-namespace-glob 'neoorigins_esan_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Andalusian add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Andalusian text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/esan.json'))
          if len(files) != 29:
              raise SystemExit(f'Expected 29 esan localization files, found {len(files)}')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          chars = len(re.findall(r'[A-Za-zÀ-ÖØ-öø-ÿ]', text))
          markers = len(re.findall(r'(?:\blô\b|\blâ\b|\bpa\b|\bder\b|\bâtta\b|\bçerbid|\bêtt|çç|çión|ôh\b|âh\b)', text, re.I))
          if chars < 70000:
              raise SystemExit(f'Andalusian Latin sanity too low: {chars}')
          if markers < 250:
              raise SystemExit(f'Andalusian dialect sanity too low: {markers}')
          print(f'Andalusian sanity passed: {chars} letters, {markers} dialect markers across {len(files)} files')
          PY

      - name: Add Andalusian target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeAndalusian121Translations' not in text:
              anchor = "def includeBrabantian121Translations = (project.findProperty('include_brabantian_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Brabantian Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeAndalusian121Translations = (project.findProperty('include_andalusian_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)
              anchor = "    inputs.property 'include_brabantian_121_translations', includeBrabantian121Translations\n"
              if anchor not in text:
                  raise SystemExit('Brabantian Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_andalusian_121_translations', includeAndalusian121Translations\n", 1)
              anchor = "    if (!includeBrabantian121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_brb_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Brabantian Gradle exclusion anchor not found')
              text = text.replace(anchor, anchor + "\n    if (!includeAndalusian121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_esan_121/**'\n    }\n", 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Andalusian audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: andalusian-localization-audits-${{ github.sha }}
          path: |
            build/esan-discovery-*
            build/esan-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Andalusian translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'esan.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Andalusian translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Andalusian localization fallback'
          git fetch origin release/1.0.0-andalusian
          git rebase origin/release/1.0.0-andalusian
          git push origin HEAD:release/1.0.0-andalusian
