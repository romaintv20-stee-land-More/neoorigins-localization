name: One-time elf name localization update

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch-elf-names:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Localize Medieval Origins elf names
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path('src/main/resources/resourcepacks/fallback_localizations/assets/medievalorigins/lang')
          replacements = {
              'fr_fr.json': {
                  '"origin.medievalorigins.wood_elf.name": "Wood Elf"': '"origin.medievalorigins.wood_elf.name": "Elfe sylvain"',
                  '"origin.medievalorigins.moon_elf.name": "Moon Elf"': '"origin.medievalorigins.moon_elf.name": "Elfe lunaire"',
              },
              'nl_nl.json': {
                  '"origin.medievalorigins.wood_elf.name": "Wood Elf"': '"origin.medievalorigins.wood_elf.name": "Woudelf"',
                  '"origin.medievalorigins.high_elf.name": "High Elf"': '"origin.medievalorigins.high_elf.name": "Hoge Elf"',
                  '"origin.medievalorigins.moon_elf.name": "Moon Elf"': '"origin.medievalorigins.moon_elf.name": "Maanelf"',
              },
          }

          for filename, changes in replacements.items():
              path = base / filename
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in changes.items():
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {filename}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              if text == original:
                  raise SystemExit(f'No changes made to {filename}')
          PY

      - name: Commit localized names
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/resourcepacks/fallback_localizations/assets/medievalorigins/lang/fr_fr.json \
                  src/main/resources/resourcepacks/fallback_localizations/assets/medievalorigins/lang/nl_nl.json
          git commit -m "Localize Medieval Origins elf names"
          git push
