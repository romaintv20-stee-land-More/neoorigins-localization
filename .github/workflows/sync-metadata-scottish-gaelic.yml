name: Sync Scottish Gaelic 47-locale metadata

on:
  push:
    branches:
      - release/0.9.0-scottish-gaelic
    paths:
      - .github/workflows/sync-metadata-scottish-gaelic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-scottish-gaelic

      - name: Update catalog metadata
        run: |
          python3 scripts/update_catalog_scottish_gaelic.py
          python3 scripts/generate_catalog.py

      - name: Update README metadata
        run: python3 scripts/update_readme_scottish_gaelic.py

      - name: Validate 47-locale metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          if catalog['project']['supported_locale_count'] != 47:
              raise SystemExit('catalog locale count is not 47')
          for project in catalog['supported_projects']:
              for locale in ('ga_ie', 'gd_gb'):
                  if locale not in project['languages']:
                      raise SystemExit(f"{locale} missing from {project['id']}")
          readme = Path('README.md').read_text(encoding='utf-8')
          required = ['Les quarante-sept langues', 'Irlandais (`ga_ie`)', 'Gaélique écossais (`gd_gb`)', 'Pour l’irlandais :', 'Pour le gaélique écossais :', '/ GA / GD']
          missing = [item for item in required if item not in readme]
          if missing:
              raise SystemExit(f'README Scottish Gaelic markers missing: {missing}')
          catalog_md = Path('CATALOG.md').read_text(encoding='utf-8')
          for marker in ('ga_ie', 'gd_gb', 'Gaeilge', 'Gàidhlig'):
              if marker not in catalog_md:
                  raise SystemExit(f'CATALOG.md marker missing: {marker}')
          print('Scottish Gaelic 47-locale metadata validation passed')
          PY

      - name: Commit Scottish Gaelic metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No Scottish Gaelic metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Scottish Gaelic localization in 0.9.0 beta'
          git fetch origin release/0.9.0-scottish-gaelic
          git rebase origin/release/0.9.0-scottish-gaelic
          git push origin HEAD:release/0.9.0-scottish-gaelic
