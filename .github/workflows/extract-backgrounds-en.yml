name: Extract Origins Backgrounds English

on:
  push:
    branches:
      - release/0.8.0-czech
    paths:
      - .github/workflows/extract-backgrounds-en.yml
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract pinned English locale
        run: |
          python3 - <<'PY'
          import io, json, zipfile
          from scripts.audit_origins_backgrounds_upstream import download_jar, detect_namespace, read_locale
          data, source = download_jar('8397335', 'Origins-Backgrounds-1.21.1-NeoOrigins-1.0.2.jar')
          with zipfile.ZipFile(io.BytesIO(data)) as jar:
              ns = detect_namespace(jar, 'origins_backgrounds')
              en = read_locale(jar, ns, 'en_us')
              cs = read_locale(jar, ns, 'cs_cz')
          print('SOURCE=' + source)
          print('NAMESPACE=' + ns)
          print('ENGLISH_KEYS=' + str(len(en)))
          print('OFFICIAL_CS_KEYS=' + str(len(cs)))
          print('---BEGIN_EN_US---')
          print(json.dumps(en, ensure_ascii=False, indent=2))
          print('---END_EN_US---')
          PY
