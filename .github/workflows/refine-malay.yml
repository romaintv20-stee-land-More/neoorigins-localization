name: Refine Malay localization

on:
  push:
    branches:
      - release/0.9.0-malay
    paths:
      - scripts/refine_malay.py
      - .github/workflows/refine-malay.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-malay

      - name: Apply contextual Malay fixes
        run: python3 scripts/refine_malay.py

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Check Malay placeholders against NeoOrigins upstream
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref 860ecdb24e723983e93004ea8ceb5de90ccf0d70 --output build/ms-refine-audit-121 --locale ms_my --fallback-namespace-glob 'neoorigins_ms_common_*' --extra-namespace neoorigins_ms_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 3c1c7365507679c836d3c14af5d4dd0654652e87 --output build/ms-refine-audit-261 --locale ms_my --fallback-namespace-glob 'neoorigins_ms_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 65864716a5a796fa1c51ec3e8a6d9640abebb4ca --output build/ms-refine-audit-262 --locale ms_my --fallback-namespace-glob 'neoorigins_ms_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Sanity-check corrected Malay terminology
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/ms_my.json'))
          text = '\n'.join(str(v) for p in files for v in json.loads(p.read_text(encoding='utf-8')).values())
          lower = text.lower()
          markers = len(re.findall(r'\b(?:yang|untuk|anda|tidak|dengan|boleh|akan|pemain|kuasa|kerosakan|kelajuan|kesihatan|tetapan|pelayan|pek|dayakan|entiti|asal)\b', lower))
          bad = [
              'Asal kau tak boleh urat aku.', 'Jimat', 'Mohon', 'Peraturan Telur',
              '"Penimbang"', 'Berturap', 'Asal awak tak ada night vision.',
          ]
          remaining = [item for item in bad if item in text]
          if remaining:
              raise SystemExit(f'Known Malay false-friends remain: {remaining}')
          if markers < 200:
              raise SystemExit(f'Malay lexical sanity check too low: {markers}')
          print(f'Malay refinement sanity passed: {markers} Malay markers across {len(files)} files')
          PY

      - name: Commit refined Malay translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'ms_my.json' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo 'No Malay refinement changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Malay Minecraft terminology'
          git fetch origin release/0.9.0-malay
          git rebase origin/release/0.9.0-malay
          git push origin HEAD:release/0.9.0-malay
