name: Prepare Japanese Medieval missing keys

on:
  push:
    branches:
      - release/0.8.0-japanese
    paths:
      - scripts/prepare_japanese_medieval_missing.py
      - .github/workflows/prepare-japanese-medieval-missing.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-japanese
      - name: Build missing English set
        run: python3 scripts/prepare_japanese_medieval_missing.py
      - name: Commit missing set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_medieval_ja_missing_en.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Generate temporary Japanese Medieval missing set"
            git push origin HEAD:release/0.8.0-japanese
          fi
