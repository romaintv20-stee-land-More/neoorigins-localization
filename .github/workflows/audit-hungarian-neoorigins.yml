name: Audit Hungarian NeoOrigins

on:
  push:
    branches:
      - release/0.8.0-hungarian
    paths:
      - .github/workflows/audit-hungarian-neoorigins.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc-1.21.1
            ref: 860ecdb24e723983e93004ea8ceb5de90ccf0d70
            extra: neoorigins_226
          - target: mc-26.1.x
            ref: 3c1c7365507679c836d3c14af5d4dd0654652e87
            extra: neoorigins_26_1
          - target: mc-26.2
            ref: 65864716a5a796fa1c51ec3e8a6d9640abebb4ca
            extra: neoorigins_26_2
    steps:
      - uses: actions/checkout@v4
      - name: Audit Hungarian coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py \
            --ref '${{ matrix.ref }}' \
            --locale hu_hu \
            --fallback-namespace-glob 'neoorigins_hu_*' \
            --extra-namespace neoorigins_226 \
            --extra-namespace '${{ matrix.extra }}' \
            --output 'build/hungarian-audit/${{ matrix.target }}'
      - name: Show report
        run: |
          cat 'build/hungarian-audit/${{ matrix.target }}/report.json'
          echo '--- untranslated ---'
          cat 'build/hungarian-audit/${{ matrix.target }}/hu_hu_untranslated_keys.json'
          echo '--- stale ---'
          cat 'build/hungarian-audit/${{ matrix.target }}/hu_hu_stale_keys.json'
      - uses: actions/upload-artifact@v4
        with:
          name: hungarian-neoorigins-audit-${{ matrix.target }}
          path: build/hungarian-audit/${{ matrix.target }}/
