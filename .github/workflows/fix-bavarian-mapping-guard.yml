name: Fix Bavarian mapping guard placement

on:
  push:
    branches:
      - release/1.0.0-bavarian
    paths:
      - '.github/workflows/fix-bavarian-mapping-guard.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/1.0.0-bavarian
      - name: Move destructive-map guard before manual overrides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/bootstrap_bavarian.py')
          text = path.read_text(encoding='utf-8')
          old = '''    # Explicit Minecraft-observed forms win over the statistical dictionary.\n    learned.update(MANUAL_WORDS)\n    destructive = {s: t for s, t in learned.items() if len(s) >= 5 and len(t) <= 2}\n    if destructive:\n        raise RuntimeError(f"Destructive learned Bavarian mappings detected: {destructive}")\n'''
          new = '''    destructive = {s: t for s, t in learned.items() if len(s) >= 5 and len(t) <= 2}\n    if destructive:\n        raise RuntimeError(f"Destructive learned Bavarian mappings detected: {destructive}")\n\n    # Explicit Minecraft-observed/manual forms win over the statistical dictionary.\n    learned.update(MANUAL_WORDS)\n'''
          if old not in text:
              raise SystemExit('Guard placement block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile scripts/bootstrap_bavarian.py
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/bootstrap_bavarian.py
          git commit -m 'Fix Bavarian mapping guard placement'
          git push origin HEAD:release/1.0.0-bavarian
      - name: Dispatch Bavarian bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/bootstrap-bavarian.yml/dispatches \
            -d '{"ref":"release/1.0.0-bavarian"}'
