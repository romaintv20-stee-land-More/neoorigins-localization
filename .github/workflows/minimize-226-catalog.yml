name: Minimize NeoOrigins 2.2.26 catalog diff

on:
  push:
    branches:
      - release/0.8.0-neoorigins-2.2.26
    paths:
      - .github/workflows/minimize-226-catalog.yml

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/0.8.0-neoorigins-2.2.26
          fetch-depth: 0
      - name: Restore main catalog
        run: git checkout origin/main -- catalog.json
      - name: Update NeoOrigins compatibility block
        run: python3 .github/scripts/minimize_226_catalog.py
      - name: Commit minimized catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Minimize NeoOrigins 2.2.26 catalog update"
          git push origin HEAD:release/0.8.0-neoorigins-2.2.26
