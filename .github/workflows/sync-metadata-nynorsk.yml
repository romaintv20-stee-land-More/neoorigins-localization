name: Sync Nynorsk 0.9.0 metadata

on:
  push:
    branches:
      - release/0.9.0-nynorsk
    paths:
      - .github/workflows/sync-metadata-nynorsk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-nynorsk

      - name: Update catalog metadata
        run: |
          python3 scripts/update_catalog_nynorsk.py
          python3 scripts/generate_catalog.py

      - name: Update README metadata
        run: python3 scripts/update_readme_nynorsk.py

      - name: Validate Nynorsk metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          if catalog['project']['supported_locale_count'] != 40:
              raise SystemExit('catalog locale count is not 40')
          for project in catalog['supported_projects']:
              if 'nn_no' not in project['languages']:
                  raise SystemExit(f"nn_no missing from {project['id']}")
          readme = Path('README.md').read_text(encoding='utf-8')
          required = ['Les quarante langues', 'Norvégien nynorsk (`nn_no`)', 'Pour le norvégien nynorsk :', '2 296/2 296', '2 307/2 307', '/ HI / NN']
          missing = [item for item in required if item not in readme]
          if missing:
              raise SystemExit(f'README Nynorsk markers missing: {missing}')
          catalog_md = Path('CATALOG.md').read_text(encoding='utf-8')
          if 'nn_no' not in catalog_md or 'Norsk nynorsk' not in catalog_md:
              raise SystemExit('CATALOG.md Nynorsk markers missing')
          print('Nynorsk metadata validation passed: 40 locales')
          PY

      - name: Commit Nynorsk metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No Nynorsk metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Nynorsk localization in 0.9.0 beta'
          git fetch origin release/0.9.0-nynorsk
          git rebase origin/release/0.9.0-nynorsk
          git push origin HEAD:release/0.9.0-nynorsk
