name: Finalize 1.0.0 locale 81 metadata

on:
  push:
    branches:
      - release/1.0.0-andalusian
    paths:
      - scripts/finalize_locale_81_metadata.py
      - .github/workflows/finalize-1.0.0-locale-81.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/1.0.0-andalusian

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Finalize Andalusian metadata
        run: python3 scripts/finalize_locale_81_metadata.py

      - name: Validate localization JSON
        run: python3 scripts/validate.py

      - name: Verify metadata state
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          assert catalog['project']['supported_locale_count'] == 81

          projects = [p for p in catalog['supported_projects'] if p.get('languages') is not None]
          assert len(projects) == 11
          for project in projects:
              assert 'esan' in project['languages'], project.get('id')
              assert project['languages']['esan']['name'] == 'Andalûh', project.get('id')

          neoorigins = next(p for p in projects if p.get('id') == 'neoorigins')
          fallbacks = neoorigins['compatibility']['fallback_namespaces']
          assert fallbacks['andalusian_common_glob'] == 'neoorigins_esan_common_*'
          assert fallbacks['andalusian_mc_1_21_1'] == 'neoorigins_esan_121'

          readme = Path('README.md').read_text(encoding='utf-8')
          catalog_md = Path('CATALOG.md').read_text(encoding='utf-8')
          assert readme.count('Andalou (`esan`)') == 1
          assert readme.count("Pour l'andalou :") == 1
          assert catalog_md.count('Andalûh (`esan`)') == 11
          print('Metadata state verified for locale 81 (Andalusian / esan).')
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Commit finalized metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json README.md CATALOG.md scripts/finalize_locale_81_metadata.py
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Andalusian locale 81 metadata'
          git fetch origin release/1.0.0-andalusian
          git rebase origin/release/1.0.0-andalusian
          git push origin HEAD:release/1.0.0-andalusian
