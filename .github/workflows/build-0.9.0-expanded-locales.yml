name: Build 0.9.0 Expanded Locales

on:
  push:
    branches: [ release/0.9.0-beta ]
    paths:
      - 'src/main/resources/resourcepacks/fallback_localizations/assets/**/ro_ro.json'
      - 'src/main/resources/resourcepacks/fallback_localizations/assets/**/el_gr.json'
      - 'build.gradle'
      - 'scripts/audit_*_upstream.py'
      - '.github/workflows/build-0.9.0-expanded-locales.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Expanded locales ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc-1.21.1
            minecraft: '1.21.1'
            minecraft_range: '[1.21.1]'
            java: '21'
            gradle: '8.14.3'
            neoforge: '21.1.248'
            loader_range: '[1,)'
            parchment: 'true'
            pack_format: '34'
            source_variant: 'mc1_21_1'
            upstream_ref: '860ecdb24e723983e93004ea8ceb5de90ccf0d70'
            version_extra_namespace: '121'
            include_addons: true
            include_121_batch: true
            include_ro_121: true
            include_el_121: true
            include_26_1: false
            include_26_2: false
            expected_ro: '26'
            expected_el: '27'
          - target: mc-26.1.x
            minecraft: '26.1.2'
            minecraft_range: '[26.1,26.2)'
            java: '25'
            gradle: '9.4.1'
            neoforge: '26.1.2.29-beta'
            loader_range: '[4,)'
            parchment: 'false'
            pack_format: '84'
            source_variant: 'mc26_1'
            upstream_ref: '3c1c7365507679c836d3c14af5d4dd0654652e87'
            version_extra_namespace: '26_1'
            include_addons: false
            include_121_batch: true
            include_ro_121: false
            include_el_121: false
            include_26_1: true
            include_26_2: false
            expected_ro: '17'
            expected_el: '17'
          - target: mc-26.2
            minecraft: '26.2'
            minecraft_range: '[26.2,26.3)'
            java: '25'
            gradle: '9.4.1'
            neoforge: '26.2.0.3-beta'
            loader_range: '[4,)'
            parchment: 'false'
            pack_format: '84'
            source_variant: 'mc26_1'
            upstream_ref: '65864716a5a796fa1c51ec3e8a6d9640abebb4ca'
            version_extra_namespace: '26_2'
            include_addons: false
            include_121_batch: false
            include_ro_121: false
            include_el_121: false
            include_26_1: false
            include_26_2: true
            expected_ro: '17'
            expected_el: '17'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle ${{ matrix.gradle }}
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Strict audit Romanian and Greek NeoOrigins
        run: |
          if [ '${{ matrix.target }}' = 'mc-1.21.1' ]; then
            RO_EXTRA=neoorigins_ro_121
            EL_EXTRA=neoorigins_el_121
          elif [ '${{ matrix.target }}' = 'mc-26.1.x' ]; then
            RO_EXTRA=neoorigins_26_1
            EL_EXTRA=neoorigins_26_1
          else
            RO_EXTRA=neoorigins_26_2
            EL_EXTRA=neoorigins_26_2
          fi
          python3 scripts/audit_neoorigins_upstream.py --ref '${{ matrix.upstream_ref }}' --output 'build/ro-${{ matrix.target }}' --locale ro_ro --fallback-namespace-glob 'neoorigins_ro_common_*' --extra-namespace "$RO_EXTRA" --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref '${{ matrix.upstream_ref }}' --output 'build/el-${{ matrix.target }}' --locale el_gr --fallback-namespace-glob 'neoorigins_el_common_*' --extra-namespace "$EL_EXTRA" --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Romanian and Greek add-ons
        if: matrix.include_addons == true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          scripts = [
              ('scripts/audit_medievalorigins_upstream.py', ['--ref','1.21.1-fabric']),
              ('scripts/audit_ibarnorigins_upstream.py', ['--ref','multiloader-1.21.1-new-pack-format']),
              ('scripts/audit_origins_fantasy_upstream.py', []),
              ('scripts/audit_origins_backgrounds_upstream.py', []),
              ('scripts/audit_origins_more_backgrounds_upstream.py', []),
              ('scripts/audit_origins_backgrounds_iss_upstream.py', []),
              ('scripts/audit_origins_furries_upstream.py', []),
              ('scripts/audit_origins_classes_extended_upstream.py', []),
              ('scripts/audit_origins_classes_iss_upstream.py', []),
              ('scripts/audit_origin_architect_upstream.py', []),
          ]
          originals = {name: Path(name).read_text(encoding='utf-8') for name, _ in scripts}
          for locale in ('ro_ro', 'el_gr'):
              for name, extra in scripts:
                  path = Path(name)
                  source = originals[name]
                  updated, count = re.subn(r'^LOCALES\s*=.*$', f'LOCALES = ("{locale}",)', source, count=1, flags=re.M)
                  if count == 0:
                      updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', f'DEFAULT_LOCALES = ("{locale}",)', source, count=1, flags=re.M)
                  if count != 1:
                      raise SystemExit(f'Could not patch locale in {name}')
                  path.write_text(updated, encoding='utf-8')
                  subprocess.run(['python3', name, *extra, '--fail-on-overlap', '--fail-on-missing', '--fail-on-placeholders'], check=True)
          for name, source in originals.items():
              Path(name).write_text(source, encoding='utf-8')
          PY

      - name: Validate localization files
        run: python3 scripts/validate.py

      - name: Build mod
        run: |
          gradle build --stacktrace \
            "-Pjava_version=${{ matrix.java }}" \
            "-Puse_parchment=${{ matrix.parchment }}" \
            "-Presource_pack_format=${{ matrix.pack_format }}" \
            "-Psource_variant=${{ matrix.source_variant }}" \
            "-Pinclude_addon_translations=${{ matrix.include_addons }}" \
            "-Pinclude_121_batch_translations=${{ matrix.include_121_batch }}" \
            "-Pinclude_turkish_split_translations=true" \
            "-Pinclude_indonesian_121_translations=${{ matrix.include_addons }}" \
            "-Pinclude_swedish_121_translations=${{ matrix.include_addons }}" \
            "-Pinclude_danish_121_translations=${{ matrix.include_addons }}" \
            "-Pinclude_finnish_121_translations=${{ matrix.include_addons }}" \
            "-Pinclude_norwegian_121_translations=${{ matrix.include_addons }}" \
            "-Pinclude_romanian_121_translations=${{ matrix.include_ro_121 }}" \
            "-Pinclude_greek_121_translations=${{ matrix.include_el_121 }}" \
            "-Pinclude_26_1_translations=${{ matrix.include_26_1 }}" \
            "-Pinclude_26_2_translations=${{ matrix.include_26_2 }}" \
            "-Pminecraft_version=${{ matrix.minecraft }}" \
            "-Pminecraft_version_range=${{ matrix.minecraft_range }}" \
            "-Pneo_version=${{ matrix.neoforge }}" \
            "-Ploader_version_range=${{ matrix.loader_range }}" \
            "-Pmod_version=0.9.0-beta+expanded-${{ matrix.target }}"

      - name: Verify Romanian and Greek packaging
        run: |
          JAR=$(find build/libs -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" > build/jar-expanded.txt
          RO=$(grep -cE '(^|/)lang/ro_ro\.json$' build/jar-expanded.txt || true)
          EL=$(grep -cE '(^|/)lang/el_gr\.json$' build/jar-expanded.txt || true)
          echo "Romanian: $RO / ${{ matrix.expected_ro }}"
          echo "Greek: $EL / ${{ matrix.expected_el }}"
          test "$RO" -eq '${{ matrix.expected_ro }}'
          test "$EL" -eq '${{ matrix.expected_el }}'
          for index in $(seq -w 1 16); do
            grep -Eq "(^|/)assets/neoorigins_ro_common_${index}/lang/ro_ro\.json$" build/jar-expanded.txt
            grep -Eq "(^|/)assets/neoorigins_el_common_${index}/lang/el_gr\.json$" build/jar-expanded.txt
          done
          ADDON_PATTERN='(^|/)assets/(medievalorigins|medievalorigins_[^/]*|ibarnorigins|origins_fantasy|origins_backgrounds|origins_backgrounds_two|origins_backgrounds_iss|origins_furries|origins_classes_ex|origins_classes_iss|originsmodernui)/'
          if [ '${{ matrix.include_addons }}' = 'true' ]; then
            grep -Eq 'assets/neoorigins_ro_121/lang/ro_ro\.json$' build/jar-expanded.txt
            grep -Eq 'assets/neoorigins_el_121/lang/el_gr\.json$' build/jar-expanded.txt
            ! grep -Eq 'assets/originsmodernui/lang/ro_ro\.json$' build/jar-expanded.txt
            grep -Eq 'assets/originsmodernui/lang/el_gr\.json$' build/jar-expanded.txt
          else
            ! grep -Eq "$ADDON_PATTERN" build/jar-expanded.txt
            ! grep -Eq 'assets/neoorigins_ro_121/lang/ro_ro\.json$' build/jar-expanded.txt
            ! grep -Eq 'assets/neoorigins_el_121/lang/el_gr\.json$' build/jar-expanded.txt
            grep -Eq "assets/neoorigins_${{ matrix.version_extra_namespace }}/lang/ro_ro\.json$" build/jar-expanded.txt
            grep -Eq "assets/neoorigins_${{ matrix.version_extra_namespace }}/lang/el_gr\.json$" build/jar-expanded.txt
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: neoorigins-localization-expanded-${{ matrix.target }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
