name: Assemble final Ukrainian translations

on:
  push:
    branches: [ release/0.8.0-ukrainian ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-ukrainian
      - name: Assemble and validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/main/resources/resourcepacks/fallback_localizations/assets/origins_fantasy/lang
          mkdir -p src/main/resources/resourcepacks/fallback_localizations/assets/medievalorigins/lang
          cat tmp/ukrainian/origins_fantasy.part*.b64 | base64 -d | gzip -dc > src/main/resources/resourcepacks/fallback_localizations/assets/origins_fantasy/lang/uk_ua.json
          cat tmp/ukrainian/medieval.part*.b64 | base64 -d | gzip -dc > src/main/resources/resourcepacks/fallback_localizations/assets/medievalorigins/lang/uk_ua.json
          python3 - <<'PY'
          import json
          checks = {
              'src/main/resources/resourcepacks/fallback_localizations/assets/origins_fantasy/lang/uk_ua.json': 240,
              'src/main/resources/resourcepacks/fallback_localizations/assets/medievalorigins/lang/uk_ua.json': 401,
          }
          for path, expected in checks.items():
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              assert len(data) == expected, (path, len(data), expected)
              print(path, len(data))
          PY
      - name: Commit translations
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/resources/resourcepacks/fallback_localizations/assets/origins_fantasy/lang/uk_ua.json src/main/resources/resourcepacks/fallback_localizations/assets/medievalorigins/lang/uk_ua.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: add final Ukrainian addon translations'
          git push origin HEAD:release/0.8.0-ukrainian
