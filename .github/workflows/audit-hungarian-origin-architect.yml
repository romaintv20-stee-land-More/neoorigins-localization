name: Audit Hungarian Origin Architect

on:
  push:
    branches:
      - release/0.8.0-hungarian
    paths:
      - .github/workflows/audit-hungarian-origin-architect.yml
      - scripts/audit_origin_architect_upstream.py
      - src/main/resources/resourcepacks/fallback_localizations/assets/originsmodernui/lang/hu_hu.json

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-hungarian
      - name: Audit Origin Architect Hungarian
        run: |
          python3 scripts/audit_origin_architect_upstream.py \
            --fail-on-overlap \
            --fail-on-missing \
            --fail-on-placeholders
