name: Finalize Ido locale metadata

on:
  push:
    branches:
      - release/1.0.0-ido
    paths:
      - scripts/finalize_ido_metadata.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/1.0.0-ido
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Finalize Ido metadata
        run: python scripts/finalize_ido_metadata.py

      - name: Validate JSON
        run: python scripts/validate.py

      - name: Assert metadata state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          assert catalog['project']['supported_locale_count'] == 87

          def count_ido(node):
              if isinstance(node, dict):
                  return (1 if 'io_en' in node and isinstance(node['io_en'], dict) and node['io_en'].get('status') == 'supported' else 0) + sum(count_ido(v) for v in node.values())
              if isinstance(node, list):
                  return sum(count_ido(v) for v in node)
              return 0

          count = count_ido(catalog)
          assert count == 11, f'Expected 11 Ido project locale entries, found {count}'
          neo = next(p for p in catalog['supported_projects'] if p['id'] == 'neoorigins')
          ns = neo['compatibility']['fallback_namespaces']
          assert ns['ido_common_glob'] == 'neoorigins_io_common_*'
          assert ns['ido_mc_1_21_1'] == 'neoorigins_io_121'
          readme = Path('README.md').read_text(encoding='utf-8')
          catalogue = Path('CATALOG.md').read_text(encoding='utf-8')
          assert 'Ido (`io_en`)' in readme
          assert 'Ido (`io_en`)' in catalogue
          print('Ido metadata audit: 87 locales; io_en across 11 projects; namespaces OK')
          PY

      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CATALOG.md catalog.json
          if git diff --cached --quiet; then
            echo "No metadata changes to commit"
          else
            git commit -m "Finalize Ido locale 87 metadata"
            git fetch origin release/1.0.0-ido
            git rebase origin/release/1.0.0-ido
            git push origin HEAD:release/1.0.0-ido
          fi
