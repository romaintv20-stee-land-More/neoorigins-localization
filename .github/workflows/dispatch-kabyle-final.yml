name: Dispatch final Kabyle refinement

on:
  push:
    branches:
      - release/1.0.0-kabyle
    paths:
      - .github/workflows/dispatch-kabyle-final.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch specialized Kabyle workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/refine-kabyle-13b.yml/dispatches \
            -d '{"ref":"release/1.0.0-kabyle"}'
