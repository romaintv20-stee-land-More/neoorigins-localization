name: Sync 0.9.0 Finnish metadata

on:
  push:
    branches:
      - release/0.9.0-beta
    paths:
      - 'src/main/resources/resourcepacks/fallback_localizations/assets/**/fi_fi.json'
      - '.github/workflows/sync-0.9.0-finnish-metadata.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-beta

      - name: Update catalog and README
        run: |
          python3 scripts/update_catalog_finnish.py
          python3 scripts/generate_catalog.py
          python3 scripts/update_readme_finnish.py

      - name: Validate metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          if catalog['project']['supported_locale_count'] != 19:
              raise SystemExit('catalog locale count is not 19')
          neo = next(p for p in catalog['supported_projects'] if p['id'] == 'neoorigins')
          if neo['languages'].get('fi_fi', {}).get('status') != 'supported':
              raise SystemExit('fi_fi is not marked supported for NeoOrigins')
          for project in catalog['supported_projects']:
              if project['languages'].get('fi_fi', {}).get('status') != 'supported':
                  raise SystemExit(f"fi_fi missing from catalog project {project['id']}")
          readme = Path('README.md').read_text(encoding='utf-8')
          if 'Finnois (`fi_fi`)' not in readme or 'Les dix-neuf langues' not in readme:
              raise SystemExit('README Finnish metadata missing')
          print('Finnish metadata validation passed')
          PY

      - name: Commit synchronized metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Finnish localization in 0.9.0 beta'
          git push origin HEAD:release/0.9.0-beta
