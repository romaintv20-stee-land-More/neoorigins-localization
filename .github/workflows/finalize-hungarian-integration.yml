name: Finalize Hungarian integration

on:
  push:
    branches:
      - release/0.8.0-hungarian
    paths:
      - scripts/finalize_hungarian_integration.py
      - .github/workflows/finalize-hungarian-integration.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-hungarian
      - name: Update project structure for Hungarian
        run: python3 scripts/finalize_hungarian_integration.py
      - name: Validate catalog and localization JSON
        run: python3 scripts/validate.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build.yml README.md CATALOG.md catalog.json
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
          else
            git commit -m "Integrate Hungarian as twelfth locale"
            git push origin HEAD:release/0.8.0-hungarian
          fi
