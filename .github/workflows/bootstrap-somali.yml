name: Bootstrap Somali localization

on:
  push:
    branches:
      - release/0.9.0-somali
    paths:
      - scripts/bootstrap_somali.py
      - .github/workflows/bootstrap-somali.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-somali

      - name: Restrict add-on audits to Somali
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("so_so",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("so_so",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Somali NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/so-discovery-mc-1.21.1 --locale so_so
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/so-discovery-mc-26.1 --locale so_so
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/so-discovery-mc-26.2 --locale so_so

      - name: Discover Somali add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Somali fallback files
        run: python3 scripts/bootstrap_somali.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Somali NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/so-audit-mc-1.21.1 --locale so_so --fallback-namespace-glob 'neoorigins_so_common_*' --extra-namespace neoorigins_so_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/so-audit-mc-26.1 --locale so_so --fallback-namespace-glob 'neoorigins_so_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/so-audit-mc-26.2 --locale so_so --fallback-namespace-glob 'neoorigins_so_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Somali add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Somali text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/so_so.json'))
          if not files:
              raise SystemExit('No so_so localization files found')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          low = text.lower().replace('’', "'").replace('‘', "'")
          markers = len(re.findall(r'\b(?:iyo|waxaa|waxa|waa|ku|ka|in|oo|ah|ama|haddii|marka|aad|wuxuu|waxay|lagu|karo|si|u|ayaa|leh|aan|qof|ciyaar|isticmaal|awood|degdeg)\b', low))
          somali_shapes = len(re.findall(r'(?:dh|kh|sh|x|q|c)', low))
          latin = len(re.findall(r'[A-Za-zÀ-ž]', text))
          if markers < 1200:
              raise SystemExit(f'Somali lexical sanity check too low: {markers}')
          if somali_shapes < 1800:
              raise SystemExit(f'Somali orthographic sanity too low: {somali_shapes}')
          if latin < 25000:
              raise SystemExit(f'Somali Latin sanity too low: {latin}')
          print(f'Somali text sanity passed: {markers} lexical markers, {somali_shapes} Somali orthographic markers, {latin} Latin chars across {len(files)} files')
          PY

      - name: Add Somali target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeSomali121Translations' not in text:
              anchor = "def includeLuxembourgish121Translations = (project.findProperty('include_luxembourgish_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Luxembourgish Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeSomali121Translations = (project.findProperty('include_somali_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)
              anchor = "    inputs.property 'include_luxembourgish_121_translations', includeLuxembourgish121Translations\n"
              if anchor not in text:
                  raise SystemExit('Luxembourgish Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_somali_121_translations', includeSomali121Translations\n", 1)
              anchor = "    if (!includeLuxembourgish121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_lb_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Luxembourgish Gradle exclusion anchor not found')
              block = anchor + "\n    if (!includeSomali121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_so_121/**'\n    }\n"
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Somali audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somali-localization-audits-${{ github.sha }}
          path: |
            build/so-discovery-*
            build/so-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Somali translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'so_so.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Somali translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Somali localization fallback'
          git fetch origin release/0.9.0-somali
          git rebase origin/release/0.9.0-somali
          git push origin HEAD:release/0.9.0-somali
