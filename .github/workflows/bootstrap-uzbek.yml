name: Bootstrap Uzbek localization

on:
  push:
    branches:
      - release/0.9.0-uzbek
    paths:
      - scripts/bootstrap_uzbek.py
      - .github/workflows/bootstrap-uzbek.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-uzbek

      - name: Restrict add-on audits to Uzbek
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("uz_uz",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("uz_uz",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Uzbek NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/uz-discovery-mc-1.21.1 --locale uz_uz
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/uz-discovery-mc-26.1 --locale uz_uz
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/uz-discovery-mc-26.2 --locale uz_uz

      - name: Discover Uzbek add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Uzbek fallback files
        run: python3 scripts/bootstrap_uzbek.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Uzbek NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/uz-audit-mc-1.21.1 --locale uz_uz --fallback-namespace-glob 'neoorigins_uz_common_*' --extra-namespace neoorigins_uz_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/uz-audit-mc-26.1 --locale uz_uz --fallback-namespace-glob 'neoorigins_uz_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/uz-audit-mc-26.2 --locale uz_uz --fallback-namespace-glob 'neoorigins_uz_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Uzbek add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Uzbek text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/uz_uz.json'))
          if not files:
              raise SystemExit('No uz_uz localization files found')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          low = text.lower().replace('’', "'").replace('‘', "'")
          markers = len(re.findall(r"(?:uchun|bilan|siz|bo'l|qil|kerak|mumkin|yoki|emas|agar|o'z|kuch|tez|sog'liq|zarar|daraja|oladi|beradi|qachon|faqat)", low))
          latin = len(re.findall(r'[A-Za-zÀ-žʻʼ’‘]', text))
          identical = sum(1 for v in values if re.fullmatch(r'[A-Za-z0-9 _.,:;!?+\-()/\[\]{}%§\'\"]+', v or '') and len(v) > 18)
          if markers < 900:
              raise SystemExit(f'Uzbek lexical sanity check too low: {markers}')
          if latin < 25000:
              raise SystemExit(f'Uzbek Latin sanity too low: {latin}')
          print(f'Uzbek text sanity passed: {markers} lexical markers, {latin} Latin chars across {len(files)} files; long ASCII-only values={identical}')
          PY

      - name: Add Uzbek target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeUzbek121Translations' not in text:
              anchor = "def includeChuvash121Translations = (project.findProperty('include_chuvash_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Chuvash Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeUzbek121Translations = (project.findProperty('include_uzbek_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)
              anchor = "    inputs.property 'include_chuvash_121_translations', includeChuvash121Translations\n"
              if anchor not in text:
                  raise SystemExit('Chuvash Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_uzbek_121_translations', includeUzbek121Translations\n", 1)
              anchor = "    if (!includeChuvash121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_cv_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Chuvash Gradle exclusion anchor not found')
              block = anchor + "\n    if (!includeUzbek121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_uz_121/**'\n    }\n"
              text = text.replace(anchor, block, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Uzbek audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uzbek-localization-audits-${{ github.sha }}
          path: |
            build/uz-discovery-*
            build/uz-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Uzbek translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'uz_uz.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Uzbek translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Uzbek localization fallback'
          git fetch origin release/0.9.0-uzbek
          git rebase origin/release/0.9.0-uzbek
          git push origin HEAD:release/0.9.0-uzbek
