name: Sync Kannada 57-locale handoff

on:
  push:
    branches:
      - release/0.9.0-kannada
    paths:
      - .github/workflows/sync-handoff-kannada.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-kannada

      - name: Update handoff
        run: python3 scripts/update_handoff_kannada.py

      - name: Validate handoff state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('PROJECT_HANDOFF.txt').read_text(encoding='utf-8')
          required=[
              '0.9.0 development currently has 57 locales:',
              '- 57: Kannada / kn_in',
              'FIFTY-SEVEN IS NOT THE FINAL TARGET.',
              'Kannada locale: kn_in / ಕನ್ನಡ.',
              'workflow run 34375980559: SUCCESS',
              'final workflow run 34377027911: SUCCESS',
              'synchronization run 34377471271: SUCCESS',
              'run ID 34377605054: SUCCESS on all three jobs',
              'artifact ID 10114557230',
              'artifact ID 10114582771',
              'artifact ID 10114546850',
              'NEXT LANGUAGE = language 58.',
              'Do not stop permanently at 58;',
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit(f'Handoff markers missing: {missing}')
          print('Kannada handoff validation passed: 57 locales, next 58')
          PY

      - name: Commit handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.txt
          if git diff --cached --quiet; then
            echo 'No Kannada handoff changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Kannada 0.9.0 handoff'
          git fetch origin release/0.9.0-kannada
          git rebase origin/release/0.9.0-kannada
          git push origin HEAD:release/0.9.0-kannada
