name: Sync Welsh 45-locale metadata

on:
  push:
    branches:
      - release/0.9.0-welsh
    paths:
      - .github/workflows/sync-metadata-welsh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-welsh

      - name: Update catalog metadata
        run: |
          python3 scripts/update_catalog_welsh.py
          python3 scripts/generate_catalog.py

      - name: Update README metadata
        run: python3 scripts/update_readme_welsh.py

      - name: Validate 45-locale metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog=json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          if catalog['project']['supported_locale_count'] != 45:
              raise SystemExit('catalog locale count is not 45')
          for project in catalog['supported_projects']:
              for locale in ('ms_my','fil_ph','cy_gb'):
                  if locale not in project['languages']:
                      raise SystemExit(f"{locale} missing from {project['id']}")
          readme=Path('README.md').read_text(encoding='utf-8')
          required=['Les quarante-cinq langues','Filipino (`fil_ph`)','Gallois (`cy_gb`)','Pour le gallois :','/ FIL / CY']
          missing=[x for x in required if x not in readme]
          if missing: raise SystemExit(f'README markers missing: {missing}')
          md=Path('CATALOG.md').read_text(encoding='utf-8')
          for marker in ('cy_gb','Cymraeg','fil_ph','ms_my'):
              if marker not in md: raise SystemExit(f'CATALOG.md marker missing: {marker}')
          print('Welsh metadata validation passed: 45 locales')
          PY

      - name: Commit Welsh metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No Welsh metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Welsh localization in 0.9.0 beta'
          git fetch origin release/0.9.0-welsh
          git rebase origin/release/0.9.0-welsh
          git push origin HEAD:release/0.9.0-welsh
