name: Finalize Lao handoff

on:
  push:
    branches: [ release/0.9.0-lao ]
    paths:
      - scripts/finalize_lao_handoff.py
      - .github/workflows/finalize-lao-handoff.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.9.0-lao
          fetch-depth: 0

      - name: Finalize Lao handoffs
        run: python3 scripts/finalize_lao_handoff.py

      - name: Assert handoff state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path('PROJECT_HANDOFF.txt').read_text(encoding='utf-8')
          nxt = Path('NEXT_CHAT_HANDOFF.md').read_text(encoding='utf-8')
          expected_project = [
              '0.9.0 development currently has 67 locales:',
              '- 67: Lao / lo_la',
              'SIXTY-SEVEN IS NOT THE FINAL TARGET.',
              'LAO / LANGUAGE #67 FINAL STATUS',
              'Language #68 is the next expansion task.',
          ]
          expected_next = [
              'first **67 languages are complete',
              '#67 Lao — `lo_la / ລາວ`',
              'Start and finish **language #68**',
          ]
          missing = [x for x in expected_project if x not in project] + [x for x in expected_next if x not in nxt]
          if missing:
              raise SystemExit(f'Handoff assertions failed: {missing}')
          print('Lao handoff assertions passed; #68 is next.')
          PY

      - name: Validate repository JSON and whitespace
        run: |
          python3 scripts/validate.py
          git diff --check

      - name: Commit final Lao handoffs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.txt NEXT_CHAT_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'No handoff changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Lao localization handoff'
          git fetch origin release/0.9.0-lao
          git rebase origin/release/0.9.0-lao
          git push origin HEAD:release/0.9.0-lao
