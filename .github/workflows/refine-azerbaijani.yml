name: Refine Azerbaijani localization

on:
  push:
    branches:
      - release/0.9.0-azerbaijani
    paths:
      - scripts/refine_azerbaijani.py
      - .github/workflows/refine-azerbaijani.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-azerbaijani

      - name: Refine Azerbaijani terminology
        run: python3 scripts/refine_azerbaijani.py

      - name: Restrict add-on audits to Azerbaijani
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts=[
            'scripts/audit_medievalorigins_upstream.py','scripts/audit_ibarnorigins_upstream.py',
            'scripts/audit_origins_fantasy_upstream.py','scripts/audit_origins_backgrounds_upstream.py',
            'scripts/audit_origins_more_backgrounds_upstream.py','scripts/audit_origins_backgrounds_iss_upstream.py',
            'scripts/audit_origins_furries_upstream.py','scripts/audit_origins_classes_extended_upstream.py',
            'scripts/audit_origins_classes_iss_upstream.py','scripts/audit_origin_architect_upstream.py']
          for filename in scripts:
              p=Path(filename); src=p.read_text(encoding='utf-8')
              out,count=re.subn(r'^LOCALES\s*=.*$','LOCALES = ("az_az",)',src,count=1,flags=re.M)
              if count==0: out,count=re.subn(r'^DEFAULT_LOCALES\s*=.*$','DEFAULT_LOCALES = ("az_az",)',src,count=1,flags=re.M)
              if count!=1: raise SystemExit(f'Could not patch locale in {filename}')
              p.write_text(out,encoding='utf-8')
          PY

      - name: Strict audit Azerbaijani NeoOrigins
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref 860ecdb24e723983e93004ea8ceb5de90ccf0d70 --output build/az-refine-121 --locale az_az --fallback-namespace-glob 'neoorigins_az_common_*' --extra-namespace neoorigins_az_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 3c1c7365507679c836d3c14af5d4dd0654652e87 --output build/az-refine-261 --locale az_az --fallback-namespace-glob 'neoorigins_az_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 65864716a5a796fa1c51ec3e8a6d9640abebb4ca --output build/az-refine-262 --locale az_az --fallback-namespace-glob 'neoorigins_az_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Azerbaijani add-ons
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON
        run: python3 scripts/validate.py

      - name: Validate Azerbaijani contextual fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          files=list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/az_az.json'))
          all_data={}; values=[]
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8')); all_data.update(d); values.extend(map(str,d.values()))
          expected={
            'neoorigins.toggle.on':'Qabiliyyət aktivdir',
            'neoorigins.ultimine.no_power':'Origin-inin Ultimine qabiliyyəti yoxdur.',
            'gui.neoorigins.mob_creator.tab.spawn_rules':'Yaranma qaydaları',
            'gui.neoorigins.mob_creator.tab.drops':'Qənimət',
            'gui.neoorigins.creator.apply':'Tətbiq et',
            'origins.neoorigins.avian.name':'Avian',
            'power.neoorigins.blazeling_nether_born.name':'Nether-də doğulmuş',
            'power.origins_furries.pavlov.name':'Pavlov refleksi',
            'power.origins_furries.scales.name':'Pulcuqlar',
            'power.origins_furries.night_vision.name':'Gecə Görüşü',
            'originsmodernui.config.hud.show_level':'Origin Architect səviyyəsini göstər',
          }
          bad=[f'{k}={all_data.get(k)!r}' for k,v in expected.items() if all_data.get(k)!=v]
          if bad: raise SystemExit(f'Azerbaijani contextual fixes missing: {bad}')
          for i in range(1,65):
              k=f'key.neoorigins.hotkey.{i}'; want=f'Qısayol {i:02d}'
              if all_data.get(k)!=want: raise SystemExit(f'Azerbaijani hotkey normalization failed: {k}={all_data.get(k)!r}')
          text='\n'.join(values)
          forbidden=['Sizin mənşəyiniz mənimki ola bilməz','Kürü Qaydaları','Damlalar','Müraciət edin','Hollandiyada','Pavloved']
          found=[x for x in forbidden if x.lower() in text.lower()]
          if found: raise SystemExit(f'Azerbaijani false-friend guard failed: {found}')
          markers=len(re.findall(r'\b(?:və|bir|bu|sən|sənin|üçün|ilə|olan|olur|edir|etmək|zaman|əgər|daha|deyil|kimi|sonra|yalnız)\b',text.lower()))
          specific=len(re.findall(r'[əğıöüşç]',text,flags=re.I))
          if markers < 1200 or specific < 25000: raise SystemExit(f'Azerbaijani lexical sanity low: markers={markers}, specific={specific}')
          print(f'Azerbaijani refinement sanity passed: {markers} lexical markers, {specific} specific letters across {len(files)} files')
          PY

      - name: Restore audit scripts
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Commit Azerbaijani refinements
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'az_az.json' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then echo 'No Azerbaijani refinement changes.'; exit 0; fi
          git commit -m 'Refine Azerbaijani Minecraft terminology'
          git fetch origin release/0.9.0-azerbaijani
          git rebase origin/release/0.9.0-azerbaijani
          git push origin HEAD:release/0.9.0-azerbaijani
