name: Sync Hebrew handoff

on:
  push:
    branches:
      - release/0.9.0-beta
    paths:
      - scripts/update_handoff_hebrew.py
      - .github/workflows/sync-handoff-hebrew.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-beta
      - name: Update handoff
        run: python3 scripts/update_handoff_hebrew.py
      - name: Validate handoff
        run: |
          grep -F '0.9.0 development currently has 26 locales:' PROJECT_HANDOFF.txt
          grep -F -- '- 26: Hebrew / he_il' PROJECT_HANDOFF.txt
          grep -F 'NEXT LANGUAGE = language 27.' PROJECT_HANDOFF.txt
          grep -F 'run ID 34264247950: SUCCESS on all three jobs' PROJECT_HANDOFF.txt
          grep -F 'Hebrew-script sanity check passed: 71,247 Hebrew-range codepoints across 29 he_il source files' PROJECT_HANDOFF.txt
          grep -F 'metadata commit fed47392320e2f3caea70ac1cded1469cbe87560' PROJECT_HANDOFF.txt
      - name: Commit handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.txt
          if git diff --cached --quiet; then
            echo 'No handoff changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize Hebrew 0.9.0 handoff'
          git fetch origin release/0.9.0-beta
          git rebase origin/release/0.9.0-beta
          git push origin HEAD:release/0.9.0-beta
