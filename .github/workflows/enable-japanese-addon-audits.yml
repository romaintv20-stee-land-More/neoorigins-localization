name: Enable Japanese addon audits

on:
  push:
    branches:
      - release/0.8.0-japanese
    paths:
      - scripts/enable_japanese_addon_audits.py
      - .github/workflows/enable-japanese-addon-audits.yml

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.8.0-japanese
      - name: Enable Japanese in permanent addon audits
        run: python3 scripts/enable_japanese_addon_audits.py
      - name: Audit Origins Fantasy Japanese
        run: python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
      - name: Commit audit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit_*_upstream.py
          if git diff --cached --quiet; then
            echo "No audit updates"
          else
            git commit -m "Audit Japanese addon localizations"
            git push origin HEAD:release/0.8.0-japanese
          fi
