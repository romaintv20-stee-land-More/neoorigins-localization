name: Sync Azerbaijani 56-locale metadata

on:
  push:
    branches:
      - release/0.9.0-azerbaijani
    paths:
      - .github/workflows/sync-metadata-azerbaijani.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-azerbaijani

      - name: Update catalog metadata
        run: |
          python3 scripts/update_catalog_azerbaijani.py
          python3 scripts/generate_catalog.py

      - name: Update README metadata
        run: python3 scripts/update_readme_azerbaijani.py

      - name: Validate 56-locale metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          catalog=json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          if catalog['project']['supported_locale_count'] != 56:
              raise SystemExit('catalog locale count is not 56')
          for project in catalog['supported_projects']:
              for locale in ('af_za','az_az'):
                  if locale not in project['languages']:
                      raise SystemExit(f"{locale} missing from {project['id']}")
          readme=Path('README.md').read_text(encoding='utf-8')
          required=['Les cinquante-six langues','Afrikaans (`af_za`)','Azéri (`az_az`)','Pour l\'afrikaans :','Pour l\'azéri :','/ AF / AZ']
          missing=[item for item in required if item not in readme]
          if missing: raise SystemExit(f'README Azerbaijani markers missing: {missing}')
          catalog_md=Path('CATALOG.md').read_text(encoding='utf-8')
          for marker in ('af_za','az_az','Afrikaans','Azərbaycanca'):
              if marker not in catalog_md:
                  raise SystemExit(f'CATALOG.md marker missing: {marker}')
          print('Azerbaijani 56-locale metadata validation passed')
          PY

      - name: Commit Azerbaijani metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json CATALOG.md README.md
          if git diff --cached --quiet; then
            echo 'No Azerbaijani metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Document Azerbaijani localization in 0.9.0 beta'
          git fetch origin release/0.9.0-azerbaijani
          git rebase origin/release/0.9.0-azerbaijani
          git push origin HEAD:release/0.9.0-azerbaijani
