name: Bootstrap Gallo localization

on:
  push:
    branches:
      - release/1.0.0-gallo
    paths:
      - scripts/bootstrap_gallo.py
      - .github/workflows/bootstrap-gallo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/1.0.0-gallo

      - name: Restrict add-on audits to Gallo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          scripts = [
              'scripts/audit_medievalorigins_upstream.py',
              'scripts/audit_ibarnorigins_upstream.py',
              'scripts/audit_origins_fantasy_upstream.py',
              'scripts/audit_origins_backgrounds_upstream.py',
              'scripts/audit_origins_more_backgrounds_upstream.py',
              'scripts/audit_origins_backgrounds_iss_upstream.py',
              'scripts/audit_origins_furries_upstream.py',
              'scripts/audit_origins_classes_extended_upstream.py',
              'scripts/audit_origins_classes_iss_upstream.py',
              'scripts/audit_origin_architect_upstream.py',
          ]
          for filename in scripts:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'^LOCALES\s*=.*$', 'LOCALES = ("go_fr",)', text, count=1, flags=re.M)
              if count == 0:
                  updated, count = re.subn(r'^DEFAULT_LOCALES\s*=.*$', 'DEFAULT_LOCALES = ("go_fr",)', text, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f'Could not patch locale list in {filename}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Discover Gallo NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/go-discovery-mc-1.21.1 --locale go_fr
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/go-discovery-mc-26.1 --locale go_fr
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/go-discovery-mc-26.2 --locale go_fr

      - name: Discover Gallo add-on coverage and English sources
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format
          python3 scripts/audit_origins_fantasy_upstream.py
          python3 scripts/audit_origins_backgrounds_upstream.py
          python3 scripts/audit_origins_more_backgrounds_upstream.py
          python3 scripts/audit_origins_backgrounds_iss_upstream.py
          python3 scripts/audit_origins_furries_upstream.py
          python3 scripts/audit_origins_classes_extended_upstream.py
          python3 scripts/audit_origins_classes_iss_upstream.py
          python3 scripts/audit_origin_architect_upstream.py

      - name: Generate Gallo fallback files
        run: python3 scripts/bootstrap_gallo.py

      - name: Prune add-on keys already translated upstream
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --prune
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --prune
          python3 scripts/audit_origins_fantasy_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_more_backgrounds_upstream.py --prune
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --prune
          python3 scripts/audit_origins_furries_upstream.py --prune
          python3 scripts/audit_origins_classes_extended_upstream.py --prune
          python3 scripts/audit_origins_classes_iss_upstream.py --prune
          python3 scripts/audit_origin_architect_upstream.py --prune

      - name: Strict audit Gallo NeoOrigins coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref af467a3bc118f6bbc0970d68f7e03fa631d7e6f2 --output build/go-audit-mc-1.21.1 --locale go_fr --fallback-namespace-glob 'neoorigins_go_common_*' --extra-namespace neoorigins_go_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref aa207ef14cf3b938e28b4081162701953957c1d5 --output build/go-audit-mc-26.1 --locale go_fr --fallback-namespace-glob 'neoorigins_go_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 511cadcafe3027d2a56b4448652ec9b74e2f3b07 --output build/go-audit-mc-26.2 --locale go_fr --fallback-namespace-glob 'neoorigins_go_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Strict audit Gallo add-on coverage
        run: |
          python3 scripts/audit_medievalorigins_upstream.py --ref 1.21.1-fabric --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_ibarnorigins_upstream.py --ref multiloader-1.21.1-new-pack-format --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_fantasy_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_more_backgrounds_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_backgrounds_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_furries_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_extended_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origins_classes_iss_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_origin_architect_upstream.py --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Sanity-check Gallo text
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/go_fr.json'))
          if len(files) != 29:
              raise SystemExit(f'Expected 29 go_fr localization files, found {len(files)}')
          values = [str(v) for path in files for v in json.loads(path.read_text(encoding='utf-8')).values()]
          text = '\n'.join(values)
          markers = len(re.findall(r'\b(?:servouer|pouint|eune|qheuqe|blloqe|vilaije|deûz|asteure|qhi|qe|ao|châqe|mettr|terouer|qeriature|alivë|bouéte|comande|ghiments|dizou|qheur|cië|haot|bergolin|flleche|cllë|uzinouer)\b', text, re.I))
          if markers < 150:
              raise SystemExit(f'Gallo lexical sanity too low: {markers}')
          if re.search(r'[А-Яа-яЁё一-龯ぁ-ゟ゠-ヿ]', text):
              raise SystemExit('Unexpected non-Latin script found in Gallo output')
          print(f'Gallo sanity passed: {markers} dialect markers across {len(files)} files')
          PY

      - name: Add Gallo target packaging switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle')
          text = path.read_text(encoding='utf-8')
          if 'includeGallo121Translations' not in text:
              anchor = "def includeFriulian121Translations = (project.findProperty('include_friulian_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n"
              if anchor not in text:
                  raise SystemExit('Friulian Gradle definition anchor not found')
              text = text.replace(anchor, anchor + "def includeGallo121Translations = (project.findProperty('include_gallo_121_translations') ?: defaultInclude121Translations.toString()).toBoolean()\n", 1)

              anchor = "    inputs.property 'include_friulian_121_translations', includeFriulian121Translations\n"
              if anchor not in text:
                  raise SystemExit('Friulian Gradle input anchor not found')
              text = text.replace(anchor, anchor + "    inputs.property 'include_gallo_121_translations', includeGallo121Translations\n", 1)

              anchor = "    if (!includeFriulian121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_fur_121/**'\n    }\n"
              if anchor not in text:
                  raise SystemExit('Friulian Gradle exclusion anchor not found')
              text = text.replace(anchor, anchor + "\n    if (!includeGallo121Translations) {\n        exclude 'resourcepacks/fallback_localizations/assets/neoorigins_go_121/**'\n    }\n", 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Restore temporary audit-script changes
        if: always()
        run: git checkout HEAD -- scripts/audit_*_upstream.py

      - name: Upload Gallo audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gallo-localization-audits-${{ github.sha }}
          path: |
            build/go-discovery-*
            build/go-audit-*
            build/*-upstream-audit
          if-no-files-found: warn

      - name: Commit validated Gallo translations
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'go_fr.json' -print0 | xargs -0 -r git add
          git add build.gradle
          if git diff --cached --quiet; then
            echo 'No Gallo translation changes to commit.'
            exit 0
          fi
          git commit -m 'Add Gallo localization fallback'
          git fetch origin release/1.0.0-gallo
          git rebase origin/release/1.0.0-gallo
          git push origin HEAD:release/1.0.0-gallo
