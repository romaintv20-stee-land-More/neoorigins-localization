name: Update NeoOrigins baseline to 2.2.27

on:
  push:
    branches:
      - release/0.9.0-beta
    paths:
      - .github/workflows/update-neoorigins-2.2.27-baseline.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-beta

      - name: Update baseline metadata and handoffs
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          refs = {
              '1.21.1': 'af467a3bc118f6bbc0970d68f7e03fa631d7e6f2',
              '26.1.x': 'aa207ef14cf3b938e28b4081162701953957c1d5',
              '26.2': '511cadcafe3027d2a56b4448652ec9b74e2f3b07',
          }
          audit = {
              'run_id': 34400432957,
              'job_id': 102630695715,
              'artifact_id': 10123223361,
              'artifact_sha256': '78be2fc126a1f7356e871f692bc716e8c3973b7b246b9b450d41aac8ab767155',
              'english_unchanged_from_2_2_26': True,
              'known_legacy_gaps': {
                  '1.21.1': {'it_it': 52, 'pl_pl': 52, 'ru_ru': 52, 'tr_tr': 2281, 'zh_cn': 52, 'cs_cz': 2281, 'hu_hu': 2296},
                  '26.1.x': {'it_it': 52, 'pl_pl': 52, 'ru_ru': 52, 'tr_tr': 2278, 'zh_cn': 52, 'cs_cz': 2278, 'hu_hu': 2293},
                  '26.2': {'tr_tr': 2278, 'cs_cz': 2278, 'hu_hu': 2293},
              },
          }

          # catalog.json
          path = Path('catalog.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          neo = next(p for p in data['supported_projects'] if p['id'] == 'neoorigins')
          neo['compatibility']['version'] = '2.2.27'
          neo['compatibility']['audit_refs'] = refs
          neo['compatibility']['baseline_audit_2_2_27'] = audit
          neo['compatibility']['coverage_note'] = (
              'NeoOrigins 2.2.27 has the same en_us localization payload as 2.2.26 on all three targets. '
              'A full 58-locale audit found pre-existing incomplete legacy coverage in it_it, pl_pl, ru_ru, '
              'tr_tr, zh_cn, cs_cz and hu_hu; all other 51 locales are complete against 2.2.27.'
          )
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Audit default ref for future ad-hoc audits.
          path = Path('scripts/audit_neoorigins_upstream.py')
          text = path.read_text(encoding='utf-8')
          old = 'DEFAULT_REF = "v2.2.26"'
          if old not in text and 'DEFAULT_REF = "v2.2.27"' not in text:
              raise SystemExit('NeoOrigins audit DEFAULT_REF anchor not found')
          text = text.replace(old, 'DEFAULT_REF = "v2.2.27"')
          path.write_text(text, encoding='utf-8')

          # PROJECT_HANDOFF: replace the entire upstream baseline section.
          path = Path('PROJECT_HANDOFF.txt')
          text = path.read_text(encoding='utf-8')
          replacement = '''5. NEOORIGINS UPSTREAM BASELINE
-------------------------------
Current 0.9.0 baseline is audited against NeoOrigins 2.2.27:
- 1.21.1: af467a3bc118f6bbc0970d68f7e03fa631d7e6f2
- 26.1.x: aa207ef14cf3b938e28b4081162701953957c1d5
- 26.2: 511cadcafe3027d2a56b4448652ec9b74e2f3b07

NeoOrigins 2.2.27 is a NeoForge hotfix and its en_us localization payload is byte-for-byte unchanged from the audited 2.2.26 payload on all three targets:
- 1.21.1: 2296 English keys
- 26.1.x: 2307 English keys
- 26.2: 2307 English keys
Therefore 2.2.27 itself requires ZERO new translations.

Full 58-locale baseline audit (2026-09-09):
- run: 34400432957
- job: 102630695715
- artifact: 10123223361
- artifact SHA256: 78be2fc126a1f7356e871f692bc716e8c3973b7b246b9b450d41aac8ab767155
- overlap errors: 0
- placeholder errors: 0

IMPORTANT LEGACY COVERAGE FINDING:
The full audit exposed seven historical locales that were already incomplete before 2.2.27. This is NOT a 2.2.27 regression and must not be described as new translation work from that update.
- 1.21.1 missing: it_it 52, pl_pl 52, ru_ru 52, tr_tr 2281, zh_cn 52, cs_cz 2281, hu_hu 2296
- 26.1.x missing: it_it 52, pl_pl 52, ru_ru 52, tr_tr 2278, zh_cn 52, cs_cz 2278, hu_hu 2293
- 26.2 missing: tr_tr 2278, cs_cz 2278, hu_hu 2293
- The other 51 locales are complete against the 2.2.27 English keysets on all three targets.

The physical namespace neoorigins_226 remains intentionally named after the update that introduced those fallback strings; do NOT rename it merely because the audit baseline moved to 2.2.27.

Before PUBLISHING 0.9.0, re-check whether NeoOrigins upstream has moved beyond 2.2.27 and re-audit against the final intended reference. Also decide whether to complete the seven legacy partial locales before publication.

'''
          text, count = re.subn(
              r'5\. NEOORIGINS UPSTREAM BASELINE\n-+\n.*?(?=6\. ADD-ON COVERAGE BASELINES\n)',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('PROJECT_HANDOFF NeoOrigins baseline section not replaced')
          path.write_text(text, encoding='utf-8')

          # NEXT_CHAT_HANDOFF: add the newly verified upstream state before the Chuvash details.
          path = Path('NEXT_CHAT_HANDOFF.md')
          text = path.read_text(encoding='utf-8')
          marker = '## #58 Chuvash verification\n'
          section = '''## NeoOrigins 2.2.27 baseline audit

- Current upstream baseline: **NeoOrigins 2.2.27**.
- 1.21.1 ref: `af467a3bc118f6bbc0970d68f7e03fa631d7e6f2`
- 26.1.x ref: `aa207ef14cf3b938e28b4081162701953957c1d5`
- 26.2 ref: `511cadcafe3027d2a56b4448652ec9b74e2f3b07`
- `en_us.json` is unchanged from 2.2.26 on all three targets, so **2.2.27 requires zero new translation strings**.
- Full audit: run `34400432957`, job `102630695715`, artifact `10123223361`, SHA256 `78be2fc126a1f7356e871f692bc716e8c3973b7b246b9b450d41aac8ab767155`.
- Audit found **0 overlap errors** and **0 placeholder errors**.

Legacy gaps discovered by that full audit (pre-existing before 2.2.27):
- 1.21.1: `it_it` 52, `pl_pl` 52, `ru_ru` 52, `tr_tr` 2281, `zh_cn` 52, `cs_cz` 2281, `hu_hu` 2296 missing.
- 26.1.x: `it_it` 52, `pl_pl` 52, `ru_ru` 52, `tr_tr` 2278, `zh_cn` 52, `cs_cz` 2278, `hu_hu` 2293 missing.
- 26.2: `tr_tr` 2278, `cs_cz` 2278, `hu_hu` 2293 missing.
- The other **51 locales** are complete against 2.2.27 on all three targets.

Do not attribute those seven legacy gaps to NeoOrigins 2.2.27. Before release, either complete them or keep the partial-coverage status explicit.

'''
          if '## NeoOrigins 2.2.27 baseline audit' not in text:
              if marker not in text:
                  raise SystemExit('NEXT_CHAT_HANDOFF insertion marker not found')
              text = text.replace(marker, section + marker, 1)
          path.write_text(text, encoding='utf-8')

          # README: update the public baseline statement and make partial historical coverage explicit.
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old_refs = '''La couverture de la 0.9.0 est auditée contre **NeoOrigins 2.2.26** :

- 1.21.1 : commit `860ecdb24e723983e93004ea8ceb5de90ccf0d70` ;
- 26.1.x : commit `3c1c7365507679c836d3c14af5d4dd0654652e87` ;
- 26.2 : commit `65864716a5a796fa1c51ec3e8a6d9640abebb4ca`.

NeoOrigins Localization n'impose pas de dépendance dure sur la version 2.2.26 : le mod peut charger avec une version NeoOrigins plus récente, mais la **couverture complète garantie ici correspond à 2.2.26**.

La mise à jour 2.2.26 ajoute un delta commun `neoorigins_226` pour les nouvelles chaînes du sélecteur, Step Assist et Caveborn. La ligne 26.1.x possède en plus `neoorigins_26_1` pour ses raccourcis, compétences et réglages propres, tandis que 26.2 conserve `neoorigins_26_2`.
'''
          new_refs = '''La référence d'audit actuelle est **NeoOrigins 2.2.27** :

- 1.21.1 : commit `af467a3bc118f6bbc0970d68f7e03fa631d7e6f2` ;
- 26.1.x : commit `aa207ef14cf3b938e28b4081162701953957c1d5` ;
- 26.2 : commit `511cadcafe3027d2a56b4448652ec9b74e2f3b07`.

Le fichier anglais `en_us.json` de NeoOrigins 2.2.27 est **strictement identique à celui de 2.2.26** sur les trois cibles : cette mise à jour n'ajoute donc aucune chaîne à traduire. La 2.2.27 est essentiellement un hotfix NeoForge.

Un audit intégral des 58 locales a toutefois révélé des lacunes historiques, déjà présentes avant la 2.2.27 : `it_it`, `pl_pl`, `ru_ru` et `zh_cn` ont chacun 52 clés manquantes sur 1.21.1 et 26.1.x ; `tr_tr`, `cs_cz` et `hu_hu` restent très partiels sur les trois cibles. Les 51 autres locales sont complètes contre les jeux de clés 2.2.27. L'audit de référence est le run `34400432957`.

Le namespace physique `neoorigins_226` conserve son nom historique car il contient le delta introduit avec la 2.2.26 ; il n'est pas renommé lors du passage de la baseline d'audit à 2.2.27.
'''
          if old_refs not in text:
              raise SystemExit('README old NeoOrigins reference block not found')
          text = text.replace(old_refs, new_refs, 1)

          old_cs = '''Pour le tchèque :

- **1.21.1 : 2 296/2 296 clés** couvertes ;
- **26.1.x : 2 307/2 307 clés** couvertes ;
- **26.2 : 2 307/2 307 clés** couvertes.
'''
          new_cs = '''Pour le tchèque (couverture historique partielle à compléter) :

- **1.21.1 : 15/2 296 clés** couvertes ;
- **26.1.x : 29/2 307 clés** couvertes ;
- **26.2 : 29/2 307 clés** couvertes.
'''
          if old_cs not in text:
              raise SystemExit('README Czech coverage block not found')
          text = text.replace(old_cs, new_cs, 1)

          old_hu = '''Pour le hongrois :

- **1.21.1 : 2 296/2 296 clés** couvertes ;
- **26.1.x : 2 307/2 307 clés** couvertes ;
- **26.2 : 2 307/2 307 clés** couvertes.
'''
          new_hu = '''Pour le hongrois (couverture historique partielle à compléter) :

- **1.21.1 : 0/2 296 clés** couvertes ;
- **26.1.x : 14/2 307 clés** couvertes ;
- **26.2 : 14/2 307 clés** couvertes.
'''
          if old_hu not in text:
              raise SystemExit('README Hungarian coverage block not found')
          text = text.replace(old_hu, new_hu, 1)
          path.write_text(text, encoding='utf-8')

          # CATALOG.md: state the baseline and partial-coverage finding without altering language availability listings.
          path = Path('CATALOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Projets et langues\n'
          note = '''## Référence NeoOrigins

Baseline auditée : **NeoOrigins 2.2.27** (`af467a3` pour 1.21.1, `aa207ef` pour 26.1.x, `511cadc` pour 26.2). Les chaînes anglaises sont identiques à 2.2.26, donc la 2.2.27 ne demande aucune nouvelle traduction. L'audit complet des 58 locales (run `34400432957`) a néanmoins identifié sept couvertures historiques partielles : `it_it`, `pl_pl`, `ru_ru`, `tr_tr`, `zh_cn`, `cs_cz` et `hu_hu`. Les 51 autres locales sont complètes contre la baseline 2.2.27.

'''
          if '## Référence NeoOrigins' not in text:
              if marker not in text:
                  raise SystemExit('CATALOG insertion marker not found')
              text = text.replace(marker, note + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate metadata
        run: |
          python3 -m json.tool catalog.json >/dev/null
          python3 -m py_compile scripts/audit_neoorigins_upstream.py
          grep -n "2.2.27\|legacy\|historique" PROJECT_HANDOFF.txt NEXT_CHAT_HANDOFF.md README.md CATALOG.md | head -80
          git diff --check
          git diff --stat

      - name: Commit baseline update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json scripts/audit_neoorigins_upstream.py PROJECT_HANDOFF.txt NEXT_CHAT_HANDOFF.md README.md CATALOG.md
          if git diff --cached --quiet; then
            echo 'No baseline metadata changes to commit.'
            exit 0
          fi
          git commit -m 'Set NeoOrigins 2.2.27 audit baseline'
          git fetch origin release/0.9.0-beta
          git rebase origin/release/0.9.0-beta
          git push origin HEAD:release/0.9.0-beta
