name: Audit Japanese NeoOrigins coverage

on:
  push:
    branches:
      - release/0.8.0-japanese
    paths:
      - .github/workflows/audit-japanese-neoorigins.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc-1.21.1
            ref: 860ecdb24e723983e93004ea8ceb5de90ccf0d70
            extra: neoorigins_121_batch1
          - target: mc-26.1.x
            ref: 3c1c7365507679c836d3c14af5d4dd0654652e87
            extra: neoorigins_26_1
          - target: mc-26.2
            ref: 65864716a5a796fa1c51ec3e8a6d9640abebb4ca
            extra: neoorigins_26_2
    steps:
      - uses: actions/checkout@v4
      - name: Audit Japanese official coverage
        run: |
          python3 scripts/audit_neoorigins_upstream.py \
            --ref "${{ matrix.ref }}" \
            --locale ja_jp \
            --extra-namespace neoorigins_226 \
            --extra-namespace "${{ matrix.extra }}" \
            --output "build/japanese-${{ matrix.target }}"
