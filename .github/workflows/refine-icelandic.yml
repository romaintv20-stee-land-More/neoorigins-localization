name: Refine Icelandic localization

on:
  push:
    branches:
      - release/0.9.0-icelandic
    paths:
      - scripts/refine_icelandic.py
      - .github/workflows/refine-icelandic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: release/0.9.0-icelandic

      - name: Apply contextual Icelandic fixes
        run: python3 scripts/refine_icelandic.py

      - name: Validate JSON localization structure
        run: python3 scripts/validate.py

      - name: Check Icelandic placeholders against NeoOrigins upstream
        run: |
          python3 scripts/audit_neoorigins_upstream.py --ref 860ecdb24e723983e93004ea8ceb5de90ccf0d70 --output build/is-refine-audit-121 --locale is_is --fallback-namespace-glob 'neoorigins_is_common_*' --extra-namespace neoorigins_is_121 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 3c1c7365507679c836d3c14af5d4dd0654652e87 --output build/is-refine-audit-261 --locale is_is --fallback-namespace-glob 'neoorigins_is_common_*' --extra-namespace neoorigins_26_1 --fail-on-overlap --fail-on-missing --fail-on-placeholders
          python3 scripts/audit_neoorigins_upstream.py --ref 65864716a5a796fa1c51ec3e8a6d9640abebb4ca --output build/is-refine-audit-262 --locale is_is --fallback-namespace-glob 'neoorigins_is_common_*' --extra-namespace neoorigins_26_2 --fail-on-overlap --fail-on-missing --fail-on-placeholders

      - name: Sanity-check corrected Icelandic terminology
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          files = list(Path('src/main/resources/resourcepacks/fallback_localizations/assets').glob('**/lang/is_is.json'))
          text = '\n'.join(str(v) for p in files for v in json.loads(p.read_text(encoding='utf-8')).values())
          icelandic_specific = len(re.findall(r'[ÞþÐðÆæÖö]', text))
          bad = [
              'Rafmagn virkt', 'Rafmagn óvirkt', 'Uppruni þinn getur ekki verið minn.',
              'Skapari mafíuuppruna', 'Sækja um', '"Vigt"', 'Pavloved',
          ]
          remaining = [item for item in bad if item in text]
          if remaining:
              raise SystemExit(f'Known Icelandic false-friends remain: {remaining}')
          if icelandic_specific < 300:
              raise SystemExit(f'Icelandic-specific character sanity check too low: {icelandic_specific}')
          print(f'Icelandic refinement sanity passed: {icelandic_specific} Icelandic-specific chars across {len(files)} files')
          PY

      - name: Commit refined Icelandic translations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find src/main/resources/resourcepacks/fallback_localizations/assets -type f -name 'is_is.json' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo 'No Icelandic refinement changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Icelandic Minecraft terminology'
          git fetch origin release/0.9.0-icelandic
          git rebase origin/release/0.9.0-icelandic
          git push origin HEAD:release/0.9.0-icelandic
