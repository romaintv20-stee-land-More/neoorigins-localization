name: Audit Czech NeoOrigins

on:
  push:
    branches:
      - release/0.8.0-czech
    paths:
      - .github/workflows/audit-czech-neoorigins.yml
      - src/main/resources/resourcepacks/fallback_localizations/assets/neoorigins_cs_*/lang/cs_cz.json
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate localization JSON
        run: python3 scripts/validate.py
      - name: Audit Czech against NeoOrigins 2.2.25
        run: |
          python3 scripts/audit_neoorigins_upstream.py \
            --ref v2.2.25 \
            --locale cs_cz \
            --fallback-namespace-glob 'neoorigins_cs_*' \
            --output build/czech-neoorigins-audit \
            --fail-on-overlap \
            --fail-on-missing
      - name: Verify placeholders and exact key count
        run: |
          python3 - <<'PY'
          import glob, json, re, urllib.request
          url = 'https://raw.githubusercontent.com/CyberDay1/NeoOrigins/v2.2.25/src/main/resources/assets/neoorigins/lang/en_us.json'
          with urllib.request.urlopen(url) as r:
              en = json.load(r)
          cs = {}
          files = sorted(glob.glob('src/main/resources/resourcepacks/fallback_localizations/assets/neoorigins_cs_*/lang/cs_cz.json'))
          assert len(files) == 19, files
          for path in files:
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              overlap = set(cs) & set(data)
              assert not overlap, (path, sorted(overlap)[:10])
              cs.update(data)
          assert len(en) == 2281, len(en)
          assert set(cs) == set(en), (len(cs), len(en), sorted(set(en)-set(cs))[:10], sorted(set(cs)-set(en))[:10])
          token = re.compile(r'%(?:\d+\$)?[a-zA-Z%]')
          errors = []
          for key in en:
              a = token.findall(str(en[key]))
              b = token.findall(str(cs[key]))
              if a != b:
                  errors.append((key, a, b))
          assert not errors, errors[:20]
          print(f'Czech NeoOrigins: {len(cs)}/{len(en)} keys; 19 files; placeholders OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: czech-neoorigins-audit
          path: build/czech-neoorigins-audit
